/* =====================================================================
   KT-Scan design system
   Ink (toner navy) on cool platen greys; the only colour is scanner-beam blue.
   Signature: crop marks. Library = light "desk", camera/editor = dark "workspace".
   ===================================================================== */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface2:#E4E9F1; --ink:#101A2C; --ink2:#52607A; --line:#D3DAE5;
  --accent:#06709C; --accent2:#46C6F2; --on-accent:#fff; --accent-soft:color-mix(in srgb,var(--accent) 11%,transparent);
  --primary:#101A2C; --on-primary:#fff;
  --ok:#13875A; --warn:#B26B00; --danger:#C23B36; --love:#B0325E;
  --scan:#46C6F2;
  --shadow:0 1px 2px rgba(16,26,44,.07),0 10px 24px -14px rgba(16,26,44,.38);
  --stage:#161E2E;
  --r-sheet:3px; --r-s:8px; --r-m:12px; --r-l:18px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --font:"IBM Plex Sans Thai","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai","Leelawadee UI","Thonburi","Sukhumvit Set",Tahoma,"Helvetica Neue",Arial,sans-serif;
}
:root[data-theme=dark]{
  --bg:#0A111F; --surface:#111B2E; --surface2:#1A2640; --ink:#E8EEF8; --ink2:#9AA9C4; --line:#24324D;
  --accent:#5CCBF5; --on-accent:#041824; --primary:#E8EEF8; --on-primary:#0A111F; --love:#FF86A9;
  --stage:#060B15;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 28px -14px rgba(0,0,0,.7);
}
/* dark workspace: the editor keeps the same look in both themes, so the page is judged on a neutral stage */
.edit{
  --bg:#0E1626; --surface:#142036; --surface2:#1C2B47; --ink:#EAF0FA; --ink2:#9FB0CC; --line:#26354F;
  --accent:#5CCBF5; --on-accent:#041824; --primary:#EAF0FA; --on-primary:#0E1626; --stage:#080D18;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;overscroll-behavior:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{position:fixed;inset:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-s)}
.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.i.s{width:18px;height:18px}
.i.fill{fill:currentColor;stroke:none}
.grow{flex:1}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}

/* crop marks — the app's signature. Add .cm to a positioned box; they appear on hover / focus / selection */
.cm::after{content:"";position:absolute;inset:-7px;pointer-events:none;opacity:0;transition:opacity .15s;
  --m:var(--accent);
  background:
    linear-gradient(var(--m),var(--m)) 0 0/15px 1.5px no-repeat,linear-gradient(var(--m),var(--m)) 0 0/1.5px 15px no-repeat,
    linear-gradient(var(--m),var(--m)) 100% 0/15px 1.5px no-repeat,linear-gradient(var(--m),var(--m)) 100% 0/1.5px 15px no-repeat,
    linear-gradient(var(--m),var(--m)) 0 100%/15px 1.5px no-repeat,linear-gradient(var(--m),var(--m)) 0 100%/1.5px 15px no-repeat,
    linear-gradient(var(--m),var(--m)) 100% 100%/15px 1.5px no-repeat,linear-gradient(var(--m),var(--m)) 100% 100%/1.5px 15px no-repeat}
@media (hover:hover){.cm:hover::after{opacity:1}}
.cm:focus-visible::after,.cm.sel::after,.cm:active::after{opacity:1}

/* ---------- views ---------- */
#app{position:absolute;inset:0}
.view{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.view.active{display:flex;animation:viewIn .18s ease both}
@keyframes viewIn{from{opacity:0}to{opacity:1}}
.bar{display:flex;align-items:center;gap:4px;padding:calc(var(--st) + 6px) calc(var(--sr) + 12px) 6px calc(var(--sl) + 12px);min-height:calc(58px + var(--st));flex:none;border-bottom:1px solid var(--line)}
.bar h1{font-size:1.0625rem;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:var(--r-m);display:grid;place-items:center;color:inherit;flex:none;transition:background .15s}
.icon-btn:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.icon-btn:active{background:color-mix(in srgb,var(--ink) 13%,transparent)}
.icon-btn[disabled]{opacity:.35;pointer-events:none}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{max-width:1180px;margin:0 auto;padding:6px calc(var(--sr) + 18px) 130px calc(var(--sl) + 18px)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:var(--r-m);font-weight:600;background:var(--surface2);color:var(--ink);transition:transform .1s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:hover{background:color-mix(in srgb,var(--surface2) 80%,var(--ink) 8%)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:color-mix(in srgb,var(--primary) 88%,var(--accent) 12%)}
.btn.ghost{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 35%,var(--line))}
.btn.danger{color:var(--danger)}
.btn.big{min-height:52px;padding:0 26px;font-size:1rem;border-radius:14px}
.btn.sm{min-height:38px;padding:0 14px;font-size:.875rem;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- brand ---------- */
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1875rem;letter-spacing:-.005em}
.brand svg{width:30px;height:30px;border-radius:8px}
.brand b{font-weight:500;color:var(--ink2)}

/* ---------- home ---------- */
.lib-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;margin:18px 0 18px}
.lib-bar:not(:has(>:not([hidden]))){display:none}
.lib-bar h2{margin:0;font-size:1.375rem;font-weight:600;letter-spacing:-.01em;flex:1 1 auto;white-space:nowrap}
.lib-bar h2 span{color:var(--ink2);font-weight:400;font-size:1rem;margin-left:8px;font-variant-numeric:tabular-nums}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r-m);padding:0 14px;height:44px;box-shadow:inset 0 0 0 1px var(--line);flex:1 1 100%;transition:box-shadow .15s}
.search:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.search input{flex:1;border:0;background:none;outline:0;min-width:0;height:100%}
.search .i{color:var(--ink2);width:19px;height:19px}
@media (min-width:640px){.search{flex:0 1 340px}}
.grid{display:grid;gap:18px}
.grid.docs{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:26px 18px}
.grid.pages{grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:24px 16px}
@media (min-width:760px){.grid.docs{grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:34px 24px}.grid.pages{grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:34px 24px}}
.dcard{position:relative;cursor:pointer;display:flex;flex-direction:column;gap:12px;border-radius:var(--r-s);outline-offset:6px}
.dthumb{position:relative;aspect-ratio:3/4;background:var(--surface2);display:grid;place-items:center;border-radius:var(--r-sheet);box-shadow:var(--shadow),0 0 0 1px var(--line);transition:transform .15s}
.dthumb::after{content:"";position:absolute;inset:-7px;pointer-events:none;opacity:0;transition:opacity .15s;--m:var(--accent);
  background:linear-gradient(var(--m),var(--m)) 0 0/15px 1.5px no-repeat,linear-gradient(var(--m),var(--m)) 0 0/1.5px 15px no-repeat,linear-gradient(var(--m),var(--m)) 100% 0/15px 1.5px no-repeat,linear-gradient(var(--m),var(--m)) 100% 0/1.5px 15px no-repeat,linear-gradient(var(--m),var(--m)) 0 100%/15px 1.5px no-repeat,linear-gradient(var(--m),var(--m)) 0 100%/1.5px 15px no-repeat,linear-gradient(var(--m),var(--m)) 100% 100%/15px 1.5px no-repeat,linear-gradient(var(--m),var(--m)) 100% 100%/1.5px 15px no-repeat}
@media (hover:hover){.dcard:hover .dthumb::after{opacity:1}}
.dcard:focus-visible .dthumb::after,.dcard:active .dthumb::after{opacity:1}
.dcard:focus-visible{outline:0}
.dthumb img{width:100%;height:100%;object-fit:contain;display:block;background:#fff;border-radius:var(--r-sheet)}
.dthumb .stack{position:absolute;right:8px;top:8px;background:rgba(16,26,44,.78);color:#fff;font-size:.75rem;font-weight:600;min-width:24px;height:24px;display:grid;place-items:center;padding:0 7px;border-radius:7px;font-variant-numeric:tabular-nums}
.dmeta{display:flex;align-items:flex-start;gap:4px;padding:0 0 0 2px}
.dmeta .t{flex:1;min-width:0}
.dmeta .n{font-weight:600;font-size:.9375rem;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dmeta .s{font-size:.8125rem;color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
.dmeta .icon-btn{width:34px;height:34px;margin:-5px -6px 0 0;border-radius:10px}
.skel{background:linear-gradient(100deg,var(--surface2) 30%,color-mix(in srgb,var(--surface2) 55%,var(--surface)) 50%,var(--surface2) 70%);background-size:200% 100%;animation:shimmer 1.3s infinite linear}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

/* empty state: scanner bed */
.empty{max-width:560px;margin:14px auto 0}
.hero-card{position:relative;overflow:hidden;border-radius:var(--r-l);background:linear-gradient(165deg,#18253F 0%,#0C1424 100%);color:#fff;box-shadow:var(--shadow)}
.hero-card svg.hero{display:block;width:100%;height:auto}
.hero-card .beam{animation:beam 3.4s cubic-bezier(.45,.05,.3,1) .5s 1 both}
@keyframes beam{0%{transform:translateY(20px)}55%{transform:translateY(172px)}100%{transform:translateY(98px)}}
.hero-card .tx{padding:4px 22px 24px}
.hero-card h2{font-size:1.5rem;font-weight:600;line-height:1.35;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance}
.hero-card p{margin:0;color:#B4C2DA;font-size:.9375rem}
.feat{list-style:none;padding:0;margin:8px 0 0;display:grid;text-align:left}
.feat li{display:flex;gap:14px;align-items:flex-start;padding:15px 2px;border-bottom:1px solid var(--line)}
.feat li:last-child{border-bottom:0}
.feat .ft{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.feat .ft .i{width:20px;height:20px}
.feat b{display:block;font-size:.9375rem;font-weight:600}
.feat span{font-size:.875rem;color:var(--ink2);display:block}
.foot{color:var(--ink2);font-size:.8125rem;text-align:center;margin:34px 0 0}
.fabbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:34px calc(var(--sr) + 16px) calc(var(--sb) + 16px) calc(var(--sl) + 16px);background:linear-gradient(to top,var(--bg) 40%,transparent);pointer-events:none}
.fabbar .in{pointer-events:auto;display:flex;gap:8px;padding:7px;border-radius:20px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 0 0 1px var(--line),0 18px 36px -16px rgba(16,26,44,.5);width:min(440px,100%)}
.fabbar .btn{flex:1 1 0;pointer-events:auto}
.fabbar .btn.primary{flex:1.4 1 0}
.fabbar .btn.ghost{box-shadow:none;background:transparent}
.fabbar .btn.ghost:hover{background:color-mix(in srgb,var(--ink) 7%,transparent);box-shadow:none}
@media (min-width:900px){
  #vHome .bar{padding-right:calc(var(--sr) + 18px);padding-left:calc(var(--sl) + 18px)}
  .fabbar{top:calc(var(--st) + 8px);bottom:auto;left:auto;right:calc(var(--sr) + 250px);padding:0;background:none;justify-content:flex-end;height:42px}
  .fabbar .in{width:auto;padding:0;gap:8px;background:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  .fabbar .btn.big{min-height:42px;padding:0 18px;font-size:.9375rem;border-radius:11px}
  .fabbar .btn.ghost{box-shadow:inset 0 0 0 1px var(--line);background:var(--surface)}
  .wrap{padding-bottom:60px;padding-top:6px}
  .empty{max-width:640px;margin-top:40px}
}

/* ---------- document view ---------- */
.pcard{position:relative;cursor:pointer;user-select:none;-webkit-user-select:none;border-radius:var(--r-s)}
.pcard .pimg{position:relative;aspect-ratio:3/4;display:grid;place-items:center;border-radius:var(--r-sheet);background:var(--surface2);box-shadow:var(--shadow),0 0 0 1px var(--line);transition:box-shadow .15s}
.pcard img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:var(--r-sheet);pointer-events:none;-webkit-user-drag:none}
.pcard .pn{text-align:center;font-size:.8125rem;font-weight:600;padding:10px 0 0;color:var(--ink2);font-variant-numeric:tabular-nums}
.pcard.drop .pimg{box-shadow:0 0 0 2px var(--accent),0 0 0 6px var(--accent-soft)}
.pcard.dragging{opacity:.4}
.pcard .pimg::after{content:"";position:absolute;inset:-7px;pointer-events:none;opacity:0;transition:opacity .15s;--m:var(--accent);
  background:linear-gradient(var(--m),var(--m)) 0 0/15px 1.5px no-repeat,linear-gradient(var(--m),var(--m)) 0 0/1.5px 15px no-repeat,linear-gradient(var(--m),var(--m)) 100% 0/15px 1.5px no-repeat,linear-gradient(var(--m),var(--m)) 100% 0/1.5px 15px no-repeat,linear-gradient(var(--m),var(--m)) 0 100%/15px 1.5px no-repeat,linear-gradient(var(--m),var(--m)) 0 100%/1.5px 15px no-repeat,linear-gradient(var(--m),var(--m)) 100% 100%/15px 1.5px no-repeat,linear-gradient(var(--m),var(--m)) 100% 100%/1.5px 15px no-repeat}
@media (hover:hover){.pcard:hover .pimg::after{opacity:1}}
.pcard.sel .pimg::after,.pcard:active .pimg::after{opacity:1}
.pcard .chk{position:absolute;left:8px;top:8px;width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.92);box-shadow:inset 0 0 0 1.5px rgba(16,26,44,.4);display:none;place-items:center;color:#fff;z-index:2}
.sel-mode .pcard .chk{display:grid}
.pcard.sel .pimg{box-shadow:var(--shadow),0 0 0 2px var(--accent)}
.pcard.sel .chk{background:var(--accent);box-shadow:none;color:var(--on-accent)}
.pcard.sel .chk .i{width:15px;height:15px;stroke-width:3}
.pcard .chk .i{display:none}.pcard.sel .chk .i{display:block}
.dock{display:flex;justify-content:center;gap:10px;padding:12px calc(var(--sr) + 16px) calc(var(--sb) + 12px) calc(var(--sl) + 16px);background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);flex:none;flex-wrap:wrap}
.dock .btn{flex:1 1 0;max-width:220px;min-width:96px;padding:0 14px}
.dock .btn.primary{flex:1.4 1 0}
.selbar{display:flex;align-items:center;gap:2px;padding:6px calc(var(--sr) + 10px) 6px calc(var(--sl) + 10px);background:var(--primary);color:var(--on-primary);flex:none;min-height:calc(58px + var(--st));padding-top:calc(var(--st) + 6px)}
.selbar .cnt{font-weight:600;margin-right:auto;padding-left:6px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;font-variant-numeric:tabular-nums}
.selbar .icon-btn:hover{background:color-mix(in srgb,var(--on-primary) 14%,transparent)}

/* ---------- camera ---------- */
.cam{background:#05080F;color:#fff;--ink:#fff;--ink2:#9FB0CC;--line:#26354F;--surface:#0E1626;--surface2:#1C2B47;--accent:#5CCBF5;--on-accent:#041824;display:none;grid-template-rows:auto 1fr auto;grid-template-columns:1fr}
.cam.active{display:grid}
.cam-top{grid-row:1;display:flex;align-items:center;gap:2px;padding:calc(var(--st) + 6px) calc(var(--sr) + 8px) 6px calc(var(--sl) + 8px);background:#05080F}
.cam-top .icon-btn{color:#fff}
.cam-top .icon-btn:hover{background:rgba(255,255,255,.1)}
.cam-top .icon-btn.on{background:rgba(255,200,87,.2);color:#FFC857}
.cam-stage{grid-row:2;position:relative;overflow:hidden;background:#05080F;min-height:0}
.cam-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#05080F}
.cam-stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cam-hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:calc(100% - 24px);background:rgba(8,13,24,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);padding:7px 16px 7px 13px;border-radius:12px;font-size:.875rem;font-weight:500;text-align:center;z-index:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:9px}
.cam-hint::before{content:"";width:8px;height:8px;border-radius:50%;background:#7C8BA6;flex:none;transition:background .2s,box-shadow .2s}
.cam-hint.ok::before{background:var(--scan);box-shadow:0 0 0 4px rgba(70,198,242,.25)}
.cam-hint.warn::before{background:#FFC857;box-shadow:0 0 0 4px rgba(255,200,87,.22)}
.cam-hint:empty{display:none}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.cam-flash.go{animation:flash .28s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.cam-zoom{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(280px,70%);display:flex;align-items:center;gap:8px;background:rgba(8,13,24,.7);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);padding:4px 14px;border-radius:12px;z-index:3;font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums}
.cam-zoom input{flex:1}
.cam-msg{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:24px;background:#05080F;z-index:5}
.cam-msg h3{margin:0;font-size:1.2rem;font-weight:600}
.cam-msg p{margin:0;color:#B4C2DA;max-width:360px;font-size:.9375rem}
.cam-msg .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.cam-msg .btn.primary{background:#fff;color:#0A111F}
.cam-bottom{grid-row:3;background:#05080F;padding:8px calc(var(--sr) + 16px) calc(var(--sb) + 14px) calc(var(--sl) + 16px);display:flex;flex-direction:column;gap:12px}
.cam-modes{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:12px;padding:3px}
.seg button{white-space:nowrap;padding:7px 14px;border-radius:9px;font-size:.84375rem;font-weight:500;color:#C5D0E4;display:flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.seg button.on{background:#fff;color:#0A111F;font-weight:600}
.autotog{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 12px;border-radius:12px;background:rgba(255,255,255,.1);font-weight:500;font-size:.84375rem;color:#C5D0E4;transition:background .2s,color .2s}
.autotog .dot{width:8px;height:8px;border-radius:50%;background:#7C8BA6}
.autotog.on{background:rgba(70,198,242,.16);color:#9BDFFB}
.autotog.on .dot{background:var(--scan);box-shadow:0 0 0 4px rgba(70,198,242,.25);animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(70,198,242,.05)}}
.cam-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cam-row>*{flex:1;display:flex;justify-content:center}
.cam-row>*:first-child{justify-content:flex-start}
.cam-row>*:last-child{justify-content:flex-end}
.cam-btn{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff;transition:background .15s}
.cam-btn:hover{background:rgba(255,255,255,.18)}
.shutter{position:relative;width:80px;height:80px;border-radius:50%;display:grid;place-items:center;flex:none}
.shutter svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.shutter .core{width:62px;height:62px;border-radius:50%;background:#fff;transition:transform .12s,background .2s}
.shutter:active .core{transform:scale(.9)}
.shutter.auto .core{background:var(--scan)}
.shutter.busy .core{background:#8392AE}
.donebtn{position:relative;width:62px;height:62px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.donebtn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.donebtn .badge{position:absolute;right:4px;top:4px;min-width:22px;height:22px;border-radius:7px;background:var(--scan);color:#041824;font-size:.78rem;font-weight:700;display:grid;place-items:center;padding:0 5px;z-index:1;font-variant-numeric:tabular-nums}
.donebtn .ck{position:absolute;left:0;right:0;bottom:0;background:rgba(5,8,15,.6);display:grid;place-items:center;height:20px;z-index:1}
.donebtn .ck .i{width:15px;height:15px;stroke-width:3}
.donebtn.empty-d{box-shadow:none;opacity:.5}
@media (orientation:landscape){
  .cam{grid-template-columns:1fr auto;grid-template-rows:auto 1fr}
  .cam-top{grid-column:1;grid-row:1}
  .cam-stage{grid-column:1;grid-row:2}
  .cam-bottom{grid-column:2;grid-row:1/3;flex-direction:column-reverse;justify-content:center;align-items:center;gap:16px;padding:calc(var(--st) + 10px) calc(var(--sr) + 14px) calc(var(--sb) + 10px) 14px;min-width:150px}
  .cam-row{flex-direction:column-reverse;width:100%;gap:18px;flex:none}
  .cam-row>*{justify-content:center!important;flex:none}
  .cam-modes{flex-direction:column;gap:12px}
}
.cam-side{position:absolute;right:calc(var(--sr) + 10px);top:62px;display:flex;flex-direction:column;gap:10px;z-index:3}
.side-btn{width:54px;padding:8px 2px 7px;border-radius:12px;background:rgba(8,13,24,.66);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);color:#fff;display:grid;justify-items:center;gap:2px;font-size:.65rem;font-weight:500;line-height:1.2;text-align:center}
.side-btn .i{width:22px;height:22px}
.side-btn span{max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-btn:active{background:rgba(255,255,255,.22)}

@media (max-width:430px){.dock .btn{padding:0 10px;gap:6px;font-size:.875rem;min-width:0}.dock .btn .i{width:20px;height:20px}}
@media (max-width:360px){.seg button{padding:7px 9px}.seg button .i{display:none}.autotog{padding:8px 10px}}

/* ---------- editor (workspace) ---------- */
.edit{display:none;grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-columns:minmax(0,1fr);background:var(--bg);color:var(--ink)}
.edit.active{display:grid}
.edit .bar{grid-row:1}
.ed-stage{grid-row:2;position:relative;background:var(--stage);min-height:0;touch-action:none;overflow:hidden}
.ed-stage canvas#edCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.ed-stage canvas#edLoupe{position:absolute;left:12px;top:12px;width:112px;height:112px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 8px 24px rgba(0,0,0,.55);pointer-events:none;display:none;z-index:2}
.ed-stage .spin{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--stage) 60%,transparent);z-index:3}
.ed-panel{min-width:0;grid-row:3;background:var(--surface);border-top:1px solid var(--line);padding:12px calc(var(--sr) + 14px) 8px calc(var(--sl) + 14px);min-height:84px;color:var(--ink)}
.ed-tabs{min-width:0;grid-row:4;display:flex;background:var(--surface);padding:0 calc(var(--sr) + 6px) var(--sb) calc(var(--sl) + 6px);border-top:1px solid var(--line)}
.ed-tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:.78125rem;font-weight:500;color:var(--ink2);position:relative;transition:color .15s}
.ed-tabs button::before{content:"";position:absolute;left:22%;right:22%;top:-1px;height:2px;border-radius:0 0 2px 2px;background:var(--accent);opacity:0;transition:opacity .15s}
.ed-tabs button.on{color:var(--accent);font-weight:600}
.ed-tabs button.on::before{opacity:1}
.ed-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.edit .btn{background:var(--surface2);color:var(--ink)}
.edit .btn.ghost{background:transparent}
.pane{display:none}.pane.on{display:block}
.filters{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 8px;scrollbar-width:thin}
.fchip{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.75rem;font-weight:500;color:var(--ink2)}
.fchip canvas{width:76px;height:96px;object-fit:contain;border-radius:var(--r-sheet);background:#fff;box-shadow:0 0 0 1px var(--line);display:block;transition:box-shadow .15s}
.fchip.on{color:var(--ink);font-weight:600}
.fchip.on canvas{box-shadow:0 0 0 2px var(--accent),0 0 0 5px var(--accent-soft)}
.slider{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;gap:10px;margin:6px 0;font-size:.875rem;font-weight:500}
.slider output{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.pg-nav{display:flex;align-items:center;gap:0}
.pg-nav span{min-width:56px;text-align:center;font-weight:600;font-size:.9375rem;font-variant-numeric:tabular-nums}
@media (min-width:880px) and (min-height:560px){
  .edit{grid-template-columns:minmax(0,1fr) 372px;grid-template-rows:auto auto minmax(0,1fr)}
  .edit .bar{grid-column:1/3}
  .ed-stage{grid-column:1;grid-row:2/4}
  .ed-tabs{grid-column:2;grid-row:2;border-top:0;border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 8px}
  .ed-tabs button{flex-direction:row;justify-content:center;gap:8px;padding:14px 0 13px;font-size:.875rem}
  .ed-tabs button::before{top:auto;bottom:-1px;left:10%;right:10%;border-radius:2px 2px 0 0}
  .ed-panel{grid-column:2;grid-row:3;border-top:0;border-left:1px solid var(--line);padding:20px;overflow:auto}
  .filters{flex-wrap:wrap;overflow:visible;gap:14px}
  .fchip{width:96px}.fchip canvas{width:96px;height:120px}
  .ed-actions{justify-content:flex-start}
}

/* range sliders */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer;accent-color:var(--accent)}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.35)}
input[type=range]:focus-visible{outline:0}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--accent-soft),0 1px 4px rgba(0,0,0,.35)}
.cam-zoom input[type=range]::-webkit-slider-runnable-track{background:rgba(255,255,255,.3)}
.cam-zoom input[type=range]::-webkit-slider-thumb{background:#fff;border-color:#fff}

/* ---------- dialogs ---------- */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:var(--r-l) var(--r-l) 0 0;width:min(580px,100%);max-width:100%;max-height:90dvh;margin:auto auto 0;box-shadow:0 -10px 48px rgba(5,10,22,.35);overflow:hidden}
dialog[open]{animation:sheetIn .22s cubic-bezier(.2,.9,.3,1) both;display:flex;flex-direction:column}
@keyframes sheetIn{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
dialog::backdrop{background:rgba(7,12,24,.55);backdrop-filter:blur(3px)}
dialog::before{content:"";flex:none;width:36px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 0}
@media (min-width:700px){dialog{margin:auto;border-radius:var(--r-l);box-shadow:0 24px 70px rgba(5,10,22,.45)}dialog::before{display:none}}
.sheet-h{display:flex;align-items:center;gap:8px;padding:10px 12px 8px 22px;flex:none}
.sheet-h h2{margin:0;font-size:1.125rem;font-weight:600;flex:1}
.sheet-b{padding:4px 22px 14px;overflow:auto;flex:1}
.sheet-f{display:flex;gap:10px;justify-content:flex-end;padding:12px 22px calc(var(--sb) + 18px);flex:none;flex-wrap:wrap;border-top:1px solid var(--line)}
.sheet-f .btn{flex:1 1 130px}
.field{display:grid;gap:6px;margin:14px 0}
.field>label,.field>.lbl{font-size:.8125rem;font-weight:600;color:var(--ink2)}
.field input[type=text],.field select,.field textarea{width:100%;min-height:46px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);outline:0;transition:border-color .15s,box-shadow .15s}
.field input[type=text]:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:200px;resize:vertical;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:9px 16px;border-radius:var(--r-s);background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);font-weight:500;font-size:.9375rem;font-variant-numeric:tabular-nums;transition:background .15s}
.chips button:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 35%,var(--line))}
.chips button.on{background:var(--primary);color:var(--on-primary);box-shadow:none;font-weight:600}
.row{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .tx b{display:block;font-size:.9375rem;font-weight:600}.row .tx span{display:block;font-size:.8125rem;color:var(--ink2);line-height:1.45}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{appearance:none;-webkit-appearance:none;width:100%;height:100%;border-radius:999px;background:color-mix(in srgb,var(--ink2) 35%,var(--line));outline:0;cursor:pointer;transition:background .2s;margin:0}
.switch input:checked{background:var(--accent)}
.switch input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s;pointer-events:none}
.switch:has(input:checked)::after{transform:translateX(20px)}
.row select{min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);max-width:52%}
.menu-item{display:flex;align-items:center;gap:14px;width:100%;padding:14px 22px;font-weight:500;text-align:left}
.menu-item:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.menu-item.danger{color:var(--danger)}
.menu-item .i{color:var(--ink2)}.menu-item.danger .i{color:var(--danger)}
#menuItems{padding-bottom:calc(var(--sb) + 14px);overflow:auto}
.progress{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.note{font-size:.8125rem;color:var(--ink2);margin:8px 0}
.hr{height:1px;background:var(--line);margin:14px 0}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 110px);transform:translate(-50%,20px);background:var(--primary);color:var(--on-primary);padding:11px 18px;border-radius:12px;font-weight:500;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:min(92vw,520px);text-align:center;box-shadow:0 12px 30px -8px rgba(5,10,22,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--danger);color:#fff}
.toast.ok{background:var(--primary);color:var(--on-primary);box-shadow:inset 3px 0 0 var(--scan),0 12px 30px -8px rgba(5,10,22,.5)}
.busy{position:fixed;inset:0;background:rgba(7,12,24,.6);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:200}
.busy .box{background:var(--surface);padding:24px 28px;border-radius:var(--r-l);min-width:230px;max-width:80vw;display:grid;gap:14px;justify-items:center;text-align:center;box-shadow:var(--shadow)}
.busy .progress{width:100%}
.spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--surface2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#printArea{display:none}
@media print{
  body{position:static;overflow:visible;height:auto}
  #app,.toast,.busy,dialog{display:none!important}
  #printArea{display:block}
  #printArea img{display:block;width:100%;max-height:100vh;object-fit:contain;page-break-after:always;break-after:page}
  @page{margin:0}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}.hero-card .beam{animation:none;transform:translateY(98px)}}

/* ---------- donate ---------- */
.donate-ic{color:var(--love)}
.donate-ic .i{fill:color-mix(in srgb,var(--love) 20%,transparent)}
.icon-btn.has-txt{width:auto;display:flex;align-items:center;gap:6px;padding:0 12px 0 10px}
.has-txt .dn-txt{font-size:.78125rem;font-weight:600;white-space:nowrap;color:var(--love)}
@media (max-width:340px){.has-txt .dn-txt{display:none}.icon-btn.has-txt{padding:0;width:44px;justify-content:center}}
.donate .chips button{min-width:58px}
.donate .field input[type=number]{width:100%;min-height:46px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);outline:0;font-size:1rem;font-variant-numeric:tabular-nums}
.donate .field input[type=number]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dn-err{margin:0 0 8px;color:var(--danger);font-weight:600;font-size:.9rem}
.qrbox{display:grid;place-items:center;padding:14px;margin:6px auto 12px;background:#fff;border-radius:var(--r-m);width:min(310px,100%);box-shadow:inset 0 0 0 1px var(--line)}
.qrbox canvas{width:100%;max-width:280px;height:auto;aspect-ratio:1;image-rendering:pixelated}
.qrbox.off canvas{opacity:.12}
.dn-to{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:var(--r-m);background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:10px}
.dn-to small{display:block;color:var(--ink2);font-size:.78rem;font-weight:500}
.dn-to b{font-size:1.15rem;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.field .hint{color:var(--ink2);font-size:.78rem;line-height:1.45}

.doc-title{display:flex;align-items:center;gap:6px;min-width:0;padding:6px 8px;border-radius:12px;color:inherit}
.doc-title:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.doc-title .i{color:var(--ink2);flex:none}
</style>

<script id="coreSrc">
/* =====================================================================
   CORE — pure algorithms (no DOM). Works in browser and in Node tests.
   - document edge detection (edges + brightness segmentation + line refine)
   - perspective warp, background-normalising filters
   - minimal PDF writer (JPEG pages) and ZIP (store) writer
   ===================================================================== */
const Core = (() => {
'use strict';

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

/* ------------------------------------------------------------------ geometry */
function polyArea(P) {
  let s = 0;
  for (let i = 0; i < P.length; i++) {
    const a = P[i], b = P[(i + 1) % P.length];
    s += a[0] * b[1] - b[0] * a[1];
  }
  return Math.abs(s) / 2;
}
function cross(o, a, b) { return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]); }

function convexHull(pts) {
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const n = pts.length;
  if (n < 3) return pts;
  const lo = [];
  for (const p of pts) {
    while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop();
    lo.push(p);
  }
  const up = [];
  for (let i = n - 1; i >= 0; i--) {
    const p = pts[i];
    while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop();
    up.push(p);
  }
  up.pop(); lo.pop();
  return lo.concat(up);
}

function lineIntersect(a, b, c, d) {
  const rx = b[0] - a[0], ry = b[1] - a[1], sx = d[0] - c[0], sy = d[1] - c[1];
  const den = rx * sy - ry * sx;
  if (Math.abs(den) < 1e-9) return null;
  const t = ((c[0] - a[0]) * sy - (c[1] - a[1]) * sx) / den;
  const u = ((c[0] - a[0]) * ry - (c[1] - a[1]) * rx) / den;
  return { x: a[0] + t * rx, y: a[1] + t * ry, t, u };
}

/* greedy reduction of a convex polygon to a quadrilateral that encloses it */
function hullToQuad(hull) {
  let P = hull.map(p => [p[0], p[1]]);
  if (P.length < 4) return null;
  while (P.length > 4) {
    const n = P.length;
    let bi = -1, bc = Infinity, bx = null;
    for (let i = 0; i < n; i++) {
      const a = P[(i + n - 1) % n], b = P[i], c = P[(i + 1) % n], d = P[(i + 2) % n];
      const X = lineIntersect(a, b, c, d);
      if (!X || X.t <= 1 || X.u >= 0) continue;
      const cost = polyArea([b, [X.x, X.y], c]);
      if (cost < bc) { bc = cost; bi = i; bx = [X.x, X.y]; }
    }
    if (bi < 0) return null;
    const next = [];
    for (let k = 0; k < n; k++) {
      if (k === bi) next.push(bx);
      else if (k === (bi + 1) % n) continue;
      else next.push(P[k]);
    }
    P = next;
  }
  return P;
}

function extremeQuad(hull) {
  let tl = hull[0], br = hull[0], tr = hull[0], bl = hull[0];
  for (const p of hull) {
    if (p[0] + p[1] < tl[0] + tl[1]) tl = p;
    if (p[0] + p[1] > br[0] + br[1]) br = p;
    if (p[0] - p[1] > tr[0] - tr[1]) tr = p;
    if (p[0] - p[1] < bl[0] - bl[1]) bl = p;
  }
  return [tl, tr, br, bl].map(p => [p[0], p[1]]);
}

/* order 4 points clockwise (screen coords) starting at top-left */
function orderQuad(P) {
  const cx = (P[0][0] + P[1][0] + P[2][0] + P[3][0]) / 4;
  const cy = (P[0][1] + P[1][1] + P[2][1] + P[3][1]) / 4;
  const s = P.slice().sort((a, b) => Math.atan2(a[1] - cy, a[0] - cx) - Math.atan2(b[1] - cy, b[0] - cx));
  let k = 0, m = Infinity;
  s.forEach((p, i) => { const v = p[0] + p[1]; if (v < m) { m = v; k = i; } });
  return [s[k], s[(k + 1) % 4], s[(k + 2) % 4], s[(k + 3) % 4]];
}

function isConvexQuad(Q) {
  let sign = 0;
  for (let i = 0; i < 4; i++) {
    const c = cross(Q[i], Q[(i + 1) % 4], Q[(i + 2) % 4]);
    if (Math.abs(c) < 1e-6) return false;
    const s = c > 0 ? 1 : -1;
    if (sign === 0) sign = s; else if (s !== sign) return false;
  }
  return true;
}

function quadAngleDev(Q) {
  let dev = 0;
  for (let i = 0; i < 4; i++) {
    const a = Q[(i + 3) % 4], b = Q[i], c = Q[(i + 1) % 4];
    const v1x = a[0] - b[0], v1y = a[1] - b[1], v2x = c[0] - b[0], v2y = c[1] - b[1];
    const l = Math.hypot(v1x, v1y) * Math.hypot(v2x, v2y);
    if (l < 1e-6) return 180;
    const ang = Math.acos(clamp((v1x * v2x + v1y * v2y) / l, -1, 1)) * 180 / Math.PI;
    dev = Math.max(dev, Math.abs(ang - 90));
  }
  return dev;
}

function pointInQuad(Q, x, y) {
  let sign = 0;
  for (let i = 0; i < 4; i++) {
    const a = Q[i], b = Q[(i + 1) % 4];
    const c = (b[0] - a[0]) * (y - a[1]) - (b[1] - a[1]) * (x - a[0]);
    const s = c >= 0 ? 1 : -1;
    if (sign === 0) sign = s; else if (s !== sign) return false;
  }
  return true;
}

/* ------------------------------------------------------------------ basic image ops */
function grayFromRGBA(d, w, h) {
  const g = new Uint8Array(w * h);
  for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = (d[j] * 77 + d[j + 1] * 150 + d[j + 2] * 29) >> 8;
  return g;
}

function boxBlur3(src, w, h) {
  const tmp = new Uint16Array(w * h), out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    const r = y * w;
    for (let x = 0; x < w; x++) {
      tmp[r + x] = src[r + (x > 0 ? x - 1 : 0)] + src[r + x] + src[r + (x < w - 1 ? x + 1 : x)];
    }
  }
  for (let y = 0; y < h; y++) {
    const r0 = (y > 0 ? y - 1 : 0) * w, r1 = y * w, r2 = (y < h - 1 ? y + 1 : y) * w;
    for (let x = 0; x < w; x++) out[r1 + x] = ((tmp[r0 + x] + tmp[r1 + x] + tmp[r2 + x] + 4) / 9) | 0;
  }
  return out;
}

function otsu(g) {
  const hist = new Uint32Array(256);
  for (let i = 0; i < g.length; i++) hist[g[i]]++;
  const total = g.length;
  let sum = 0;
  for (let t = 0; t < 256; t++) sum += t * hist[t];
  let sumB = 0, wB = 0, best = -1, thr = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t];
    if (!wB) continue;
    const wF = total - wB;
    if (!wF) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const v = wB * wF * (mB - mF) * (mB - mF);
    if (v > best) { best = v; thr = t; }
  }
  return thr;
}

function sobel(g, w, h) {
  const gx = new Int16Array(w * h), gy = new Int16Array(w * h), mag = new Uint16Array(w * h);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      const a = g[i - w - 1], b = g[i - w], c = g[i - w + 1], d = g[i - 1], f = g[i + 1],
            e = g[i + w - 1], hh = g[i + w], k = g[i + w + 1];
      const dx = (c + 2 * f + k) - (a + 2 * d + e);
      const dy = (e + 2 * hh + k) - (a + 2 * b + c);
      gx[i] = dx; gy[i] = dy;
      mag[i] = (dx < 0 ? -dx : dx) + (dy < 0 ? -dy : dy);
    }
  }
  return { gx, gy, mag, w, h };
}

function percentileU16(arr, p, maxV) {
  const bins = new Uint32Array(maxV + 1);
  for (let i = 0; i < arr.length; i++) bins[arr[i] > maxV ? maxV : arr[i]]++;
  const target = arr.length * p;
  let acc = 0;
  for (let v = 0; v <= maxV; v++) { acc += bins[v]; if (acc >= target) return v; }
  return maxV;
}

/* square max / min filter of radius r with sliding window sums (O(n), independent of r); outside the image counts as "not set" for dilate and "set" for erode */
function windowAny(src, w, h, r, wantZero) {
  const tmp = new Uint8Array(w * h), out = new Uint8Array(w * h), cs = new Int32Array(Math.max(w, h) + 1);
  const hit = wantZero ? (v) => (v ? 0 : 1) : (v) => (v ? 1 : 0);
  for (let y = 0; y < h; y++) {

 * img: {width,height,data(RGBA)}  (works best when longest side ~ 280–640 px)

    quad: q, score: best.score, support: best.support, contrast: best.contrast, paper: best.paper, frac: best.frac, tag: best.tag, dev: best.dev,
    aspect: best.aspect, wh: best.wh, kind: best.kind, label: best.label,

   ==================================================================== */
const APP_VERSION = '1.0.0';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const nextFrame = () => new Promise((r) => requestAnimationFrame(() => r()));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = Core.clamp;
const ic = (n, cls) => `<svg class="i ${cls || ''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ------------------------------------------------------------- settings / state */
const SETTINGS_VER = 3;
const DEFAULTS = {
  v: SETTINGS_VER,
  lang: 'th', theme: 'auto', camRes: 3840, hold: 1, auto: true, hiRes: true, dupSkip: true,
  sound: true, vibrate: true, grid: false, defFilter: 'magic', mode: 'doc', capMax: 8192, crisp: true,
  expFormat: 'pdf', expSize: 'auto', snap: true, expQuality: 'print', facing: 'environment'
};
function loadSettings() {
  try {
    const st = JSON.parse(localStorage.getItem('flowscan.settings') || '{}');
    if (st.v !== SETTINGS_VER) { if (st.v < 2) { delete st.camRes; delete st.capMax; delete st.expQuality; } delete st.expSize; st.v = SETTINGS_VER; } // v2: print-quality defaults, v3: automatic paper size
    return Object.assign({}, DEFAULTS, st);
  } catch (e) { return Object.assign({}, DEFAULTS); }
}

/* ------------------------------------------------------------- device limits (canvas size / memory) */
const Hw = (() => {
  const ua = navigator.userAgent || '';
  const ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const mem = navigator.deviceMemory || 8;                        // GB (Chrome only; others assume plenty)
  let area = ios ? 16.7e6 : mem <= 2 ? 16e6 : mem <= 4 ? 40e6 : 72e6;   // max pixels we dare to allocate in one canvas
  return {
    ios, mem,
    get maxArea() { return area; },
    shrink(f) { area = Math.max(4e6, area * f); },               // called when a big allocation actually failed
    threads: Math.max(1, Math.min(4, (navigator.hardwareConcurrency || 2) - 1))
  };
})();
const S = {
  settings: loadSettings(),
  docs: [],            // library (without page originals)
  doc: null,           // currently open document
  origCache: new Map(),// pageId -> Blob
  sel: new Set(),      // selected page indexes (doc view)
  selMode: false,
  navDepth: 0
};
function saveSettings() { try { localStorage.setItem('flowscan.settings', JSON.stringify(S.settings)); } catch (e) { /* ignore */ } }

/* ------------------------------------------------------------- i18n */
let LANG = S.settings.lang === 'en' ? 'en' : 'th';
function t(key) {
  const args = Array.prototype.slice.call(arguments, 1);
  let s = (I18N[LANG] || {})[key];
  if (s == null) s = I18N.th[key];
  if (s == null) return key;
  return s.replace(/\{(\d+)\}/g, (_, i) => (args[i] != null ? args[i] : ''));
}
function applyI18n(root) {
  $$('[data-i18n]', root).forEach((e) => { e.textContent = t(e.dataset.i18n); });
  $$('[data-i18n-aria]', root).forEach((e) => { const s = t(e.dataset.i18nAria); e.setAttribute('aria-label', s); e.title = s; });
  $$('[data-i18n-ph]', root).forEach((e) => { e.placeholder = t(e.dataset.i18nPh); });
  document.documentElement.lang = LANG;
  document.title = t('app.title');
}
function setLang(l) {
  LANG = l === 'en' ? 'en' : 'th';
  S.settings.lang = LANG; saveSettings();
  applyI18n(document);
  fillFilterSelect();
  if (typeof refreshAllText === 'function') refreshAllText();
}
const fmtDate = (ts) => new Date(ts).toLocaleDateString(LANG === 'th' ? 'th-TH' : 'en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

const defaultDocName = () => `${t('doc.defaultName')} ${new Date().toLocaleDateString(LANG === 'th' ? 'th-TH' : 'en-GB', { day: 'numeric', month: 'short' })} ${fmtTime(Date.now())}`;
const safeName = (s) => (String(s || 'scan').replace(/[\\/:*?"<>|\u0000-\u001f]+/g, '-').trim().slice(0, 80) || 'scan');

/* ------------------------------------------------------------- theme */
function applyTheme() {
  const m = S.settings.theme;

  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const meta = $('meta[name=theme-color]');

}
if (window.matchMedia) {
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) { /* old Safari */ }
}

function closeOnBackdrop(dlg) {

}

function askText(title, value) {
  return new Promise((resolve) => {
    const dlg = $('#dlgPrompt'), inp = $('#pmInput');
    $('#pmTitle').textContent = title;
    inp.value = value || '';
    let result = null;
    const onSubmit = (e) => { e.preventDefault(); result = inp.value.trim() || null; dlg.close(); };
    const onCancel = () => dlg.close();
    const onClose = () => {
      $('#pmForm').removeEventListener('submit', onSubmit);
      $('#pmCancel').removeEventListener('click', onCancel);
      dlg.removeEventListener('close', onClose);
      resolve(result);
    };
    $('#pmForm').addEventListener('submit', onSubmit);
    $('#pmCancel').addEventListener('click', onCancel);
    dlg.addEventListener('close', onClose);
    dlg.showModal();
    setTimeout(() => { inp.focus(); inp.select(); }, 60);

}
function askConfirm(title, text, okLabel, danger) {
  return new Promise((resolve) => {
    const dlg = $('#dlgConfirm'), yes = $('#cfYes');
    $('#cfTitle').textContent = title;
    $('#cfText').textContent = text || '';
    yes.textContent = okLabel || t('ok');
    yes.className = 'btn ' + (danger ? 'primary' : 'primary');
    yes.style.background = danger ? 'var(--danger)' : '';
    yes.style.color = danger ? '#fff' : '';
    let result = false;
    const onYes = () => { result = true; dlg.close(); };
    const onNo = () => dlg.close();
    const onClose = () => {
      yes.removeEventListener('click', onYes); $('#cfNo').removeEventListener('click', onNo);
      dlg.removeEventListener('close', onClose); resolve(result);
    };
    yes.addEventListener('click', onYes); $('#cfNo').addEventListener('click', onNo);
    dlg.addEventListener('close', onClose);
    dlg.showModal();
  });
}

/* ------------------------------------------------------------- feedback (sound / vibration) */
let actx = null;
function audio() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
  return actx;
}
function sfx(kind) {
  if (!S.settings.sound) return;
  const a = audio();
  if (!a) return;
  try {
    const now = a.currentTime;
    if (kind === 'shutter') {
      const len = Math.floor(a.sampleRate * 0.07), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      const src = a.createBufferSource(), g = a.createGain();
      src.buffer = buf; g.gain.value = 0.45; src.connect(g); g.connect(a.destination); src.start(now);
    } else {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(kind === 'warn' ? 330 : 880, now);
      if (kind !== 'warn') o.frequency.exponentialRampToValueAtTime(1320, now + 0.09);
      g.gain.setValueAtTime(0.18, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      o.connect(g); g.connect(a.destination); o.start(now); o.stop(now + 0.2);
    }
  } catch (e) { /* ignore */ }
}
function vibrate(ms) { if (S.settings.vibrate && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) { /* ignore */ } } }

/* ------------------------------------------------------------- downloads */
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.async = true; s.onload = resolve; s.onerror = () => reject(new Error('load failed: ' + src));
    document.head.appendChild(s);
  });
}

/* ---- 20-store.js ---- */
/* ====================================================================
   STORE — IndexedDB (documents + original images) and image helpers
   ==================================================================== */
const DB = {
  db: null, mem: null,
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        if (!window.indexedDB) return rej(new Error('no indexedDB'));
        const rq = indexedDB.open('flowscan', 1) /* ชื่อภายใน คงเดิมเพื่อไม่ให้ข้อมูลเก่าหาย */;
        rq.onupgradeneeded = () => {
          const d = rq.result;
          if (!d.objectStoreNames.contains('docs')) d.createObjectStore('docs', { keyPath: 'id' });
          if (!d.objectStoreNames.contains('orig')) d.createObjectStore('orig');
        };
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error);
        rq.onblocked = () => rej(new Error('blocked'));
      });
    } catch (e) {
      console.warn('IndexedDB unavailable — using memory only', e);
      this.mem = { docs: new Map(), orig: new Map() };
    }
  },
  _run(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode), st = tx.objectStore(store);
      const rq = fn(st);
      tx.oncomplete = () => res(rq ? rq.result : undefined);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error('aborted'));
    });
  },
  allDocs() { return this.mem ? Promise.resolve([...this.mem.docs.values()]) : this._run('docs', 'readonly', (s) => s.getAll()); },
  getDoc(id) { return this.mem ? Promise.resolve(this.mem.docs.get(id)) : this._run('docs', 'readonly', (s) => s.get(id)); },
  putDoc(d) { if (this.mem) { this.mem.docs.set(d.id, d); return Promise.resolve(); } return this._run('docs', 'readwrite', (s) => s.put(d)); },
  putOrig(id, blob) { if (this.mem) { this.mem.orig.set(id, blob); return Promise.resolve(); } return this._run('orig', 'readwrite', (s) => s.put(blob, id)); },
  getOrig(id) { return this.mem ? Promise.resolve(this.mem.orig.get(id)) : this._run('orig', 'readonly', (s) => s.get(id)); },
  delOrig(id) { if (this.mem) { this.mem.orig.delete(id); return Promise.resolve(); } return this._run('orig', 'readwrite', (s) => s.delete(id)); },
  async delDoc(doc) {
    for (const p of doc.pages) { try { await this.delOrig(p.id); } catch (e) { /* ignore */ } }
    if (this.mem) { this.mem.docs.delete(doc.id); return; }
    await this._run('docs', 'readwrite', (s) => s.delete(doc.id));
  },
  async wipe() {
    if (this.mem) { this.mem.docs.clear(); this.mem.orig.clear(); return; }
    await this._run('docs', 'readwrite', (s) => s.clear());
    await this._run('orig', 'readwrite', (s) => s.clear());
  }
};

/* ------------------------------------------------------------- document model */
function newDoc(name) {
  return { id: uid(), name: name || defaultDocName(), created: Date.now(), updated: Date.now(), pages: [] };
}
function newPage(w, h, quad, filter) {
  return { id: uid(), w, h, quad, rot: 0, filter: filter || 'magic', bright: 0, contrast: 0, sharp: 0, sat: 0, bw: 0.8, thumb: null, thumbUrl: null };
}
function serializeDoc(d) {
  return {
    id: d.id, name: d.name, created: d.created, updated: d.updated,
    pages: d.pages.map((p) => ({ id: p.id, w: p.w, h: p.h, quad: p.quad, rot: p.rot, filter: p.filter, bright: p.bright, contrast: p.contrast, sharp: p.sharp, sat: p.sat || 0, bw: p.bw, thumb: p.thumb }))
  };
}
function hydrateDoc(r) {
  r.pages.forEach((p) => { p.thumbUrl = p.thumb ? URL.createObjectURL(p.thumb) : null; });
  return r;
}
const saver = { t: 0, pending: new Set() };
function scheduleSave(doc, delay) {
  saver.pending.add(doc);
  clearTimeout(saver.t);
  saver.t = setTimeout(flushSave, delay == null ? 400 : delay);
}
async function flushSave() {
  clearTimeout(saver.t);
  const docs = [...saver.pending];
  saver.pending.clear();
  for (const d of docs) {
    try {
      d.updated = Date.now();
      await DB.putDoc(serializeDoc(d));
      if (!S.persisted && navigator.storage && navigator.storage.persist) { S.persisted = true; navigator.storage.persist().catch(() => {}); }
    } catch (e) {
      console.error(e);
      toast(t('err.save'), 3500, 'err');
    }
  }
}

/* ------------------------------------------------------------- image helpers */
const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
/* off-screen canvases are read back often -> willReadFrequently; pass 'display' for on-screen canvases */
const ctx2d = (c, mode) => c.getContext('2d', mode === 'display' ? undefined : { willReadFrequently: true });
const canvasToBlob = (c, type, q) => new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error('toBlob failed'))), type || 'image/jpeg', q == null ? 0.9 : q));

async function decodeBlob(blob) {
  const url = URL.createObjectURL(blob);
  try {
    const img = new Image();
    img.decoding = 'async';
    img.src = url;
    await img.decode();
    return { src: img, w: img.naturalWidth, h: img.naturalHeight, close() { URL.revokeObjectURL(url); } };
  } catch (e) {
    URL.revokeObjectURL(url);
    const bmp = await createImageBitmap(blob);
    return { src: bmp, w: bmp.width, h: bmp.height, close() { if (bmp.close) bmp.close(); } };
  }
}

/* high-quality downscale by repeated halving; never upscales */
function scaleToCanvas(src, sw, sh, maxSide, maxArea) {
  let k = Math.min(1, maxSide / Math.max(sw, sh));
  if (maxArea) k = Math.min(k, Math.sqrt(maxArea / (sw * sh)));
  const tw = Math.max(1, Math.round(sw * k)), th = Math.max(1, Math.round(sh * k));
  let cur = src, cw = sw, ch = sh;
  while (cw / 2 >= tw && ch / 2 >= th) {
    const nw = Math.max(tw, Math.floor(cw / 2)), nh = Math.max(th, Math.floor(ch / 2));
    const c = mkCanvas(nw, nh);
    const x = ctx2d(c);
    x.imageSmoothingQuality = 'high';
    x.drawImage(cur, 0, 0, cw, ch, 0, 0, nw, nh);
    cur = c; cw = nw; ch = nh;
  }
  const out = mkCanvas(tw, th), x = ctx2d(out);
  x.imageSmoothingQuality = 'high';
  x.drawImage(cur, 0, 0, cw, ch, 0, 0, tw, th);
  return out;
}

/* rotate by quarter turns clockwise */
function rotateCanvas(c, rot) {
  rot = ((rot % 4) + 4) % 4;
  if (!rot) return c;
  const o = mkCanvas(rot % 2 ? c.height : c.width, rot % 2 ? c.width : c.height), x = ctx2d(o);
  x.translate(o.width / 2, o.height / 2);
  x.rotate(rot * Math.PI / 2);
  x.drawImage(c, -c.width / 2, -c.height / 2);
  return o;
}

/* ------------------------------------------------------------- per-page source cache + rendering */
const SrcCache = {
  map: new Map(),
  get(id) { const v = this.map.get(id); if (v) { this.map.delete(id); this.map.set(id, v); } return v; },
  set(id, v) { this.map.delete(id); this.map.set(id, v); while (this.map.size > 10) this.map.delete(this.map.keys().next().value); },
  del(id) { this.map.delete(id); }
};

function seedSrc(page, cv) {
  const prev = scaleToCanvas(cv, cv.width, cv.height, 1600);
  const thumb = scaleToCanvas(prev, prev.width, prev.height, 640);
  SrcCache.set(page.id, { prev, thumb });
}

/* originals are large now -> keep only the most recent few in memory (the rest are read back from IndexedDB) */
function cacheOrig(id, blob) {
  S.origCache.delete(id); S.origCache.set(id, blob);
  while (S.origCache.size > 6) S.origCache.delete(S.origCache.keys().next().value);
}
async function getOrigBlob(page) {
  let b = S.origCache.get(page.id);
  if (!b) { b = await DB.getOrig(page.id); if (b) cacheOrig(page.id, b); }
  return b;
}

async function ensureSrc(page) {
  let e = SrcCache.get(page.id);
  if (e) return e;
  const blob = await getOrigBlob(page);
  if (!blob) throw new Error('original image missing');
  const d = await decodeBlob(blob);
  const prev = scaleToCanvas(d.src, d.w, d.h, 1600);
  d.close();
  const thumb = scaleToCanvas(prev, prev.width, prev.height, 640);
  e = { prev, thumb };
  SrcCache.set(page.id, e);
  return e;
}

async function loadFull(page) {
  const blob = await getOrigBlob(page);
  if (!blob) throw new Error('original image missing');
  const d = await decodeBlob(blob);
  const c = mkCanvas(d.w, d.h);
  ctx2d(c).drawImage(d.src, 0, 0);
  d.close();
  return c;
}

const quadToPx = (quad, W, H) => quad.map((p) => [p.x * W, p.y * H]);
/* output pages get the true proportions of standard paper (A4 / Letter / ID card ...) when the corners say so */
const snapFor = (W, H) => (S.settings.snap === false ? null : { w: W, h: H });

/* returns {width,height,data} — perspective-corrected, not yet filtered */
async function warpPage(page, level, maxDim) {
  const cv = level === 'full' ? await loadFull(page) : (await ensureSrc(page))[level];
  const W = cv.width, H = cv.height;
  const data = ctx2d(cv, true).getImageData(0, 0, W, H);
  const Q = quadToPx(page.quad, W, H);
  const [ow, oh] = Core.estimateOutputSize(Q, maxDim, snapFor(W, H));
  return Core.warpPerspective(data, Q, ow, oh);
}
const filterOpts = (p) => ({ filter: p.filter, bright: p.bright, contrast: p.contrast, sharp: p.sharp, sat: p.sat || 0, bwLevel: p.bw, crisp: S.settings.crisp ? 1 : 0 });
function pixelsToCanvas(img) {
  const c = mkCanvas(img.width, img.height);
  ctx2d(c).putImageData(new ImageData(img.data, img.width, img.height), 0, 0);
  return c;
}
async function renderPage(page, level, maxDim) {
  const w = await warpPage(page, level, maxDim);
  Core.applyFilter(w, filterOpts(page));
  return rotateCanvas(pixelsToCanvas(w), page.rot);
}

/* ------------------------------------------------------------- print-quality renderer
   Renders the page at (up to) targetLong px on its long side, in horizontal bands so that only a small part of
   the pixels is ever held as raw RGBA. Bands are processed by Web Workers when available.
   Output resolution never exceeds the source's native resolution (no fake detail). */
const rotQuad = (Q, r) => { r = ((r % 4) + 4) % 4; return Q.map((_, i) => Q[(i - r + 4) % 4]); };
const WORKER_GLUE = `
self.onmessage = function (e) {
  var m = e.data;
  try {
    var out = Core.renderBand({ width: m.bw, height: m.bh, data: new Uint8ClampedArray(m.buf) }, m.job);
    self.postMessage({ id: m.id, buf: out.data.buffer }, [out.data.buffer]);
  } catch (err) { self.postMessage({ id: m.id, error: String((err && err.message) || err) }); }
};`;
function makeWorkers(n) {
  if (typeof Worker === 'undefined' || n < 1) return null;
  const el = document.getElementById('coreSrc');
  if (!el) return null;
  let url = null;
  try {
    url = URL.createObjectURL(new Blob([el.textContent, WORKER_GLUE], { type: 'text/javascript' }));
    const ws = [];
    for (let i = 0; i < n; i++) ws.push(new Worker(url));
    return { ws, url };
  } catch (e) { if (url) URL.revokeObjectURL(url); return null; }
}
function workerCall(w, msg, transfer) {
  return new Promise((resolve, reject) => {
    const end = () => { w.onmessage = null; w.onerror = null; };
    w.onmessage = (e) => { end(); if (e.data.error) reject(new Error(e.data.error)); else resolve(e.data.buf); };
    w.onerror = (e) => { end(); reject(new Error((e && e.message) || 'worker error')); };
    w.postMessage(msg, transfer);
  });
}

async function renderFinal(page, targetLong, onProg) {
  const src = await loadFull(page);
  let cv = src, cw = src.width, ch = src.height;
  const nq = page.quad;
  let Q = rotQuad(quadToPx(nq, cw, ch), page.rot);
  const nat = Math.max.apply(null, Core.estimateOutputSize(Q, Infinity));
  if (nat > targetLong * 1.15) {                 // source is denser than the output -> area-average first (no aliasing)
    const k = (targetLong * 1.15) / nat;
    cv = scaleToCanvas(src, cw, ch, Math.round(Math.max(cw, ch) * k));
    src.width = src.height = 1;
    cw = cv.width; ch = cv.height;
    Q = rotQuad(quadToPx(nq, cw, ch), page.rot);
  }
  let [ow, oh] = Core.estimateOutputSize(Q, targetLong, snapFor(cw, ch));
  if (ow * oh > Hw.maxArea) { const k = Math.sqrt(Hw.maxArea / (ow * oh)); ow = Math.round(ow * k); oh = Math.round(oh * k); }
  const fopts = filterOpts(page);
  fopts.fullLong = Math.max(ow, oh);
  // page-wide statistics (paper colour / levels) come from a small copy so every band is treated identically
  let bg = null;
  if (Core.needsBg(page.filter) || page.filter === 'lighten') {
    const lowCv = scaleToCanvas(cv, cw, ch, 1600);
    const lowQ = rotQuad(quadToPx(nq, lowCv.width, lowCv.height), page.rot);
    const [lw, lh] = Core.estimateOutputSize(lowQ, 1400, snapFor(lowCv.width, lowCv.height));
    const low = Core.warpPerspective(ctx2d(lowCv).getImageData(0, 0, lowCv.width, lowCv.height), lowQ, lw, lh);
    if (lowCv !== cv) lowCv.width = lowCv.height = 1;
    if (page.filter === 'lighten') fopts.levels = Core.autoLevelsRange(low.data);
    else { const B = Core.estimateBackground(low); bg = { sw: B.sw, sh: B.sh, cell: B.cell * ((ow / lw + oh / lh) / 2), bg: B.bg, paper: B.paper }; }
  }
  const out = mkCanvas(ow, oh), octx = ctx2d(out);
  if (!octx) throw new Error('canvas-limit');
  octx.fillStyle = '#fff'; octx.fillRect(0, 0, ow, oh);
  if (octx.getImageData(ow - 1, oh - 1, 1, 1).data[3] !== 255) throw new Error('canvas-limit');

  const HALO = Core.SHARP_HALO;
  const bh = Math.max(32, Math.min(512, Math.round(1.6e6 / ow)));
  const bands = [];
  for (let y = 0; y < oh; y += bh) bands.push([y, Math.min(oh, y + bh)]);
  const sctx = ctx2d(cv);
  const pool = makeWorkers(Math.min(Hw.threads, bands.length));
  let next = 0, done = 0;
  const lane = async (worker) => {
    let w = worker;
    while (next < bands.length) {
      const [y0, y1] = bands[next++];
      const ya = Math.max(0, y0 - HALO), yb = Math.min(oh, y1 + HALO);
      const r = Core.bandSourceRect(Q, ow, oh, ya, yb, cw, ch, 3);
      const job = { quad: Q, outW: ow, outH: oh, ya, yb, ox: r.x, oy: r.y, fopts, bg };
      let buf = null;
      if (w) {
        const sd = sctx.getImageData(r.x, r.y, r.w, r.h);
        try { buf = await workerCall(w, { job, bw: r.w, bh: r.h, buf: sd.data.buffer }, [sd.data.buffer]); }
        catch (e) { console.warn('worker failed — continuing on the main thread', e); w = null; }
      }
      if (!buf) {
        buf = Core.renderBand(sctx.getImageData(r.x, r.y, r.w, r.h), job).data.buffer;
        await sleep(0);
      }
      octx.putImageData(new ImageData(new Uint8ClampedArray(buf), ow, yb - ya), 0, ya, 0, y0 - ya, ow, y1 - y0);
      done++;
      if (onProg) onProg(done / bands.length);
    }
  };
  try {
    const lanes = pool ? pool.ws : [null];
    await Promise.all(lanes.map((w) => lane(w)));
  } finally {
    if (pool) { pool.ws.forEach((w) => w.terminate()); URL.revokeObjectURL(pool.url); }
    cv.width = cv.height = 1;
  }
  return out;
}

/* render + encode with automatic step-down when the device cannot allocate / encode a canvas that big */
async function renderToBlob(page, targetLong, mime, quality, onProg) {
  let T = targetLong, last = null;
  for (let i = 0; i < 5; i++) {
    try {
      const c = await renderFinal(page, T, onProg);
      const blob = await canvasToBlob(c, mime, quality);
      const r = { blob, w: c.width, h: c.height, lowered: T < targetLong };
      c.width = c.height = 1;
      return r;
    } catch (e) {
      last = e; console.warn('render at', T, 'px failed:', e);
      if (e instanceof RangeError || /canvas-limit|toBlob|memory|alloc/i.test(String((e && e.message) || e))) Hw.shrink(0.6);
      T = Math.round(T * 0.75);
      if (T < 1000) break;
      await sleep(30);
    }
  }
  throw last || new Error('render failed');
}

async function updateThumb(page) {
  const c = await renderPage(page, 'thumb', 360);
  const blob = await canvasToBlob(c, 'image/jpeg', 0.82);
  if (page.thumbUrl) URL.revokeObjectURL(page.thumbUrl);
  page.thumb = blob;
  page.thumbUrl = URL.createObjectURL(blob);
}

/* ------------------------------------------------------------- doc operations */
async function addPageToDoc(doc, page, blob, cv) {
  doc.pages.push(page);
  cacheOrig(page.id, blob);
  if (cv) seedSrc(page, cv);
  await DB.putOrig(page.id, blob);
  scheduleSave(doc, 150);
}
async function removePage(doc, idx) {
  const [p] = doc.pages.splice(idx, 1);
  if (!p) return;
  if (p.thumbUrl) URL.revokeObjectURL(p.thumbUrl);
  S.origCache.delete(p.id); SrcCache.del(p.id);
  try { await DB.delOrig(p.id); } catch (e) { /* ignore */ }
  scheduleSave(doc, 100);
}
function defaultQuad(inset) {
  const a = inset == null ? 0.012 : inset, b = 1 - a;
  return [{ x: a, y: a }, { x: b, y: a }, { x: b, y: b }, { x: a, y: b }];
}
/* detect document corners in a canvas — returns {quad, ok, score} (quad falls back to default) */
function detectInCanvas(cv, opt) {
  const small = scaleToCanvas(cv, cv.width, cv.height, (opt && opt.size) || 480);
  const data = ctx2d(small, true).getImageData(0, 0, small.width, small.height);
  const r = Core.detectDocument(data, Object.assign({ minArea: 0.02, thorough: true }, opt || {}));
  if (r && r.score >= 0.28 && r.support >= 0.4) return { quad: r.quad, ok: true, score: r.score, kind: r.kind, label: r.label, aspect: r.aspect };
  return { quad: defaultQuad(), ok: false, score: r ? r.score : 0 };
}

/* ====================================================================
   CAMERA — live preview, document detection, continuous auto-capture
   ==================================================================== */
const Cam = {
  video: null, ov: null, octx: null, stream: null, track: null, ic: null, caps: {}, devices: [], devId: null,
  running: false, raf: 0, lastDet: 0, lastTick: 0, dc: null, dctx: null, token: 0,
  smooth: null, missing: 0, okNow: false, hasDet: false, quadNow: null, prevQuad: null, lastSig: null,
  stableMs: 0, progress: 0, lostTicks: 0, needChange: false, capSig: null, capQuad: null,
  lastCapAt: 0, capturing: false, lastPageSig: null,
  mode: 'doc', idFront: null, torch: false, wake: null, doc: null, count: 0,
  sw: 0, sh: 0, dpr: 1, hintKey: '', lastPage: null
};
const RING_LEN = 232.5;

function quadDelta(a, b) {
  let m = 0;
  for (let i = 0; i < 4; i++) m = Math.max(m, Math.hypot(a[i].x - b[i].x, a[i].y - b[i].y));
  return m;
}
function quadAspectPx(q, vw, vh) {
  const d = (a, b) => Math.hypot((a.x - b.x) * vw, (a.y - b.y) * vh);
  const w = (d(q[0], q[1]) + d(q[3], q[2])) / 2, h = (d(q[0], q[3]) + d(q[1], q[2])) / 2;
  return Math.max(w, h) / Math.max(1, Math.min(w, h));
}

/* ------------------------------------------------------------- UI helpers */
function setHint(text, kind) {
  const el = $('#camHint'), key = text + '|' + (kind || '');
  if (Cam.hintKey === key) return;
  Cam.hintKey = key;
  el.textContent = text;
  el.className = 'cam-hint' + (kind ? ' ' + kind : '');
}
function updateRing() {
  $('#camRing').style.strokeDashoffset = String(RING_LEN * (1 - Cam.progress));
}
function updateCamCounter() {
  const badge = $('#camCount'), btn = $('#camDone');
  badge.hidden = Cam.count === 0;
  badge.textContent = String(Cam.count);
  btn.classList.toggle('empty-d', Cam.count === 0 && !Cam.idFront);
}
function updateCamThumb(page) {
  if (!page || !page.thumbUrl) return;
  Cam.lastPage = page;
  const img = $('#camThumb');
  img.src = page.thumbUrl; img.hidden = false;
}
function syncCamControls() {
  const auto = S.settings.auto;
  const b = $('#camAuto');
  b.classList.toggle('on', auto); b.setAttribute('aria-pressed', String(auto));
  $('#camShutter').classList.toggle('auto', auto);
  $('#camGrid').classList.toggle('on', !!S.settings.grid);
  $$('#camModes button').forEach((x) => x.classList.toggle('on', x.dataset.mode === Cam.mode));
  $('#camFlash').classList.toggle('on', Cam.torch);
  $('#camFlash').innerHTML = ic(Cam.torch ? 'bolt' : 'bolt-off');
  $('#camColorLbl').textContent = t('filter.' + S.settings.defFilter);
  if (!auto) { Cam.progress = 0; updateRing(); }
}
function hideCamMsg() { $('#camMsg').hidden = true; }
function showCamError(err) {
  const name = err && err.name;
  let title = t('cam.errTitle'), text = t('cam.err');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    title = t('cam.unsupportedTitle');
    text = window.isSecureContext === false ? t('cam.insecure') : t('cam.unsupported');
  } else if (name === 'NotAllowedError' || name === 'SecurityError') { title = t('cam.deniedTitle'); text = t('cam.denied'); }
  else if (name === 'NotFoundError' || name === 'OverconstrainedError') { text = t('cam.nocam'); }
  else if (name === 'NotReadableError' || name === 'AbortError') { text = t('cam.busy'); }
  $('#camMsgTitle').textContent = title;
  $('#camMsgText').textContent = text;
  $('#camMsg').hidden = false;
  setHint('');
  $('#camHint').className = 'cam-hint';
  $('#camHint').textContent = '';
  Cam.hintKey = '';
}

/* ------------------------------------------------------------- stream control */
function camStopStream() {

}

function camLoop(ts) {
  if (!Cam.running) return;
  Cam.raf = requestAnimationFrame(camLoop);
  if (ts - Cam.lastDet >= Math.max(100, (Cam.detCost || 0) * 2.5)) {   // slower phones get a longer gap so the preview stays smooth
    Cam.lastDet = ts;
    const t0 = performance.now();
    try { detectTick(ts); } catch (e) { console.error(e); }
    Cam.detCost = (Cam.detCost || 0) * 0.7 + (performance.now() - t0) * 0.3;

/* ------------------------------------------------------------- overlay */
function layoutOverlay() {

  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (Cam.ov.width !== w || Cam.ov.height !== h) { Cam.ov.width = w; Cam.ov.height = h; }
  Cam.sw = r.width; Cam.sh = r.height; Cam.dpr = dpr;
}
function videoRect() {
  const v = Cam.video, vw = v.videoWidth, vh = v.videoHeight;

  const s = Math.min(Cam.sw / vw, Cam.sh / vh), w = vw * s, h = vh * s;

}

}

  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function drawOverlay(ts) {
  if (Cam.ov.clientWidth && Math.abs(Cam.ov.clientWidth - Cam.sw) > 1) layoutOverlay();
  const c = Cam.octx;
  c.setTransform(Cam.dpr, 0, 0, Cam.dpr, 0, 0);
  c.clearRect(0, 0, Cam.sw, Cam.sh);
  const vr = videoRect();
  if (!vr) return;
  if (S.settings.grid) {
    c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = 1; c.beginPath();
    for (let i = 1; i < 3; i++) {
      c.moveTo(vr.x + vr.w * i / 3, vr.y); c.lineTo(vr.x + vr.w * i / 3, vr.y + vr.h);
      c.moveTo(vr.x, vr.y + vr.h * i / 3); c.lineTo(vr.x + vr.w, vr.y + vr.h * i / 3);
    }
    c.stroke();
  }
  const q = Cam.smooth;
  const isId = Cam.mode === 'id';
  if (q && Cam.hasDet) {
    const pts = q.map((p) => [vr.x + p.x * vr.w, vr.y + p.y * vr.h]);
    const ok = Cam.okNow, prog = Cam.progress;
    const col = ok ? '70,198,242' : '255,200,87';
    c.beginPath();
    pts.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])));
    c.closePath();
    c.fillStyle = `rgba(${col},${(ok ? 0.1 : 0.05) + 0.18 * prog})`;
    c.fill();
    c.lineJoin = 'round'; c.lineWidth = 1.25; c.strokeStyle = `rgba(${col},${ok ? 0.75 : 0.45})`;
    c.stroke();

    c.lineCap = 'square'; c.lineWidth = 3 + 2 * prog; c.strokeStyle = `rgb(${col})`;
    for (let i = 0; i < 4; i++) {

      const da = Math.hypot(pa[0] - p[0], pa[1] - p[1]) || 1, db = Math.hypot(pb[0] - p[0], pb[1] - p[1]) || 1;
      const La = Math.min(28, da * 0.28), Lb = Math.min(28, db * 0.28);

      const tw = c.measureText(fn).width + 22;

    gr.addColorStop(0, 'rgba(70,198,242,0)'); gr.addColorStop(0.5, 'rgba(70,198,242,.3)'); gr.addColorStop(1, 'rgba(70,198,242,0)');
    c.fillStyle = gr; c.fillRect(vr.x, yy - 26, vr.w, 52);
    c.fillStyle = 'rgba(160,226,255,.95)'; c.fillRect(vr.x, yy - 1, vr.w, 2);
  }
}

/* ------------------------------------------------------------- detection + auto-capture */
const FMT_NAMES = { a: 'A4', letter: 'Letter', legal: 'Legal', photo: '4×6', sq: '1:1' };
function fmtName(kind) { return FMT_NAMES[kind] || (kind === 'card' ? t('fmt.card') : kind === 'receipt' ? t('fmt.receipt') : ''); }
function detectTick(ts) {
  const v = Cam.video;
  if (v.readyState < 2 || !v.videoWidth || Cam.capturing || document.hidden || Cam.token === 0) return;
  const vw = v.videoWidth, vh = v.videoHeight, sc = 320 / Math.max(vw, vh);
  const dw = Math.max(32, Math.round(vw * sc)), dh = Math.max(32, Math.round(vh * sc));
  if (!Cam.dc) { Cam.dc = mkCanvas(dw, dh); Cam.dctx = ctx2d(Cam.dc, true); }
  if (Cam.dc.width !== dw || Cam.dc.height !== dh) { Cam.dc.width = dw; Cam.dc.height = dh; }
  Cam.dctx.drawImage(v, 0, 0, dw, dh);
  const img = Cam.dctx.getImageData(0, 0, dw, dh);
  const dt = Cam.lastTick ? Math.min(400, ts - Cam.lastTick) : 100;
  Cam.lastTick = ts;
  const land = vw >= vh;
  const sig = Core.blockGray(img, land ? 24 : 18, land ? 18 : 24);
  const motion = Core.meanAbsDiff(sig, Cam.lastSig);
  Cam.lastSig = sig;

  const isId = Cam.mode === 'id';
  const r = Core.detectDocument(img, { minArea: isId ? 0.03 : 0.02, prefer: isId ? 'card' : 'auto' });
  let ok = !!(r && r.ok);
  if (ok && isId) { const a = quadAspectPx(r.quad, vw, vh); ok = a > 1.25 && a < 2.0; }
  Cam.tiny = !!(ok && !isId && r.frac < 0.035);            // found, but too small in the frame to scan sharply
  if (Cam.tiny) ok = false;
  if (r && r.score >= 0.22) {
    const q = r.quad;
    if (!Cam.smooth || quadDelta(Cam.smooth, q) > 0.12) { Cam.smooth = q.map((p) => ({ x: p.x, y: p.y })); Cam.fmtHist = []; }
    else Cam.smooth = Cam.smooth.map((p, i) => ({ x: p.x + (q[i].x - p.x) * 0.5, y: p.y + (q[i].y - p.y) * 0.5 }));

    const top = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];

  updateRing();

  if (Cam.needChange) setHint(Cam.idFront ? t('cam.hintBack') : t('cam.hintNext', Cam.count + 1), 'ok');
  else if (!Cam.hasDet) setHint(Cam.idFront ? t('cam.hintBack') : (isId ? t('cam.hintId') : t('cam.hintSearch')));
  else if (steady) setHint(t('cam.hintHold'), 'ok');
  else if (ok) setHint(Cam.fmt ? t('cam.hintFound', fmtName(Cam.fmt)) : t('cam.hintSteady'), 'ok');

}

/* ------------------------------------------------------------- capture */
function camFx(trigger) {
  const fx = $('#camFx');
  fx.classList.remove('go'); void fx.offsetWidth; fx.classList.add('go');
  sfx(trigger === 'auto' ? 'ok' : 'shutter');
  vibrate(trigger === 'auto' ? [18, 40, 18] : 22);
}
const withTimeout = (p, ms) => new Promise((res, rej) => { const id = setTimeout(() => rej(new Error('timeout')), ms); p.then((v) => { clearTimeout(id); res(v); }, (e) => { clearTimeout(id); rej(e); }); });

async function grabFrame() {
  const v = Cam.video;
  if (Cam.ic && S.settings.hiRes) {
    try {
      let blob = null;
      const pc = Cam.photoCaps;
      if (pc && pc.imageWidth && pc.imageHeight && pc.imageWidth.max) {      // ask for the sensor's full size
        try { blob = await withTimeout(Cam.ic.takePhoto({ imageWidth: pc.imageWidth.max, imageHeight: pc.imageHeight.max }), 8000); } catch (e) { blob = null; }
      }
      if (!blob) blob = await withTimeout(Cam.ic.takePhoto(), 5000);
      const bmp = await createImageBitmap(blob);
      const stillLand = bmp.width >= bmp.height, vidLand = v.videoWidth >= v.videoHeight;
      if (stillLand === vidLand) return { src: bmp, w: bmp.width, h: bmp.height, still: true };
      bmp.close && bmp.close();
    } catch (e) { /* fall back to video frame */ }
  }
  const c = mkCanvas(v.videoWidth, v.videoHeight);
  ctx2d(c).drawImage(v, 0, 0);
  return { src: c, w: c.width, h: c.height, still: false };
}

async function camCapture(trigger) {
  if (Cam.capturing || !Cam.running) return;
  Cam.capturing = true; Cam.stableMs = 0; Cam.progress = 0; updateRing();
  const sh = $('#camShutter');
  sh.classList.add('busy');
  const live = Cam.smooth ? Cam.smooth.map((p) => ({ x: p.x, y: p.y })) : null;
  const wasOk = Cam.okNow;
  try {
    camFx(trigger);
    const frame = await grabFrame();
    const res = await ingestFrame(frame.src, frame.w, frame.h, { trigger, live: frame.still ? null : live, liveOk: wasOk });
    if (frame.src.close) frame.src.close();
    if (res !== 'fail') { Cam.needChange = true; Cam.capSig = Cam.lastSig; Cam.capQuad = Cam.quadNow; Cam.lostTicks = 0; }
  } catch (e) {
    console.error(e);
    toast(t('err.capture'), 3000, 'err');
  } finally {
    Cam.capturing = false; Cam.lastCapAt = performance.now();
    sh.classList.remove('busy');
  }
}

function ensureDoc() {
  if (!Cam.doc) {
    Cam.doc = newDoc();
    S.docs.unshift(Cam.doc);
  }
  return Cam.doc;
}

function pageSignature(cv, quad) {
  const small = scaleToCanvas(cv, cv.width, cv.height, 320);
  const d = ctx2d(small, true).getImageData(0, 0, small.width, small.height);
  const w = Core.warpPerspective(d, quadToPx(quad, small.width, small.height), 64, 64);
  return Core.blockGray(w, 32, 32);
}

function warpCard(cv, quad) {
  const d = ctx2d(cv, true).getImageData(0, 0, cv.width, cv.height);
  const Q = quadToPx(quad, cv.width, cv.height);
  const W = Math.hypot(Q[1][0] - Q[0][0], Q[1][1] - Q[0][1]), H = Math.hypot(Q[3][0] - Q[0][0], Q[3][1] - Q[0][1]);
  const portrait = H > W * 1.05;
  const out = Core.warpPerspective(d, Q, portrait ? 631 : 1000, portrait ? 1000 : 631);
  return rotateCanvas(pixelsToCanvas(out), portrait ? 1 : 0);
}
function composeIdPage(front, back) {
  const W = 1654, H = 2339, c = mkCanvas(W, H), x = ctx2d(c);
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  const cw = 1000, ch = 631, cx = (W - cw) / 2;
  const ys = back ? [H * 0.27 - ch / 2, H * 0.63 - ch / 2] : [H * 0.5 - ch / 2];
  [front, back].forEach((img, i) => {
    if (!img) return;
    x.save(); x.shadowColor = 'rgba(0,0,0,.28)'; x.shadowBlur = 22; x.shadowOffsetY = 6;
    x.fillStyle = '#fff'; x.fillRect(cx, ys[i], cw, ch); x.restore();
    x.drawImage(img, cx, ys[i], cw, ch);
    x.strokeStyle = 'rgba(0,0,0,.18)'; x.lineWidth = 2; x.strokeRect(cx, ys[i], cw, ch);
  });
