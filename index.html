  pts.forEach((p) => {
    x.beginPath(); x.arc(p[0], p[1], 12, 0, 7); x.fillStyle = 'rgba(46,230,166,.28)'; x.fill();
    x.lineWidth = 3; x.strokeStyle = '#fff'; x.stroke();
    x.beginPath(); x.arc(p[0], p[1], 4, 0, 7); x.fillStyle = '#2ee6a6'; x.fill();
  });
  E.result = null;
}
function edDraw() {
  if (!E.active || !E.page) return;
  if (E.tab === 'crop') edDrawCrop();
  else if (E.result) drawResultCanvas(E.result);
}

function localXY(e) {

}
function hitTest(p) {

  if (best) return best;
  for (let i = 0; i < 4; i++) {
    const a = pts[i], b = pts[(i + 1) % 4], d = Math.hypot((a[0] + b[0]) / 2 - p[0], (a[1] + b[1]) / 2 - p[1]);

}
function viewToNorm(px, py) {
  const v = E.view;
  const u = clamp((px - v.x) / v.w, 0, 1), w = clamp((py - v.y) / v.h, 0, 1);
  const [x, y] = unrotN(u, w, E.page.rot);

}
function quadOk(q) {
  const Q = q.map((p) => [p.x * 100, p.y * 100]);

function edPointerDown(e) {
  if (E.tab !== 'crop' || !E.page) return;
  const p = localXY(e), h = hitTest(p);
  if (!h) return;
  E.cv.setPointerCapture(e.pointerId);
  E.drag = { h, start: p, quad0: E.page.quad.map((q) => ({ x: q.x, y: q.y })), pts0: cropPoints() };
  edShowLoupe(h);
  e.preventDefault();
}
function edPointerMove(e) {
  const d = E.drag;
  if (!d) {
    if (E.tab === 'crop' && e.pointerType === 'mouse') E.cv.style.cursor = hitTest(localXY(e)) ? 'grab' : 'default';
    return;
  }
  const p = localXY(e), dx = p[0] - d.start[0], dy = p[1] - d.start[1];
  const q = d.quad0.map((c) => ({ x: c.x, y: c.y }));
  if (d.h.type === 'corner') {
    const o = d.pts0[d.h.i];
    q[d.h.i] = viewToNorm(o[0] + dx, o[1] + dy);
  } else {
    const i = d.h.i, j = (i + 1) % 4, a = d.pts0[i], b = d.pts0[j];
    const ex = b[0] - a[0], ey = b[1] - a[1], L = Math.hypot(ex, ey) || 1, nx = -ey / L, ny = ex / L;

    edShowLoupe(d.h);
  }
  e.preventDefault();
}
function edPointerUp() {
  if (!E.drag) return;
  E.drag = null;
  $('#edLoupe').style.display = 'none';
  edCommitSoon();
}

function edShowLoupe(h) {
  const L = $('#edLoupe'), c = L.getContext('2d'), SZ = 224;
  const pt = h.type === 'corner' ? E.page.quad[h.i] : (() => { const a = E.page.quad[h.i], b = E.page.quad[(h.i + 1) % 4]; return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; })();

  const left = vp[0] > E.cw - 170 ? false : (vp[0] < 170 && vp[1] < 170);
  L.style.display = 'block';
  L.style.left = left ? 'auto' : '12px'; L.style.right = left ? '12px' : 'auto';
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, SZ, SZ);
  c.save();
  c.beginPath(); c.arc(SZ / 2, SZ / 2, SZ / 2, 0, 7); c.clip();
  c.fillStyle = '#111'; c.fillRect(0, 0, SZ, SZ);
  const k = E.view.sc * 2.4 * 2;
  c.translate(SZ / 2, SZ / 2); c.rotate(E.page.rot * Math.PI / 2); c.scale(k, k); c.translate(-pt.x * E.W, -pt.y * E.H);

  c.restore();

  c.beginPath(); c.moveTo(SZ / 2 - 18, SZ / 2); c.lineTo(SZ / 2 + 18, SZ / 2); c.moveTo(SZ / 2, SZ / 2 - 18); c.lineTo(SZ / 2, SZ / 2 + 18); c.stroke();
}

    });
    const cancel = () => clearTimeout(timer);
    el.addEventListener('pointermove', (e) => { if (Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancel(); });
    el.addEventListener('pointerup', cancel); el.addEventListener('pointercancel', cancel); el.addEventListener('pointerleave', cancel);

/* ------------------------------------------------------------- router */
let curRoute = null;
function showView(id) {
  $$('.view').forEach((v) => v.classList.toggle('active', v.id === id));
}
const depth = () => (history.state && history.state.d) || 0;
function navTo(path) { history.pushState({ d: depth() + 1 }, '', '#/' + path); route(); }
function navReplace(path) { history.replaceState({ d: depth() }, '', '#/' + path); route(); }
function navBack() { if (depth() > 0) history.back(); else navReplace(''); }
function navBackTo(fallback) { if (depth() > 0) history.back(); else navReplace(fallback); }

async function route() {
  const h = location.hash.replace(/^#\/?/, '');
  if (h === curRoute) return;
  const prev = curRoute || '';
  curRoute = h;
  const [name, a, b] = h.split('/').map(decodeURIComponent);
  const prevName = prev.split('/')[0];
  if (prevName === 'scan' && name !== 'scan') camLeave();
  if (prevName === 'edit' && name !== 'edit') edLeave();
  try {
    if (name === 'scan') { showView('vCam'); await camEnter(a); }
    else if (name === 'doc') { showView('vDoc'); await openDocView(a); }
    else if (name === 'edit') {
      const d = await loadDoc(a);
      if (!d || !d.pages.length) { navReplace(''); return; }
      S.doc = d;
      showView('vEdit');
      await nextFrame();
      await edOpen(d, +b || 0, prevName === 'edit' ? undefined : 'crop');
    } else { showView('vHome'); renderHome(); }
  } catch (e) { console.error(e); toast(String(e && e.message || e), 4000, 'err'); }
}
/* re-render list views after thumbnails changed in the background */
function refreshLibraryViews() {
  if (curRoute === '') renderHome();
  else if (curRoute && curRoute.indexOf('doc/') === 0 && S.doc) renderDoc();
}
function refreshAllText() {
  if (curRoute === '') renderHome();
  else if (curRoute && curRoute.indexOf('doc/') === 0) { renderDoc(); }
  relabelChips();
  Cam.hintKey = '';
  if (E.page) { $('#edPg').textContent = `${E.idx + 1} / ${E.doc.pages.length}`; }
}

/* ------------------------------------------------------------- import wiring */
async function handleImport(files) {
  const tgt = S.importTarget || 'home';
  S.importTarget = null;
  if (!files || !files.length) return;
  if (tgt === 'cam') {
    const doc = ensureDoc();
    S.doc = doc;
    await importFiles(files, doc, { onPage: (p) => { Cam.count++; updateCamCounter(); updateCamThumb(p); } });
  } else if (tgt === 'doc' && S.doc) {
    await importFiles(files, S.doc);
    renderDoc();
  } else {
    const d = await importFiles(files, null);
    if (d) navTo('doc/' + d.id);
  }
}

  $('#selCancel').addEventListener('click', () => { S.selMode = false; S.sel.clear(); updateSelUI(); });
  $('#selAll').addEventListener('click', () => { if (S.sel.size === S.doc.pages.length) S.sel.clear(); else S.doc.pages.forEach((_, i) => S.sel.add(i)); updateSelUI(); });
  $('#selLeft').addEventListener('click', () => { const i = [...S.sel][0]; if (i > 0) movePage(i, i - 1); });
  $('#selRight').addEventListener('click', () => { const i = [...S.sel][0]; if (i < S.doc.pages.length - 1) movePage(i, i + 1); });
  $('#selDel').addEventListener('click', deleteSelected);
  $('#selExport').addEventListener('click', () => exportOpen(S.doc, [...S.sel].sort((a, b) => a - b)));
  $('#docAddCam').addEventListener('click', () => { audio(); navTo('scan/' + S.doc.id); });
  $('#docAddImg').addEventListener('click', () => { S.importTarget = 'doc'; $('#fileImport').click(); });
  $('#docExport').addEventListener('click', () => exportOpen(S.doc));
  initSettings();
  window.addEventListener('popstate', route);
  window.addEventListener('hashchange', route);
}

/* ---- 60-export.js ---- */
/* ====================================================================
   EXPORT — PDF / JPG / PNG / ZIP, share, print, OCR
   ==================================================================== */
const QUAL = { small: { max: 1600, q: 0.72 }, std: { max: 2200, q: 0.86 }, high: { max: 3200, q: 0.93 } };
const Ex = { doc: null, sel: null, scope: 'all' };

function chipGroup(root, onChange) {
  root.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b || !root.contains(b)) return;
    $$('button', root).forEach((x) => x.classList.toggle('on', x === b));
    if (onChange) onChange(b.dataset.v);
  });
}
const chipValue = (root) => { const b = $('button.on', root); return b ? b.dataset.v : null; };
function chipSet(root, v) { $$('button', root).forEach((x) => x.classList.toggle('on', x.dataset.v === v)); }

function canShareFiles() {
  try {
    return !!(navigator.canShare && navigator.share && navigator.canShare({ files: [new File(['x'], 'a.pdf', { type: 'application/pdf' })] }));
  } catch (e) { return false; }
}
function exPages() {
  const d = Ex.doc;
  if (Ex.sel && Ex.scope === 'sel') return Ex.sel.map((i) => d.pages[i]).filter(Boolean);
  return d.pages.slice();
}
function exUpdateInfo() {
  const fmt = chipValue($('#exFormat'));
  $('#exSizeBox').hidden = fmt !== 'pdf';
  $('#exInfo').textContent = t('export.info', exPages().length);
}
function exportOpen(doc, sel) {
  if (!doc || !doc.pages.length) return;
  Ex.doc = doc; Ex.sel = sel && sel.length ? sel : null; Ex.scope = Ex.sel ? 'sel' : 'all';
  $('#exName').value = doc.name;
  chipSet($('#exFormat'), S.settings.expFormat);
  $('#exSize').value = S.settings.expSize;
  $('#exQuality').value = S.settings.expQuality;
  const sb = $('#exScopeBox');
  sb.hidden = !Ex.sel;
  if (Ex.sel) {
    const [a, b] = $$('#exScope button');
    a.textContent = t('export.all', doc.pages.length); b.textContent = t('export.selected', Ex.sel.length);
    chipSet($('#exScope'), 'sel');
  }
  $('#exShare').hidden = !canShareFiles();
  exUpdateInfo();
  $('#dlgExport').showModal();
}

async function exBuild(pages, fmt, name) {
  const Q = QUAL[S.settings.expQuality] || QUAL.std;
  const items = [];
  for (let i = 0; i < pages.length; i++) {
    busy(t('busy.render', i + 1, pages.length), i / pages.length);
    await nextFrame();
    const c = await renderPage(pages[i], 'full', Q.max);
    if (fmt === 'pdf') {
      const blob = await canvasToBlob(c, 'image/jpeg', Q.q);
      items.push({ jpeg: new Uint8Array(await blob.arrayBuffer()), w: c.width, h: c.height });
    } else {
      const blob = await canvasToBlob(c, fmt === 'png' ? 'image/png' : 'image/jpeg', Q.q);
      items.push({ blob, w: c.width, h: c.height });
    }
  }
  if (fmt === 'pdf') {
    busy(t('busy.pdf'), 1);
    await nextFrame();
    const bytes = Core.buildPDF(items, { size: S.settings.expSize, margin: S.settings.expSize === 'fit' ? 0 : 0, title: name });
    return { kind: 'pdf', blob: new Blob([bytes], { type: 'application/pdf' }), ext: '.pdf' };
  }
  return { kind: 'img', items, ext: fmt === 'png' ? '.png' : '.jpg', mime: fmt === 'png' ? 'image/png' : 'image/jpeg' };
}

async function exRun(action) {
  const pages = exPages();
  if (!pages.length) return;
  const fmt = chipValue($('#exFormat')) || 'pdf';
  const name = safeName($('#exName').value || Ex.doc.name);
  S.settings.expFormat = fmt; S.settings.expSize = $('#exSize').value; S.settings.expQuality = $('#exQuality').value; saveSettings();
  $('#dlgExport').close();
  try {
    const res = await exBuild(pages, fmt, name);
    let files = [];
    if (res.kind === 'pdf') files = [new File([res.blob], name + res.ext, { type: 'application/pdf' })];
    else files = await Promise.all(res.items.map(async (it, i) => new File([it.blob], res.items.length > 1 ? `${name}-${String(i + 1).padStart(2, '0')}${res.ext}` : name + res.ext, { type: res.mime })));
    if (action === 'share') {
      unbusy();
      if (navigator.canShare && navigator.canShare({ files })) {
        try { await navigator.share({ files, title: name }); }
        catch (e) { if (e && e.name !== 'AbortError') { console.error(e); toast(t('err.share'), 3000, 'err'); } }
        return;
      }
    }
    if (files.length === 1) downloadBlob(files[0], files[0].name);
    else {
      busy(t('busy.zip'), 1);
      await nextFrame();
      const zipFiles = [];
      for (const f of files) zipFiles.push({ name: f.name, data: new Uint8Array(await f.arrayBuffer()) });
      downloadBlob(new Blob([Core.buildZip(zipFiles)], { type: 'application/zip' }), name + '.zip');
    }
    unbusy();
    toast(t('export.done'), 2200, 'ok');
  } catch (e) {
    console.error(e);
    unbusy();
    toast(t('err.export') + (e && e.message ? ' — ' + e.message : ''), 4500, 'err');
  }
}

async function printPages(pages) {
  if (!pages.length) return;
  const area = $('#printArea');
  area.innerHTML = '';
  const urls = [];
  try {
    for (let i = 0; i < pages.length; i++) {
      busy(t('busy.render', i + 1, pages.length), i / pages.length);
      await nextFrame();
      const c = await renderPage(pages[i], 'full', 2200);
      const blob = await canvasToBlob(c, 'image/jpeg', 0.88), url = URL.createObjectURL(blob);
      urls.push(url);
      const im = new Image(); im.src = url; im.alt = '';
      area.appendChild(im);
      await im.decode().catch(() => {});
    }
    unbusy();
    const cleanup = () => { area.innerHTML = ''; urls.forEach((u) => URL.revokeObjectURL(u)); window.removeEventListener('afterprint', cleanup); };
    window.addEventListener('afterprint', cleanup);
    setTimeout(() => window.print(), 80);
  } catch (e) { console.error(e); unbusy(); toast(t('err.export'), 3000, 'err'); }
}

/* ------------------------------------------------------------- OCR (optional, loads Tesseract.js on demand) */
const TESS_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
const Oc = { pages: [], running: false };
function ocrOpen(pages) {
  Oc.pages = pages;
  $('#ocrText').value = '';
  chipSet($('#ocrLang'), LANG === 'th' ? 'tha+eng' : 'eng');
  $('#ocrProg').hidden = true;
  $('#ocrStatus').textContent = t('ocr.note');
  $('#dlgOcr').showModal();
  ocrRun();
}
async function ocrRun() {
  if (Oc.running) return;
  Oc.running = true;
  const lang = chipValue($('#ocrLang')) || 'eng', n = Oc.pages.length;
  const prog = $('#ocrProg'), bar = $('#ocrBar'), st = $('#ocrStatus');
  prog.hidden = false; bar.style.width = '2%';
  st.textContent = t('ocr.loading');
  let worker = null;
  try {
    if (!window.Tesseract) await loadScript(TESS_URL);
    let cur = 0;
    worker = await window.Tesseract.createWorker(lang, 1, {
      logger: (m) => {
        if (m.status === 'recognizing text') bar.style.width = Math.round(((cur + m.progress) / n) * 100) + '%';
        else if (typeof m.progress === 'number') st.textContent = t('ocr.loading') + ' ' + Math.round(m.progress * 100) + '%';
      }
    });
    let text = '';
    for (let i = 0; i < n; i++) {
      cur = i;
      st.textContent = t('ocr.page', i + 1, n);
      const c = await renderPage(Oc.pages[i], 'full', 2200);
      const r = await worker.recognize(c);
      text += (n > 1 ? `${i ? '\n\n' : ''}— ${t('page')} ${i + 1} —\n` : '') + (r.data.text || '').trim();
      $('#ocrText').value = text;
    }
    bar.style.width = '100%';
    st.textContent = text.trim() ? t('ocr.done') : t('ocr.empty');
  } catch (e) {
    console.error(e);
    st.textContent = t('ocr.err');
  } finally {
    if (worker) { try { await worker.terminate(); } catch (e) { /* ignore */ } }
    Oc.running = false;
    setTimeout(() => { prog.hidden = true; }, 600);
  }
}

function initExport() {
  const dlg = $('#dlgExport');
  closeOnBackdrop(dlg); closeOnBackdrop($('#dlgOcr')); closeOnBackdrop($('#dlgMenu'));
  chipGroup($('#exFormat'), exUpdateInfo);
  chipGroup($('#exScope'), (v) => { Ex.scope = v; exUpdateInfo(); });
  $('#exGo').addEventListener('click', () => exRun('download'));
  $('#exShare').addEventListener('click', () => exRun('share'));
  $('#exPrint').addEventListener('click', () => { const p = exPages(); dlg.close(); printPages(p); });
  chipGroup($('#ocrLang'), () => { if (!Oc.running) ocrRun(); });
  $('#ocrRun').addEventListener('click', ocrRun);
  $('#ocrCopy').addEventListener('click', async () => {
    const ta = $('#ocrText');
    try { await navigator.clipboard.writeText(ta.value); } catch (e) { ta.select(); document.execCommand('copy'); }
    toast(t('ocr.copied'), 1600, 'ok');
  });
  $('#ocrSave').addEventListener('click', () => {
    const txt = $('#ocrText').value;
    if (!txt.trim()) return;
    downloadBlob(new Blob(['﻿' + txt], { type: 'text/plain;charset=utf-8' }), safeName((S.doc && S.doc.name) || 'scan') + '.txt');
  });
}

/* ---- 90-main.js ---- */
/* ====================================================================
   MAIN — startup, global shortcuts, drag & drop
   ==================================================================== */
async function init() {
  applyTheme();
  applyI18n(document);
  fillFilterSelect();
  await DB.open();
  try {
    const recs = await DB.allDocs();
    S.docs = recs.map(hydrateDoc);
  } catch (e) { console.error(e); S.docs = []; }

  initCamera(); initEditor(); initLibrary(); initExport();

  document.addEventListener('pointerdown', () => audio(), { once: true, passive: true });
  window.addEventListener('pagehide', () => { flushSave(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });
  window.addEventListener('unhandledrejection', (e) => console.error('Unhandled', e.reason));

  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input,textarea,select')) return;
    if (document.querySelector('dialog[open]')) return;
    const r = (curRoute || '').split('/')[0];
    if (r === 'scan') {
      if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); camCapture('manual'); }
      else if (e.key === 'Escape') camFinish();
      else if (e.key === 'a' || e.key === 'A') $('#camAuto').click();
    } else if (r === 'edit') {
      if (e.key === 'ArrowLeft') edGo(-1);
      else if (e.key === 'ArrowRight') edGo(1);
      else if (e.key === 'Escape') navBackTo('doc/' + (E.doc ? E.doc.id : ''));
    } else if (r === 'doc') {
      if (e.key === 'Escape') { if (S.selMode) { S.selMode = false; S.sel.clear(); updateSelUI(); } else navBackTo(''); }
      else if ((e.key === 'Delete' || e.key === 'Backspace') && S.selMode && S.sel.size) deleteSelected();
    }
  });

  // drag & drop / paste images (desktop)
  const routeTarget = () => { const r = (curRoute || '').split('/')[0]; return r === 'doc' ? 'doc' : r === 'scan' ? 'cam' : 'home'; };
  window.addEventListener('dragover', (e) => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).indexOf('Files') >= 0) e.preventDefault(); });
  window.addEventListener('drop', (e) => {
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();
    const r = (curRoute || '').split('/')[0];
    if (r === 'edit') return;
    S.importTarget = routeTarget();
    handleImport(Array.from(e.dataTransfer.files));
  });
  document.addEventListener('paste', (e) => {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    const files = Array.from((e.clipboardData && e.clipboardData.files) || []);
    if (!files.length || (curRoute || '').indexOf('edit') === 0) return;
    S.importTarget = routeTarget();
    handleImport(files);
  });

  await route();
  document.documentElement.classList.add('ready');
}
init().catch((e) => { console.error(e); toast(String((e && e.message) || e), 6000, 'err'); });

})();
