<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f2eb">
<meta name="color-scheme" content="light dark">
<meta name="description" content="FlowScan — แอปสแกนเอกสารด้วยกล้อง สแกนต่อเนื่องอัตโนมัติ ตัดขอบ ปรับภาพ ส่งออก PDF ทำงานในเบราว์เซอร์ ไม่อัปโหลดข้อมูล">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FlowScan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FlowScan — สแกนเอกสารต่อเนื่อง</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='9' fill='%23e8470f'/%3E%3Cpath d='M9 12.5V10.5A1.5 1.5 0 0 1 10.5 9H12.5M19.5 9H21.5A1.5 1.5 0 0 1 23 10.5V12.5M23 19.5V21.5A1.5 1.5 0 0 1 21.5 23H19.5M12.5 23H10.5A1.5 1.5 0 0 1 9 21.5V19.5' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M9 16H23' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f2eb; --surface:#fffdf8; --surface2:#ebe6da; --ink:#1c1b18; --ink2:#645f54; --line:#ddd7c9;
  --accent:#e8470f; --accent2:#ff6b35; --on-accent:#fff; --ok:#0fa573; --danger:#d3372c; --scan:#2ee6a6;
  --shadow:0 1px 2px rgba(60,40,10,.06),0 8px 24px rgba(60,40,10,.09);
  --stage:#e4dfd2;
  --r:16px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai","Leelawadee UI","Thonburi","Sukhumvit Set",Tahoma,"Helvetica Neue",Arial,sans-serif;
}
:root[data-theme=dark]{
  --bg:#111113; --surface:#1b1b1f; --surface2:#27272d; --ink:#f4f1ea; --ink2:#a9a59b; --line:#35353c;
  --accent:#ff7a45; --accent2:#ff9566; --on-accent:#1b0d05; --stage:#0b0b0d;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{position:fixed;inset:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:2px;border-radius:8px}
.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i.s{width:18px;height:18px}
.i.fill{fill:currentColor;stroke:none}
.grow{flex:1}

/* ---------- views ---------- */
#app{position:absolute;inset:0}
.view{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.view.active{display:flex;animation:viewIn .22s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bar{display:flex;align-items:center;gap:6px;padding:calc(var(--st) + 8px) calc(var(--sr) + 12px) 8px calc(var(--sl) + 12px);min-height:calc(56px + var(--st));flex:none}
.bar h1{font-size:1.05rem;margin:0;font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:inherit;flex:none;transition:background .15s}
.icon-btn:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.icon-btn:active{background:color-mix(in srgb,var(--ink) 14%,transparent)}
.icon-btn[disabled]{opacity:.35;pointer-events:none}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{max-width:1180px;margin:0 auto;padding:6px calc(var(--sr) + 16px) 120px calc(var(--sl) + 16px)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;font-weight:600;background:var(--surface2);color:var(--ink);transition:transform .1s,filter .15s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 38%,transparent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{color:var(--danger)}
.btn.big{min-height:54px;padding:0 28px;font-size:1.05rem}
.btn.sm{min-height:36px;padding:0 14px;font-size:.88rem}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- brand ---------- */
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.brand svg{width:30px;height:30px}
.brand b{color:var(--accent);font-weight:800}

/* ---------- home ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:0 16px;height:46px;box-shadow:inset 0 0 0 1.5px var(--line);margin:4px 0 16px}
.search input{flex:1;border:0;background:none;outline:0;min-width:0;height:100%}
.search .i{color:var(--ink2);width:20px;height:20px}
.grid{display:grid;gap:16px}
.grid.docs{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.grid.pages{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px}
@media (min-width:760px){.grid.docs{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:20px}.grid.pages{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}}
.dcard{position:relative;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s}
.dcard:hover{transform:translateY(-2px)}
.dcard:active{transform:scale(.985)}
.dthumb{aspect-ratio:3/4;background:var(--surface2);display:grid;place-items:center;overflow:hidden;position:relative}
.dthumb img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.dthumb .stack{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.62);color:#fff;font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:999px;backdrop-filter:blur(4px)}
.dmeta{padding:10px 12px 12px;display:flex;align-items:flex-start;gap:6px}
.dmeta .t{flex:1;min-width:0}
.dmeta .n{font-weight:650;font-size:.93rem;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dmeta .s{font-size:.78rem;color:var(--ink2);margin-top:2px}
.dmeta .icon-btn{width:34px;height:34px;margin:-4px -6px 0 0}
.skel{background:linear-gradient(100deg,var(--surface2) 30%,color-mix(in srgb,var(--surface2) 60%,var(--surface)) 50%,var(--surface2) 70%);background-size:200% 100%;animation:shimmer 1.3s infinite linear}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.empty{text-align:center;padding:28px 8px 12px;max-width:520px;margin:0 auto}
.empty svg.hero{width:min(260px,70%);height:auto;margin:0 auto 6px;display:block}
.empty h2{font-size:1.5rem;margin:.2em 0 .3em;letter-spacing:-.01em}
.empty p{color:var(--ink2);margin:.2em 0 1em}
.feat{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:10px;text-align:left}
.feat li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);padding:12px 14px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line)}
.feat .i{color:var(--accent);margin-top:2px}
.feat b{display:block;font-size:.95rem}
.feat span{font-size:.85rem;color:var(--ink2)}
.foot{color:var(--ink2);font-size:.8rem;text-align:center;margin:26px 0 0}
.fabbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:12px;padding:30px calc(var(--sr) + 16px) calc(var(--sb) + 16px) calc(var(--sl) + 16px);background:linear-gradient(to top,var(--bg) 55%,transparent);pointer-events:none}
.fabbar .btn{pointer-events:auto}

/* ---------- document view ---------- */
.pcard{position:relative;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .15s,box-shadow .15s}
.pcard .pimg{aspect-ratio:3/4;display:grid;place-items:center;overflow:hidden;border-radius:12px 12px 0 0;background:var(--surface2)}
.pcard img{width:100%;height:100%;object-fit:contain;background:#fff;pointer-events:none;-webkit-user-drag:none}
.pcard .pn{text-align:center;font-size:.8rem;font-weight:650;padding:6px 0 7px;color:var(--ink2)}
.pcard.drop{outline:3px dashed var(--accent);outline-offset:3px}
.pcard.dragging{opacity:.4}
.pcard .chk{position:absolute;left:8px;top:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:inset 0 0 0 2px rgba(0,0,0,.35);display:none;place-items:center;color:#fff}
.sel-mode .pcard .chk{display:grid}
.pcard.sel{box-shadow:0 0 0 3px var(--accent),var(--shadow)}
.pcard.sel .chk{background:var(--accent);box-shadow:none}
.pcard.sel .chk .i{width:16px;height:16px;stroke-width:3}
.pcard .chk .i{display:none}.pcard.sel .chk .i{display:block}
.dock{display:flex;justify-content:center;gap:10px;padding:12px calc(var(--sr) + 14px) calc(var(--sb) + 12px) calc(var(--sl) + 14px);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);flex:none;flex-wrap:wrap}
.dock .btn{flex:1 1 0;max-width:220px;min-width:96px;padding:0 14px}
.dock .btn.primary{flex:1.35 1 0}
.selbar{display:flex;align-items:center;gap:4px;padding:6px calc(var(--sr) + 12px) 6px calc(var(--sl) + 12px);background:var(--accent);color:var(--on-accent);flex:none}
.selbar .cnt{font-weight:700;margin-right:auto;padding-left:6px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto}

/* ---------- camera ---------- */
.cam{background:#000;color:#fff;--ink:#fff;display:none;grid-template-rows:auto 1fr auto;grid-template-columns:1fr}
.cam.active{display:grid}
.cam-top{grid-row:1;display:flex;align-items:center;gap:2px;padding:calc(var(--st) + 6px) calc(var(--sr) + 8px) 6px calc(var(--sl) + 8px);background:#000}
.cam-top .icon-btn{color:#fff}
.cam-top .icon-btn.on{background:rgba(255,214,102,.22);color:#ffd666}
.cam-stage{grid-row:2;position:relative;overflow:hidden;background:#0a0a0a;min-height:0}
.cam-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0a0a0a}
.cam-stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cam-hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:calc(100% - 24px);background:rgba(0,0,0,.62);backdrop-filter:blur(8px);padding:7px 16px;border-radius:999px;font-size:.9rem;font-weight:600;text-align:center;transition:background .2s,color .2s;z-index:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cam-hint.ok{background:rgba(15,165,115,.85)}
.cam-hint.warn{background:rgba(232,71,15,.85)}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.cam-flash.go{animation:flash .28s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.cam-zoom{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(280px,70%);display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);padding:4px 14px;border-radius:999px;z-index:3;font-size:.78rem;font-weight:700}
.cam-zoom input{flex:1;accent-color:var(--scan)}
.cam-msg{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:24px;background:#0a0a0a;z-index:5}
.cam-msg h3{margin:0;font-size:1.2rem}
.cam-msg p{margin:0;color:#c9c5ba;max-width:360px;font-size:.92rem}
.cam-msg .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.cam-bottom{grid-row:3;background:#000;padding:8px calc(var(--sr) + 14px) calc(var(--sb) + 14px) calc(var(--sl) + 14px);display:flex;flex-direction:column;gap:10px}
.cam-modes{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seg{display:inline-flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.seg button{padding:7px 15px;border-radius:999px;font-size:.86rem;font-weight:650;color:#d8d4c9;display:flex;align-items:center;gap:6px}
.seg button.on{background:#fff;color:#111}
.autotog{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 11px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:700;font-size:.86rem;color:#d8d4c9;transition:background .2s,color .2s}
.autotog .dot{width:9px;height:9px;border-radius:50%;background:#777}
.autotog.on{background:rgba(46,230,166,.2);color:var(--scan)}
.autotog.on .dot{background:var(--scan);box-shadow:0 0 0 4px rgba(46,230,166,.25);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(46,230,166,.05)}}
.cam-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cam-row>*{flex:1;display:flex;justify-content:center}
.cam-row>*:first-child{justify-content:flex-start}
.cam-row>*:last-child{justify-content:flex-end}
.cam-btn{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff}
.shutter{position:relative;width:80px;height:80px;border-radius:50%;display:grid;place-items:center;flex:none}
.shutter svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.shutter .core{width:62px;height:62px;border-radius:50%;background:#fff;transition:transform .12s,background .2s}
.shutter:active .core{transform:scale(.9)}
.shutter.auto .core{background:var(--scan)}
.shutter.busy .core{background:#999}
.donebtn{position:relative;width:62px;height:62px;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.donebtn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.donebtn .badge{position:absolute;right:3px;top:3px;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--on-accent);font-size:.78rem;font-weight:800;display:grid;place-items:center;padding:0 5px;z-index:1}
.donebtn .ck{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);display:grid;place-items:center;height:20px;z-index:1}
.donebtn .ck .i{width:15px;height:15px;stroke-width:3}
.donebtn.empty-d{box-shadow:none;opacity:.5}
@media (orientation:landscape){
  .cam{grid-template-columns:1fr auto;grid-template-rows:auto 1fr}
  .cam-top{grid-column:1;grid-row:1}
  .cam-stage{grid-column:1;grid-row:2}
  .cam-bottom{grid-column:2;grid-row:1/3;flex-direction:column-reverse;justify-content:center;align-items:center;gap:16px;padding:calc(var(--st) + 10px) calc(var(--sr) + 14px) calc(var(--sb) + 10px) 14px;min-width:150px}
  .cam-row{flex-direction:column-reverse;width:100%;gap:18px;flex:none}
  .cam-row>*{justify-content:center!important;flex:none}
  .cam-modes{flex-direction:column;gap:12px}
}

/* ---------- editor ---------- */
.edit{display:none;grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-columns:minmax(0,1fr);background:var(--bg)}
.edit.active{display:grid}
.edit .bar{grid-row:1}
.ed-stage{grid-row:2;position:relative;background:var(--stage);min-height:0;touch-action:none;overflow:hidden}
.ed-stage canvas#edCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.ed-stage canvas#edLoupe{position:absolute;left:12px;top:12px;width:112px;height:112px;border-radius:50%;box-shadow:0 0 0 3px #fff,0 8px 24px rgba(0,0,0,.5);pointer-events:none;display:none;z-index:2}
.ed-stage .spin{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--stage) 60%,transparent);z-index:3}
.ed-panel{min-width:0;grid-row:3;background:var(--surface);border-top:1px solid var(--line);padding:10px calc(var(--sr) + 12px) 8px calc(var(--sl) + 12px);min-height:84px}
.ed-tabs{min-width:0;grid-row:4;display:flex;background:var(--surface);padding:0 calc(var(--sr) + 6px) var(--sb) calc(var(--sl) + 6px);border-top:1px solid var(--line)}
.ed-tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:.78rem;font-weight:650;color:var(--ink2);border-radius:12px;margin:4px 2px;transition:background .15s,color .15s}
.ed-tabs button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,transparent)}
.ed-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pane{display:none}.pane.on{display:block}
.filters{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.fchip{flex:none;width:78px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.76rem;font-weight:600;color:var(--ink2)}
.fchip canvas{width:78px;height:96px;object-fit:contain;border-radius:10px;background:#fff;box-shadow:0 0 0 1.5px var(--line);display:block}
.fchip.on{color:var(--accent)}
.fchip.on canvas{box-shadow:0 0 0 3px var(--accent)}
.slider{display:grid;grid-template-columns:92px 1fr 40px;align-items:center;gap:10px;margin:7px 0;font-size:.85rem;font-weight:600}
.slider input{width:100%;accent-color:var(--accent)}
.slider output{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.pg-nav{display:flex;align-items:center;gap:0}
.pg-nav span{min-width:56px;text-align:center;font-weight:700;font-size:.92rem;font-variant-numeric:tabular-nums}
@media (min-width:880px) and (min-height:560px){
  .edit{grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr) auto}
  .edit .bar{grid-column:1/3}
  .ed-stage{grid-column:1;grid-row:2/4}
  .ed-panel{grid-column:2;grid-row:2;border-top:0;border-left:1px solid var(--line);padding:18px;overflow:auto}
  .ed-tabs{grid-column:2;grid-row:3;border-left:1px solid var(--line)}
  .filters{flex-wrap:wrap;overflow:visible}
  .fchip{width:96px}.fchip canvas{width:96px;height:118px}
}

/* ---------- dialogs ---------- */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;width:min(580px,100%);max-width:100%;max-height:90dvh;margin:auto auto 0;box-shadow:0 -8px 40px rgba(0,0,0,.28);overflow:hidden}
dialog[open]{animation:sheetIn .24s cubic-bezier(.2,.9,.3,1) both;display:flex;flex-direction:column}
@keyframes sheetIn{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
dialog::backdrop{background:rgba(12,9,4,.52);backdrop-filter:blur(3px)}
@media (min-width:700px){dialog{margin:auto;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 12px 6px 22px;flex:none}
.sheet-h h2{margin:0;font-size:1.15rem;flex:1}
.sheet-b{padding:6px 22px 14px;overflow:auto;flex:1}
.sheet-f{display:flex;gap:10px;justify-content:flex-end;padding:10px 22px calc(var(--sb) + 18px);flex:none;flex-wrap:wrap}
.sheet-f .btn{flex:1 1 130px}
.field{display:grid;gap:6px;margin:12px 0}
.field>label,.field>.lbl{font-size:.82rem;font-weight:700;color:var(--ink2)}
.field input[type=text],.field select,.field textarea{width:100%;min-height:46px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);outline:0}
.field input[type=text]:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{min-height:200px;resize:vertical;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:9px 16px;border-radius:999px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:650;font-size:.9rem}
.chips button.on{background:var(--accent);color:var(--on-accent);box-shadow:none}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .tx b{display:block;font-size:.95rem}.row .tx span{display:block;font-size:.8rem;color:var(--ink2)}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{appearance:none;-webkit-appearance:none;width:100%;height:100%;border-radius:999px;background:var(--line);outline:0;cursor:pointer;transition:background .2s;margin:0}
.switch input:checked{background:var(--accent)}
.switch input:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s;pointer-events:none}
.switch:has(input:checked)::after{transform:translateX(20px)}
.row select{min-height:40px;padding:6px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);max-width:52%}
.menu-item{display:flex;align-items:center;gap:14px;width:100%;padding:14px 22px;font-weight:600;text-align:left}
.menu-item:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.menu-item.danger{color:var(--danger)}
.menu-item .i{color:var(--ink2)}.menu-item.danger .i{color:var(--danger)}
#menuItems{padding-bottom:calc(var(--sb) + 14px);overflow:auto}
.progress{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.note{font-size:.82rem;color:var(--ink2);margin:8px 0}
.hr{height:1px;background:var(--line);margin:14px 0}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 110px);transform:translate(-50%,20px);background:rgba(25,23,18,.94);color:#fff;padding:11px 20px;border-radius:999px;font-weight:600;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:min(92vw,520px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#a52a1f}
.toast.ok{background:#0b7a57}
.busy{position:fixed;inset:0;background:rgba(10,8,4,.55);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:200}
.busy .box{background:var(--surface);padding:24px 28px;border-radius:20px;min-width:230px;max-width:80vw;display:grid;gap:14px;justify-items:center;text-align:center;box-shadow:var(--shadow)}
.busy .progress{width:100%}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid var(--surface2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#printArea{display:none}
@media print{
  body{position:static;overflow:visible;height:auto}
  #app,.toast,.busy,dialog{display:none!important}
  #printArea{display:block}
  #printArea img{display:block;width:100%;max-height:100vh;object-fit:contain;page-break-after:always;break-after:page}
  @page{margin:0}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.doc-title{display:flex;align-items:center;gap:6px;min-width:0;padding:6px 8px;border-radius:12px;color:inherit}
.doc-title:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.doc-title .i{color:var(--ink2);flex:none}
</style>

<script>
/* =====================================================================
   CORE — pure algorithms (no DOM). Works in browser and in Node tests.
   - document edge detection (edges + brightness segmentation + line refine)
   - perspective warp, background-normalising filters
   - minimal PDF writer (JPEG pages) and ZIP (store) writer
   ===================================================================== */
const Core = (() => {
'use strict';

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

/* ------------------------------------------------------------------ geometry */
function polyArea(P) {
  let s = 0;
  for (let i = 0; i < P.length; i++) {
    const a = P[i], b = P[(i + 1) % P.length];
    s += a[0] * b[1] - b[0] * a[1];
  }
  return Math.abs(s) / 2;
}
function cross(o, a, b) { return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]); }

function convexHull(pts) {
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const n = pts.length;
  if (n < 3) return pts;
  const lo = [];
  for (const p of pts) {
    while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop();
    lo.push(p);
  }
  const up = [];
  for (let i = n - 1; i >= 0; i--) {
    const p = pts[i];
    while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop();
    up.push(p);
  }
  up.pop(); lo.pop();
  return lo.concat(up);
}

function lineIntersect(a, b, c, d) {
  const rx = b[0] - a[0], ry = b[1] - a[1], sx = d[0] - c[0], sy = d[1] - c[1];
  const den = rx * sy - ry * sx;
  if (Math.abs(den) < 1e-9) return null;
  const t = ((c[0] - a[0]) * sy - (c[1] - a[1]) * sx) / den;
  const u = ((c[0] - a[0]) * ry - (c[1] - a[1]) * rx) / den;
  return { x: a[0] + t * rx, y: a[1] + t * ry, t, u };
}

/* greedy reduction of a convex polygon to a quadrilateral that encloses it */
function hullToQuad(hull) {
  let P = hull.map(p => [p[0], p[1]]);
  if (P.length < 4) return null;
  while (P.length > 4) {
    const n = P.length;
    let bi = -1, bc = Infinity, bx = null;
    for (let i = 0; i < n; i++) {
      const a = P[(i + n - 1) % n], b = P[i], c = P[(i + 1) % n], d = P[(i + 2) % n];
      const X = lineIntersect(a, b, c, d);
      if (!X || X.t <= 1 || X.u >= 0) continue;
      const cost = polyArea([b, [X.x, X.y], c]);
      if (cost < bc) { bc = cost; bi = i; bx = [X.x, X.y]; }
    }
    if (bi < 0) return null;
    const next = [];
    for (let k = 0; k < n; k++) {
      if (k === bi) next.push(bx);
      else if (k === (bi + 1) % n) continue;
      else next.push(P[k]);
    }
    P = next;
  }
  return P;
}

function extremeQuad(hull) {
  let tl = hull[0], br = hull[0], tr = hull[0], bl = hull[0];
  for (const p of hull) {
    if (p[0] + p[1] < tl[0] + tl[1]) tl = p;
    if (p[0] + p[1] > br[0] + br[1]) br = p;
    if (p[0] - p[1] > tr[0] - tr[1]) tr = p;
    if (p[0] - p[1] < bl[0] - bl[1]) bl = p;
  }
  return [tl, tr, br, bl].map(p => [p[0], p[1]]);
}

/* order 4 points clockwise (screen coords) starting at top-left */
function orderQuad(P) {
  const cx = (P[0][0] + P[1][0] + P[2][0] + P[3][0]) / 4;
  const cy = (P[0][1] + P[1][1] + P[2][1] + P[3][1]) / 4;
  const s = P.slice().sort((a, b) => Math.atan2(a[1] - cy, a[0] - cx) - Math.atan2(b[1] - cy, b[0] - cx));
  let k = 0, m = Infinity;
  s.forEach((p, i) => { const v = p[0] + p[1]; if (v < m) { m = v; k = i; } });
  return [s[k], s[(k + 1) % 4], s[(k + 2) % 4], s[(k + 3) % 4]];
}

function isConvexQuad(Q) {
  let sign = 0;
  for (let i = 0; i < 4; i++) {
    const c = cross(Q[i], Q[(i + 1) % 4], Q[(i + 2) % 4]);
    if (Math.abs(c) < 1e-6) return false;
    const s = c > 0 ? 1 : -1;
    if (sign === 0) sign = s; else if (s !== sign) return false;
  }
  return true;
}

function quadAngleDev(Q) {
  let dev = 0;
  for (let i = 0; i < 4; i++) {
    const a = Q[(i + 3) % 4], b = Q[i], c = Q[(i + 1) % 4];
    const v1x = a[0] - b[0], v1y = a[1] - b[1], v2x = c[0] - b[0], v2y = c[1] - b[1];
    const l = Math.hypot(v1x, v1y) * Math.hypot(v2x, v2y);
    if (l < 1e-6) return 180;
    const ang = Math.acos(clamp((v1x * v2x + v1y * v2y) / l, -1, 1)) * 180 / Math.PI;
    dev = Math.max(dev, Math.abs(ang - 90));
  }
  return dev;
}

function pointInQuad(Q, x, y) {
  let sign = 0;
  for (let i = 0; i < 4; i++) {
    const a = Q[i], b = Q[(i + 1) % 4];
    const c = (b[0] - a[0]) * (y - a[1]) - (b[1] - a[1]) * (x - a[0]);
    const s = c >= 0 ? 1 : -1;
    if (sign === 0) sign = s; else if (s !== sign) return false;
  }
  return true;
}

/* ------------------------------------------------------------------ basic image ops */
function grayFromRGBA(d, w, h) {
  const g = new Uint8Array(w * h);
  for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = (d[j] * 77 + d[j + 1] * 150 + d[j + 2] * 29) >> 8;
  return g;
}

function boxBlur3(src, w, h) {
  const tmp = new Uint16Array(w * h), out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    const r = y * w;
    for (let x = 0; x < w; x++) {
      tmp[r + x] = src[r + (x > 0 ? x - 1 : 0)] + src[r + x] + src[r + (x < w - 1 ? x + 1 : x)];
    }
  }
  for (let y = 0; y < h; y++) {
    const r0 = (y > 0 ? y - 1 : 0) * w, r1 = y * w, r2 = (y < h - 1 ? y + 1 : y) * w;
    for (let x = 0; x < w; x++) out[r1 + x] = ((tmp[r0 + x] + tmp[r1 + x] + tmp[r2 + x] + 4) / 9) | 0;
  }
  return out;
}

function otsu(g) {
  const hist = new Uint32Array(256);
  for (let i = 0; i < g.length; i++) hist[g[i]]++;
  const total = g.length;
  let sum = 0;
  for (let t = 0; t < 256; t++) sum += t * hist[t];
  let sumB = 0, wB = 0, best = -1, thr = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t];
    if (!wB) continue;
    const wF = total - wB;
    if (!wF) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const v = wB * wF * (mB - mF) * (mB - mF);
    if (v > best) { best = v; thr = t; }
  }
  return thr;
}

function sobel(g, w, h) {
  const gx = new Int16Array(w * h), gy = new Int16Array(w * h), mag = new Uint16Array(w * h);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      const a = g[i - w - 1], b = g[i - w], c = g[i - w + 1], d = g[i - 1], f = g[i + 1],
            e = g[i + w - 1], hh = g[i + w], k = g[i + w + 1];
      const dx = (c + 2 * f + k) - (a + 2 * d + e);
      const dy = (e + 2 * hh + k) - (a + 2 * b + c);
      gx[i] = dx; gy[i] = dy;
      mag[i] = (dx < 0 ? -dx : dx) + (dy < 0 ? -dy : dy);
    }
  }
  return { gx, gy, mag, w, h };
}

function percentileU16(arr, p, maxV) {
  const bins = new Uint32Array(maxV + 1);
  for (let i = 0; i < arr.length; i++) bins[arr[i] > maxV ? maxV : arr[i]]++;
  const target = arr.length * p;
  let acc = 0;
  for (let v = 0; v <= maxV; v++) { acc += bins[v]; if (acc >= target) return v; }
  return maxV;
}

function dilate(mask, w, h, iter) {
  let cur = mask;
  for (let it = 0; it < iter; it++) {
    const tmp = new Uint8Array(w * h), out = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) {
      const r = y * w;
      for (let x = 0; x < w; x++) {
        if (cur[r + x] || (x > 0 && cur[r + x - 1]) || (x < w - 1 && cur[r + x + 1])) tmp[r + x] = 1;
      }
    }
    for (let y = 0; y < h; y++) {
      const r = y * w;
      for (let x = 0; x < w; x++) {
        if (tmp[r + x] || (y > 0 && tmp[r - w + x]) || (y < h - 1 && tmp[r + w + x])) out[r + x] = 1;
      }
    }
    cur = out;
  }
  return cur;
}

/* mark everything reachable from the frame border through non-blocked pixels */
function floodOutside(block, w, h) {
  const n = w * h, out = new Uint8Array(n), stack = new Int32Array(n);
  let sp = 0;
  const seed = (i) => { if (!block[i] && !out[i]) { out[i] = 1; stack[sp++] = i; } };
  for (let x = 0; x < w; x++) { seed(x); seed((h - 1) * w + x); }
  for (let y = 0; y < h; y++) { seed(y * w); seed(y * w + w - 1); }
  while (sp) {
    const p = stack[--sp], x = p % w, y = (p / w) | 0;
    if (x > 0) seed(p - 1);
    if (x < w - 1) seed(p + 1);
    if (y > 0) seed(p - w);
    if (y < h - 1) seed(p + w);
  }
  return out;
}

function labelMask(mask, w, h) {
  const n = w * h, lab = new Int32Array(n), stack = new Int32Array(n), comps = [];
  let id = 0;
  for (let s = 0; s < n; s++) {
    if (!mask[s] || lab[s]) continue;
    id++;
    let sp = 0, area = 0, minx = w, maxx = 0, miny = h, maxy = 0;
    stack[sp++] = s; lab[s] = id;
    while (sp) {
      const p = stack[--sp], x = p % w, y = (p / w) | 0;
      area++;
      if (x < minx) minx = x; if (x > maxx) maxx = x; if (y < miny) miny = y; if (y > maxy) maxy = y;
      if (x > 0 && mask[p - 1] && !lab[p - 1]) { lab[p - 1] = id; stack[sp++] = p - 1; }
      if (x < w - 1 && mask[p + 1] && !lab[p + 1]) { lab[p + 1] = id; stack[sp++] = p + 1; }
      if (y > 0 && mask[p - w] && !lab[p - w]) { lab[p - w] = id; stack[sp++] = p - w; }
      if (y < h - 1 && mask[p + w] && !lab[p + w]) { lab[p + w] = id; stack[sp++] = p + w; }
    }
    comps.push({ id, area, minx, maxx, miny, maxy });
  }
  return { lab, comps };
}

function componentBoundary(lab, c, w, h) {
  const pts = [];
  const id = c.id;
  for (let y = c.miny; y <= c.maxy; y++) {
    for (let x = c.minx; x <= c.maxx; x++) {
      const i = y * w + x;
      if (lab[i] !== id) continue;
      if (x === 0 || y === 0 || x === w - 1 || y === h - 1 ||
          lab[i - 1] !== id || lab[i + 1] !== id || lab[i - w] !== id || lab[i + w] !== id) pts.push([x, y]);
    }
  }
  return pts;
}

/* ------------------------------------------------------------------ line refinement */
function fitLineTLS(pts) {
  let mx = 0, my = 0;
  for (const p of pts) { mx += p[0]; my += p[1]; }
  mx /= pts.length; my /= pts.length;
  let sxx = 0, sxy = 0, syy = 0;
  for (const p of pts) {
    const dx = p[0] - mx, dy = p[1] - my;
    sxx += dx * dx; sxy += dx * dy; syy += dy * dy;
  }
  const th = 0.5 * Math.atan2(2 * sxy, sxx - syy);
  return { mx, my, dx: Math.cos(th), dy: Math.sin(th) };
}

function refineQuad(Q, S, rad, thrEdge) {
  const { gx, gy, w, h } = S;
  const sides = [];
  let polSum = 0;
  for (let i = 0; i < 4; i++) {
    const p = Q[i], q = Q[(i + 1) % 4];
    const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy);
    if (L < 8) return null;
    const ux = dx / L, uy = dy / L, nx = uy, ny = -ux;
    const N = clamp(Math.round(L / 4), 8, 90);
    const samples = [];
    for (let k = 0; k < N; k++) {
      const t = 0.08 + 0.84 * (k + 0.5) / N;
      const cx = p[0] + dx * t, cy = p[1] + dy * t;
      let pv = 0, ps = 0, nv = 0, ns = 0;
      for (let s = -rad; s <= rad; s += 0.5) {
        const x = Math.round(cx + nx * s), y = Math.round(cy + ny * s);
        if (x < 1 || y < 1 || x >= w - 1 || y >= h - 1) continue;
        const gv = gx[y * w + x] * nx + gy[y * w + x] * ny;
        if (gv > pv) { pv = gv; ps = s; }
        if (gv < nv) { nv = gv; ns = s; }
      }
      samples.push({ cx, cy, pv, ps, nv, ns });
      polSum += Math.min(pv, 150) - Math.min(-nv, 150);
    }
    sides.push({ p, q, nx, ny, N, samples, L });
  }
  const pol = polSum >= 0 ? 1 : -1;
  const lines = [], supports = [];
  for (let i = 0; i < 4; i++) {
    const sd = sides[i];
    let pts = [];
    for (const sm of sd.samples) {
      const v = pol > 0 ? sm.pv : -sm.nv, s = pol > 0 ? sm.ps : sm.ns;
      if (v >= thrEdge) pts.push([sm.cx + sd.nx * s, sm.cy + sd.ny * s]);
    }
    let line = null, inl = 0;
    if (pts.length >= 5) {
      let ln = fitLineTLS(pts);
      for (let it = 0; it < 3; it++) {
        const nxl = -ln.dy, nyl = ln.dx;
        const res = pts.map(p => Math.abs((p[0] - ln.mx) * nxl + (p[1] - ln.my) * nyl));
        const sorted = res.slice().sort((a, b) => a - b);
        const lim = Math.max(0.9, 2.5 * sorted[(sorted.length / 2) | 0]);
        const keep = pts.filter((p, k) => res[k] <= lim);
        if (keep.length < 5 || keep.length === pts.length) { if (keep.length >= 5) pts = keep; break; }
        pts = keep; ln = fitLineTLS(pts);
      }
      line = ln; inl = pts.length;
      // direction must agree with the original side
      const dot = Math.abs(line.dx * (sd.q[0] - sd.p[0]) + line.dy * (sd.q[1] - sd.p[1])) / sd.L;
      if (dot < 0.985) { line = null; inl = 0; }
    }
    if (!line) line = { mx: sd.p[0], my: sd.p[1], dx: (sd.q[0] - sd.p[0]) / sd.L, dy: (sd.q[1] - sd.p[1]) / sd.L };
    lines.push(line);
    supports.push(Math.min(1, inl / sd.N));
  }
  const out = [];
  for (let i = 0; i < 4; i++) {
    const a = lines[(i + 3) % 4], b = lines[i];
    const X = lineIntersect([a.mx, a.my], [a.mx + a.dx, a.my + a.dy], [b.mx, b.my], [b.mx + b.dx, b.my + b.dy]);
    if (!X || Math.hypot(X.x - Q[i][0], X.y - Q[i][1]) > rad * 3 + 2) out.push([Q[i][0], Q[i][1]]);
    else out.push([clamp(X.x, 0, w - 1), clamp(X.y, 0, h - 1)]);
  }
  return { quad: out, supports };
}

/* ------------------------------------------------------------------ document detection */
function quadStats(Q, w, h) {
  const area = polyArea(Q), frac = area / (w * h);
  const dev = quadAngleDev(Q);
  const convex = isConvexQuad(Q);
  const inside = pointInQuad(Q, w / 2, h / 2);
  return { area, frac, dev, convex, inside };
}

function preScore(st, quadness, minFrac) {
  if (!st.convex || st.frac < minFrac || st.frac > 0.975 || st.dev > 48) return 0;
  const areaS = Math.sqrt(Math.min(st.frac, 0.5) / 0.5);
  const angS = st.dev <= 12 ? 1 : clamp(1 - (st.dev - 12) / 36, 0, 1);
  const quadS = clamp((quadness - 0.7) / 0.28, 0, 1);
  return areaS * angS * quadS * (st.inside ? 1 : 0.55);
}

/**
 * detectDocument(img) -> { quad:[{x,y}*4] (normalised, tl,tr,br,bl), score, support, frac, ok } | null
 * img: {width,height,data(RGBA)}  (works best when longest side ~ 280–640 px)
 */
function detectDocument(img, opt) {
  opt = opt || {};
  const w = img.width, h = img.height, n = w * h;
  const minFrac = opt.minArea || 0.10;
  const g = boxBlur3(boxBlur3(grayFromRGBA(img.data, w, h), w, h), w, h);
  const S = sobel(g, w, h);
  const diag = Math.hypot(w, h);
  const rad = Math.max(3, Math.round(0.016 * Math.max(w, h)));
  const cands = [];

  function addComponents(mask, tag, edgeBias) {
    const { lab, comps } = labelMask(mask, w, h);
    comps.sort((a, b) => b.area - a.area);
    let used = 0;
    for (const c of comps) {
      if (used >= 3 || c.area < n * minFrac * 0.6) break;
      const bpts = componentBoundary(lab, c, w, h);
      if (bpts.length < 8) continue;
      const hull = convexHull(bpts);
      if (hull.length < 4) continue;
      const hullA = polyArea(hull);
      let Q = hullToQuad(hull) || extremeQuad(hull);
      Q = orderQuad(Q.map(p => [clamp(p[0], 0, w - 1), clamp(p[1], 0, h - 1)]));
      const st = quadStats(Q, w, h);
      const quadness = Math.min(1, hullA / Math.max(1, st.area));
      const ps = preScore(st, quadness, minFrac);
      used++;
      if (ps > 0) cands.push({ Q, ps, tag, edgeBias });
    }
  }

  /* method 1: edge enclosed region */
  const mags = S.mag;
  const p95 = percentileU16(mags, 0.95, 2040);
  const thrE = clamp(p95 * 0.5, 40, 130);
  const dil = Math.max(1, Math.round(Math.max(w, h) / 170));
  const edge = new Uint8Array(n);
  for (let i = 0; i < n; i++) edge[i] = mags[i] >= thrE ? 1 : 0;
  const ed = dilate(edge, w, h, dil);
  const outside = floodOutside(ed, w, h);
  const enclosed = new Uint8Array(n);
  for (let i = 0; i < n; i++) enclosed[i] = outside[i] ? 0 : 1;
  addComponents(enclosed, 'edge', dil + 1);

  /* method 2/3: brightness segmentation (paper brighter / darker than surroundings) */
  const t = otsu(g);
  const bright = new Uint8Array(n), dark = new Uint8Array(n);
  for (let i = 0; i < n; i++) { if (g[i] > t) bright[i] = 1; else dark[i] = 1; }
  addComponents(bright, 'bright', 0);
  addComponents(dark, 'dark', 0);

  if (!cands.length) return null;
  cands.sort((a, b) => b.ps - a.ps);

  const thrEdge = Math.max(26, thrE * 0.35);
  let best = null;
  for (const c of cands.slice(0, 5)) {
    let Q = c.Q;
    let sup = [0, 0, 0, 0];
    for (let pass = 0; pass < 2; pass++) {
      const r = refineQuad(Q, S, pass === 0 ? rad : Math.max(2, Math.round(rad / 2)), thrEdge);
      if (!r) break;
      const Qn = orderQuad(r.quad);
      const st = quadStats(Qn, w, h);
      if (!st.convex || st.frac < minFrac * 0.8 || st.dev > 50) break;
      Q = Qn; sup = r.supports;
    }
    const st = quadStats(Q, w, h);
    const sMean = (sup[0] + sup[1] + sup[2] + sup[3]) / 4, sMin = Math.min(sup[0], sup[1], sup[2], sup[3]);
    const support = 0.6 * sMean + 0.4 * sMin;
    const areaS = Math.sqrt(Math.min(st.frac, 0.5) / 0.5);
    const angS = st.dev <= 12 ? 1 : clamp(1 - (st.dev - 12) / 36, 0, 1);
    if (!st.convex || st.frac < minFrac * 0.8 || st.frac > 0.985) continue;
    const score = areaS * angS * (st.inside ? 1 : 0.55) * (0.12 + 0.88 * support) * (0.6 + 0.4 * Math.min(1, c.ps / Math.max(areaS * angS, 1e-3)));
    if (!best || score > best.score) best = { Q, score, support, frac: st.frac, tag: c.tag, dev: st.dev };
  }
  if (!best) return null;
  const q = best.Q.map(p => ({ x: clamp((p[0] + 0.5) / w, 0, 1), y: clamp((p[1] + 0.5) / h, 0, 1) }));
  return {
    quad: q, score: best.score, support: best.support, frac: best.frac, tag: best.tag,
    ok: best.score >= (opt.okScore || 0.30) && best.support >= (opt.okSupport || 0.45)
  };
}

/* ------------------------------------------------------------------ signatures (motion / duplicate detection) */
function blockGray(img, gw, gh) {
  const w = img.width, h = img.height, d = img.data;
  const out = new Float32Array(gw * gh), cnt = new Uint32Array(gw * gh);
  const sx = Math.max(1, Math.floor(w / gw / 4)), sy = Math.max(1, Math.floor(h / gh / 4));
  for (let y = 0; y < h; y += sy) {
    const by = Math.min(gh - 1, (y * gh / h) | 0);
    for (let x = 0; x < w; x += sx) {
      const bx = Math.min(gw - 1, (x * gw / w) | 0), i = (y * w + x) * 4, k = by * gw + bx;
      out[k] += (d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) >> 8;
      cnt[k]++;
    }
  }
  for (let k = 0; k < out.length; k++) out[k] = cnt[k] ? out[k] / cnt[k] : 0;
  return out;
}
function meanAbsDiff(a, b) {
  if (!a || !b || a.length !== b.length) return 255;
  let s = 0;
  for (let i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]);
  return s / a.length;
}

/* ------------------------------------------------------------------ perspective warp */
function solveLinear(A, b) {
  const n = b.length;
  for (let i = 0; i < n; i++) {
    let piv = i;
    for (let r = i + 1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[piv][i])) piv = r;
    if (Math.abs(A[piv][i]) < 1e-12) return null;
    [A[i], A[piv]] = [A[piv], A[i]]; [b[i], b[piv]] = [b[piv], b[i]];
    for (let r = i + 1; r < n; r++) {
      const f = A[r][i] / A[i][i];
      if (!f) continue;
      for (let c = i; c < n; c++) A[r][c] -= f * A[i][c];
      b[r] -= f * b[i];
    }
  }
  const x = new Array(n).fill(0);
  for (let i = n - 1; i >= 0; i--) {
    let s = b[i];
    for (let c = i + 1; c < n; c++) s -= A[i][c] * x[c];
    x[i] = s / A[i][i];
  }
  return x;
}

function homography(src, dst) {
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = src[i], [u, v] = dst[i];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
    A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
  }
  return solveLinear(A, b);
}

function estimateOutputSize(Q, maxSide) {
  const d = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  let W = Math.max(d(Q[0], Q[1]), d(Q[3], Q[2])), H = Math.max(d(Q[0], Q[3]), d(Q[1], Q[2]));
  const m = Math.max(W, H);
  if (m > maxSide) { const s = maxSide / m; W *= s; H *= s; }
  return [Math.max(16, Math.round(W)), Math.max(16, Math.round(H))];
}

/* quad: [[x,y]*4] in source pixels (tl,tr,br,bl) */
function warpPerspective(src, quad, outW, outH) {
  const H = homography([[0, 0], [outW, 0], [outW, outH], [0, outH]], quad);
  const out = new Uint8ClampedArray(outW * outH * 4);
  if (!H) return { width: outW, height: outH, data: out };
  const sw = src.width, sh = src.height, sd = src.data;
  const [a, b, c, d, e, f, g, hh] = H;
  const maxX = sw - 1, maxY = sh - 1;
  let o = 0;
  for (let y = 0; y < outH; y++) {
    const yy = y + 0.5;
    let nx = a * 0.5 + b * yy + c, ny = d * 0.5 + e * yy + f, dn = g * 0.5 + hh * yy + 1;
    for (let x = 0; x < outW; x++, o += 4, nx += a, ny += d, dn += g) {
      const inv = 1 / dn;
      let sx = nx * inv - 0.5, sy = ny * inv - 0.5;
      if (sx < 0) sx = 0; else if (sx > maxX) sx = maxX;
      if (sy < 0) sy = 0; else if (sy > maxY) sy = maxY;
      const x0 = sx | 0, y0 = sy | 0, x1 = x0 < maxX ? x0 + 1 : x0, y1 = y0 < maxY ? y0 + 1 : y0;
      const fx = sx - x0, fy = sy - y0;
      const i00 = (y0 * sw + x0) * 4, i10 = (y0 * sw + x1) * 4, i01 = (y1 * sw + x0) * 4, i11 = (y1 * sw + x1) * 4;
      const w00 = (1 - fx) * (1 - fy), w10 = fx * (1 - fy), w01 = (1 - fx) * fy, w11 = fx * fy;
      out[o] = sd[i00] * w00 + sd[i10] * w10 + sd[i01] * w01 + sd[i11] * w11;
      out[o + 1] = sd[i00 + 1] * w00 + sd[i10 + 1] * w10 + sd[i01 + 1] * w01 + sd[i11 + 1] * w11;
      out[o + 2] = sd[i00 + 2] * w00 + sd[i10 + 2] * w10 + sd[i01 + 2] * w01 + sd[i11 + 2] * w11;
      out[o + 3] = 255;
    }
  }
  return { width: outW, height: outH, data: out };
}

/* ------------------------------------------------------------------ filters */
function estimateBackground(img) {
  const w = img.width, h = img.height, d = img.data;
  const cell = Math.max(4, Math.round(Math.max(w, h) / 56));
  const sw = Math.max(2, Math.ceil(w / cell)), sh = Math.max(2, Math.ceil(h / cell));
  const acc = new Float32Array(sw * sh * 3), cnt = new Float32Array(sw * sh);
  const step = Math.max(1, Math.floor(cell / 6));
  for (let y = 0; y < h; y += step) {
    const cy = Math.min(sh - 1, (y / cell) | 0);
    for (let x = 0; x < w; x += step) {
      const cx = Math.min(sw - 1, (x / cell) | 0), i = (y * w + x) * 4, k = cy * sw + cx;
      acc[k * 3] += d[i]; acc[k * 3 + 1] += d[i + 1]; acc[k * 3 + 2] += d[i + 2]; cnt[k]++;
    }
  }
  const mean = new Float32Array(sw * sh * 3), luma = new Float32Array(sw * sh);
  for (let k = 0; k < sw * sh; k++) {
    const c = cnt[k] || 1;
    mean[k * 3] = acc[k * 3] / c; mean[k * 3 + 1] = acc[k * 3 + 1] / c; mean[k * 3 + 2] = acc[k * 3 + 2] / c;
    luma[k] = 0.299 * mean[k * 3] + 0.587 * mean[k * 3 + 1] + 0.114 * mean[k * 3 + 2];
  }
  // dilate by "brightest neighbour" (removes ink), keeps colour coherent
  const R = 2, mx = new Float32Array(sw * sh * 3), mxl = new Float32Array(sw * sh);
  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
    let bk = y * sw + x, bl = -1;
    for (let yy = Math.max(0, y - R); yy <= Math.min(sh - 1, y + R); yy++)
      for (let xx = Math.max(0, x - R); xx <= Math.min(sw - 1, x + R); xx++) {
        const kk = yy * sw + xx;
        if (luma[kk] > bl) { bl = luma[kk]; bk = kk; }
      }
    const k = y * sw + x;
    mx[k * 3] = mean[bk * 3]; mx[k * 3 + 1] = mean[bk * 3 + 1]; mx[k * 3 + 2] = mean[bk * 3 + 2]; mxl[k] = bl;
  }
  // smooth twice
  let cur = mx;
  for (let it = 0; it < 2; it++) {
    const nx = new Float32Array(cur.length);
    for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
      let s0 = 0, s1 = 0, s2 = 0, c = 0;
      for (let yy = Math.max(0, y - 1); yy <= Math.min(sh - 1, y + 1); yy++)
        for (let xx = Math.max(0, x - 1); xx <= Math.min(sw - 1, x + 1); xx++) {
          const kk = (yy * sw + xx) * 3; s0 += cur[kk]; s1 += cur[kk + 1]; s2 += cur[kk + 2]; c++;
        }
      const k = (y * sw + x) * 3; nx[k] = s0 / c; nx[k + 1] = s1 / c; nx[k + 2] = s2 / c;
    }
    cur = nx;
  }
  // floor to avoid washing out large dark regions
  const lumas = [];
  for (let k = 0; k < sw * sh; k++) lumas.push(0.299 * cur[k * 3] + 0.587 * cur[k * 3 + 1] + 0.114 * cur[k * 3 + 2]);
  const sorted = lumas.slice().sort((a, b) => a - b);
  const paper = sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * 0.85))];
  const floorL = paper * 0.55;
  for (let k = 0; k < sw * sh; k++) {
    if (lumas[k] < floorL && lumas[k] > 1) {
      const s = floorL / lumas[k];
      cur[k * 3] *= s; cur[k * 3 + 1] *= s; cur[k * 3 + 2] *= s;
    }
  }
  for (let i = 0; i < cur.length; i++) if (cur[i] < 1) cur[i] = 1;
  return { sw, sh, cell, bg: cur, paper };
}

function interpTables(w, cell, sw) {
  const x0 = new Int32Array(w), x1 = new Int32Array(w), fx = new Float32Array(w);
  for (let x = 0; x < w; x++) {
    let gxp = (x + 0.5) / cell - 0.5;
    if (gxp < 0) gxp = 0; if (gxp > sw - 1) gxp = sw - 1;
    const i0 = gxp | 0;
    x0[x] = i0; x1[x] = Math.min(sw - 1, i0 + 1); fx[x] = gxp - i0;
  }
  return { x0, x1, fx };
}

const FILTERS = ['original', 'magic', 'bw', 'gray', 'lighten'];

function buildCurveLUT(bright, contrast) {
  const lut = new Uint8ClampedArray(256);
  const bf = (bright || 0) * 0.7;
  const cf = contrast >= 0 ? 1 + (contrast || 0) / 60 : 1 + contrast / 130;
  for (let i = 0; i < 256; i++) lut[i] = (i - 128) * cf + 128 + bf;
  return lut;
}

function autoLevelsRange(d) {
  const hist = new Uint32Array(256);
  const n = d.length / 4, step = Math.max(1, Math.floor(n / 60000));
  let cnt = 0;
  for (let i = 0; i < n; i += step) {
    hist[(d[i * 4] * 77 + d[i * 4 + 1] * 150 + d[i * 4 + 2] * 29) >> 8]++; cnt++;
  }
  let acc = 0, lo = 0, hi = 255;
  for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= cnt * 0.005) { lo = v; break; } }
  acc = 0;
  for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= cnt * 0.01) { hi = v; break; } }
  if (hi - lo < 40) { lo = Math.max(0, lo - 10); hi = Math.min(255, lo + 60); }
  return [lo, hi];
}

/**

 * opts: { filter, bright, contrast, sharp, bwLevel }

    const bg = B.bg, sw = B.sw, sh = B.sh;

        const bB = bg[a + 2] * w00 + bg[b + 2] * w10 + bg[c + 2] * w01 + bg[e + 2] * w11;

    const [lo, hi] = autoLevelsRange(d);
    const lut = new Uint8ClampedArray(256), span = Math.max(1, hi - lo);
    for (let i = 0; i < 256; i++) { const t = clamp((i - lo) / span, 0, 1); lut[i] = Math.pow(t, 0.82) * 255; }
    for (let i = 0; i < n * 4; i += 4) {
      let r = lut[d[i]], g = lut[d[i + 1]], b = lut[d[i + 2]];
      const L = 0.299 * r + 0.587 * g + 0.114 * b;
      d[i] = L + (r - L) * 1.08; d[i + 1] = L + (g - L) * 1.08; d[i + 2] = L + (b - L) * 1.08;
    }
  }

  if (o.bright || o.contrast) {
    const lut = buildCurveLUT(o.bright, o.contrast);
    for (let i = 0; i < n * 4; i += 4) { d[i] = lut[d[i]]; d[i + 1] = lut[d[i + 1]]; d[i + 2] = lut[d[i + 2]]; }
  }

  if (o.sharp > 0) {
    const a = (o.sharp / 100) * 0.6;
    const src = new Uint8ClampedArray(d);
    const k0 = 1 + 4 * a;
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const i = (y * w + x) * 4;
        for (let c = 0; c < 3; c++) {
          const j = i + c;
          d[j] = k0 * src[j] - a * (src[j - 4] + src[j + 4] + src[j - w * 4] + src[j + w * 4]);
        }
      }
    }
  }
  return img;
}

/* ------------------------------------------------------------------ PDF writer */
const PAGE_SIZES = { a4: [595.28, 841.89], letter: [612, 792], a5: [419.53, 595.28] };

function buildPDF(pages, opt) {
  opt = opt || {};
  const enc = new TextEncoder();
  const chunks = [], xref = [];
  let offset = 0;
  const push = (data) => { const u = typeof data === 'string' ? enc.encode(data) : data; chunks.push(u); offset += u.length; };
  const f2 = (v) => (Math.round(v * 100) / 100).toString();
  const hexUtf16 = (s) => {
    let out = 'FEFF';
    for (let i = 0; i < s.length; i++) out += s.charCodeAt(i).toString(16).padStart(4, '0').toUpperCase();
    return out;
  };

  push(new Uint8Array([0x25, 0x50, 0x44, 0x46, 0x2d, 0x31, 0x2e, 0x34, 0x0a, 0x25, 0xe2, 0xe3, 0xcf, 0xd3, 0x0a]));
  const nPages = pages.length;
  const pageObj = (i) => 4 + i * 3, contObj = (i) => 5 + i * 3, imgObj = (i) => 6 + i * 3;
  const total = 3 + nPages * 3;

  const begin = (n) => { xref[n] = offset; push(`${n} 0 obj\n`); };
  begin(1); push('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  begin(2);
  push(`<< /Type /Pages /Count ${nPages} /Kids [${pages.map((_, i) => `${pageObj(i)} 0 R`).join(' ')}] >>\nendobj\n`);
  const now = new Date();
  const p2 = (v) => String(v).padStart(2, '0');
  const dstr = `D:${now.getUTCFullYear()}${p2(now.getUTCMonth() + 1)}${p2(now.getUTCDate())}${p2(now.getUTCHours())}${p2(now.getUTCMinutes())}${p2(now.getUTCSeconds())}Z`;
  begin(3);
  push(`<< /Title <${hexUtf16(opt.title || 'Scan')}> /Creator (FlowScan) /Producer (FlowScan) /CreationDate (${dstr}) >>\nendobj\n`);

  const margin = opt.margin || 0;
  pages.forEach((pg, i) => {
    let pw, ph, dw, dh, dx, dy;
    if (!opt.size || opt.size === 'fit') {
      pw = pg.w * 0.48; ph = pg.h * 0.48; dw = pw; dh = ph; dx = 0; dy = 0;
    } else {
      let [bw, bh] = PAGE_SIZES[opt.size] || PAGE_SIZES.a4;
      if (pg.w > pg.h * 1.08) [bw, bh] = [bh, bw];
      pw = bw; ph = bh;
      const aw = pw - 2 * margin, ah = ph - 2 * margin;
      const s = Math.min(aw / pg.w, ah / pg.h);
      dw = pg.w * s; dh = pg.h * s; dx = (pw - dw) / 2; dy = (ph - dh) / 2;
    }
    begin(pageObj(i));
    push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f2(pw)} ${f2(ph)}] /Resources << /XObject << /Im0 ${imgObj(i)} 0 R >> /ProcSet [/PDF /ImageC] >> /Contents ${contObj(i)} 0 R >>\nendobj\n`);
    const content = `q ${f2(dw)} 0 0 ${f2(dh)} ${f2(dx)} ${f2(dy)} cm /Im0 Do Q`;
    begin(contObj(i));
    push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
    begin(imgObj(i));
    push(`<< /Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.jpeg.length} >>\nstream\n`);
    push(pg.jpeg);
    push('\nendstream\nendobj\n');
  });

  const xrefPos = offset;
  let x = `xref\n0 ${total + 1}\n0000000000 65535 f \n`;
  for (let n = 1; n <= total; n++) x += `${String(xref[n]).padStart(10, '0')} 00000 n \n`;
  x += `trailer\n<< /Size ${total + 1} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xrefPos}\n%%EOF\n`;
  push(x);

  const out = new Uint8Array(offset);
  let p = 0;
  for (const c of chunks) { out.set(c, p); p += c.length; }
  return out;
}

/* ------------------------------------------------------------------ ZIP writer (store) */
let _crcTable = null;
function crc32(u8) {
  if (!_crcTable) {
    _crcTable = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      _crcTable[n] = c >>> 0;
    }
  }
  let c = 0xffffffff;
  for (let i = 0; i < u8.length; i++) c = _crcTable[(c ^ u8[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

function buildZip(files, date) {
  date = date || new Date();
  const enc = new TextEncoder();
  const dosTime = (date.getHours() << 11) | (date.getMinutes() << 5) | (date.getSeconds() >> 1);
  const dosDate = ((date.getFullYear() - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
  const parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), data = f.data, crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
    ch.setUint16(28, name.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
    ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  }
  let cdSize = 0;
  for (const c of central) cdSize += c.length;
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(4, 0, true); end.setUint16(6, 0, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true); end.setUint16(20, 0, true);
  const all = parts.concat(central, [new Uint8Array(end.buffer)]);
  let total = 0;
  for (const p of all) total += p.length;
  const out = new Uint8Array(total);
  let pos = 0;
  for (const p of all) { out.set(p, pos); pos += p.length; }
  return out;
}

return {
  detectDocument, warpPerspective, homography, estimateOutputSize,
  estimateBackground, applyFilter, FILTERS,
  buildPDF, buildZip, crc32, PAGE_SIZES,
  blockGray, meanAbsDiff,
  isConvexQuad, orderQuad, polyArea, convexHull, hullToQuad, quadAngleDev,
  clamp
};
})();

/* ------------------------------------------------------------- feedback (sound / vibration) */
let actx = null;
function audio() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
  return actx;
}
function sfx(kind) {
  if (!S.settings.sound) return;
  const a = audio();
  if (!a) return;
  try {
    const now = a.currentTime;
    if (kind === 'shutter') {
      const len = Math.floor(a.sampleRate * 0.07), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      const src = a.createBufferSource(), g = a.createGain();
      src.buffer = buf; g.gain.value = 0.45; src.connect(g); g.connect(a.destination); src.start(now);
    } else {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(kind === 'warn' ? 330 : 880, now);
      if (kind !== 'warn') o.frequency.exponentialRampToValueAtTime(1320, now + 0.09);
      g.gain.setValueAtTime(0.18, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      o.connect(g); g.connect(a.destination); o.start(now); o.stop(now + 0.2);
    }
  } catch (e) { /* ignore */ }
}
function vibrate(ms) { if (S.settings.vibrate && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) { /* ignore */ } } }

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.async = true; s.onload = resolve; s.onerror = () => reject(new Error('load failed: ' + src));
    document.head.appendChild(s);
  });
}

/* ====================================================================
   STORE — IndexedDB (documents + original images) and image helpers
   ==================================================================== */
const DB = {
  db: null, mem: null,
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        if (!window.indexedDB) return rej(new Error('no indexedDB'));
        const rq = indexedDB.open('flowscan', 1);
        rq.onupgradeneeded = () => {
          const d = rq.result;
          if (!d.objectStoreNames.contains('docs')) d.createObjectStore('docs', { keyPath: 'id' });
          if (!d.objectStoreNames.contains('orig')) d.createObjectStore('orig');
        };
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error);
        rq.onblocked = () => rej(new Error('blocked'));
      });
    } catch (e) {
      console.warn('IndexedDB unavailable — using memory only', e);
      this.mem = { docs: new Map(), orig: new Map() };
    }
  },
  _run(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode), st = tx.objectStore(store);
      const rq = fn(st);
      tx.oncomplete = () => res(rq ? rq.result : undefined);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error('aborted'));
    });
  },
  allDocs() { return this.mem ? Promise.resolve([...this.mem.docs.values()]) : this._run('docs', 'readonly', (s) => s.getAll()); },
  getDoc(id) { return this.mem ? Promise.resolve(this.mem.docs.get(id)) : this._run('docs', 'readonly', (s) => s.get(id)); },
  putDoc(d) { if (this.mem) { this.mem.docs.set(d.id, d); return Promise.resolve(); } return this._run('docs', 'readwrite', (s) => s.put(d)); },
  putOrig(id, blob) { if (this.mem) { this.mem.orig.set(id, blob); return Promise.resolve(); } return this._run('orig', 'readwrite', (s) => s.put(blob, id)); },
  getOrig(id) { return this.mem ? Promise.resolve(this.mem.orig.get(id)) : this._run('orig', 'readonly', (s) => s.get(id)); },
  delOrig(id) { if (this.mem) { this.mem.orig.delete(id); return Promise.resolve(); } return this._run('orig', 'readwrite', (s) => s.delete(id)); },
  async delDoc(doc) {
    for (const p of doc.pages) { try { await this.delOrig(p.id); } catch (e) { /* ignore */ } }
    if (this.mem) { this.mem.docs.delete(doc.id); return; }
    await this._run('docs', 'readwrite', (s) => s.delete(doc.id));
  },
  async wipe() {
    if (this.mem) { this.mem.docs.clear(); this.mem.orig.clear(); return; }
    await this._run('docs', 'readwrite', (s) => s.clear());
    await this._run('orig', 'readwrite', (s) => s.clear());
  }
};

/* ------------------------------------------------------------- document model */
function newDoc(name) {
  return { id: uid(), name: name || defaultDocName(), created: Date.now(), updated: Date.now(), pages: [] };
}
function newPage(w, h, quad, filter) {
  return { id: uid(), w, h, quad, rot: 0, filter: filter || 'magic', bright: 0, contrast: 0, sharp: 0, bw: 0.8, thumb: null, thumbUrl: null };
}
function serializeDoc(d) {
  return {
    id: d.id, name: d.name, created: d.created, updated: d.updated,
    pages: d.pages.map((p) => ({ id: p.id, w: p.w, h: p.h, quad: p.quad, rot: p.rot, filter: p.filter, bright: p.bright, contrast: p.contrast, sharp: p.sharp, bw: p.bw, thumb: p.thumb }))
  };
}
function hydrateDoc(r) {
  r.pages.forEach((p) => { p.thumbUrl = p.thumb ? URL.createObjectURL(p.thumb) : null; });
  return r;
}
const saver = { t: 0, pending: new Set() };
function scheduleSave(doc, delay) {
  saver.pending.add(doc);
  clearTimeout(saver.t);
  saver.t = setTimeout(flushSave, delay == null ? 400 : delay);
}
async function flushSave() {
  clearTimeout(saver.t);
  const docs = [...saver.pending];
  saver.pending.clear();
  for (const d of docs) {
    try {
      d.updated = Date.now();
      await DB.putDoc(serializeDoc(d));
      if (!S.persisted && navigator.storage && navigator.storage.persist) { S.persisted = true; navigator.storage.persist().catch(() => {}); }
    } catch (e) {
      console.error(e);
      toast(t('err.save'), 3500, 'err');
    }
  }
}

const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };

async function decodeBlob(blob) {
  const url = URL.createObjectURL(blob);

    const img = new Image();
    img.decoding = 'async';
    img.src = url;
    await img.decode();
    return { src: img, w: img.naturalWidth, h: img.naturalHeight, close() { URL.revokeObjectURL(url); } };
  } catch (e) {
    URL.revokeObjectURL(url);
    const bmp = await createImageBitmap(blob);
    return { src: bmp, w: bmp.width, h: bmp.height, close() { if (bmp.close) bmp.close(); } };
  }
}

/* high-quality downscale by repeated halving; never upscales */
function scaleToCanvas(src, sw, sh, maxSide) {
  const k = Math.min(1, maxSide / Math.max(sw, sh));
  const tw = Math.max(1, Math.round(sw * k)), th = Math.max(1, Math.round(sh * k));
  let cur = src, cw = sw, ch = sh;
  while (cw / 2 >= tw && ch / 2 >= th) {
    const nw = Math.max(tw, Math.floor(cw / 2)), nh = Math.max(th, Math.floor(ch / 2));
    const c = mkCanvas(nw, nh);
    const x = ctx2d(c);
    x.imageSmoothingQuality = 'high';
    x.drawImage(cur, 0, 0, cw, ch, 0, 0, nw, nh);
    cur = c; cw = nw; ch = nh;

  const out = mkCanvas(tw, th), x = ctx2d(out);

/* rotate by quarter turns clockwise */

  if (!rot) return c;
  const o = mkCanvas(rot % 2 ? c.height : c.width, rot % 2 ? c.width : c.height), x = ctx2d(o);
  x.translate(o.width / 2, o.height / 2);
  x.rotate(rot * Math.PI / 2);
  x.drawImage(c, -c.width / 2, -c.height / 2);

}

/* ------------------------------------------------------------- per-page source cache + rendering */
const SrcCache = {
  map: new Map(),
  get(id) { const v = this.map.get(id); if (v) { this.map.delete(id); this.map.set(id, v); } return v; },
  set(id, v) { this.map.delete(id); this.map.set(id, v); while (this.map.size > 10) this.map.delete(this.map.keys().next().value); },
  del(id) { this.map.delete(id); }
};

function seedSrc(page, cv) {
  const prev = scaleToCanvas(cv, cv.width, cv.height, 1600);
  const thumb = scaleToCanvas(prev, prev.width, prev.height, 640);
  SrcCache.set(page.id, { prev, thumb });
}

async function getOrigBlob(page) {
  let b = S.origCache.get(page.id);
  if (!b) { b = await DB.getOrig(page.id); if (b) S.origCache.set(page.id, b); }
  return b;
}

async function ensureSrc(page) {
  let e = SrcCache.get(page.id);
  if (e) return e;
  const blob = await getOrigBlob(page);
  if (!blob) throw new Error('original image missing');
  const d = await decodeBlob(blob);
  const prev = scaleToCanvas(d.src, d.w, d.h, 1600);
  d.close();
  const thumb = scaleToCanvas(prev, prev.width, prev.height, 640);
  e = { prev, thumb };
  SrcCache.set(page.id, e);
  return e;
}

async function loadFull(page) {
  const blob = await getOrigBlob(page);
  if (!blob) throw new Error('original image missing');
  const d = await decodeBlob(blob);
  const c = mkCanvas(d.w, d.h);
  ctx2d(c).drawImage(d.src, 0, 0);
  d.close();
  return c;
}

const quadToPx = (quad, W, H) => quad.map((p) => [p.x * W, p.y * H]);

/* returns {width,height,data} — perspective-corrected, not yet filtered */
async function warpPage(page, level, maxDim) {
  const cv = level === 'full' ? await loadFull(page) : (await ensureSrc(page))[level];
  const W = cv.width, H = cv.height;
  const data = ctx2d(cv, true).getImageData(0, 0, W, H);
  const Q = quadToPx(page.quad, W, H);
  const [ow, oh] = Core.estimateOutputSize(Q, maxDim);

}
const filterOpts = (p) => ({ filter: p.filter, bright: p.bright, contrast: p.contrast, sharp: p.sharp, bwLevel: p.bw });
function pixelsToCanvas(img) {

  ctx2d(c).putImageData(new ImageData(img.data, img.width, img.height), 0, 0);
  return c;
}
async function renderPage(page, level, maxDim) {

}
async function updateThumb(page) {
  const c = await renderPage(page, 'thumb', 360);
  const blob = await canvasToBlob(c, 'image/jpeg', 0.82);
  if (page.thumbUrl) URL.revokeObjectURL(page.thumbUrl);
  page.thumb = blob;
  page.thumbUrl = URL.createObjectURL(blob);
}

/* ------------------------------------------------------------- doc operations */
async function addPageToDoc(doc, page, blob, cv) {
  doc.pages.push(page);
  S.origCache.set(page.id, blob);
  if (cv) seedSrc(page, cv);
  await DB.putOrig(page.id, blob);
  scheduleSave(doc, 150);
}
async function removePage(doc, idx) {
  const [p] = doc.pages.splice(idx, 1);
  if (!p) return;
  if (p.thumbUrl) URL.revokeObjectURL(p.thumbUrl);
  S.origCache.delete(p.id); SrcCache.del(p.id);

function defaultQuad(inset) {
  const a = inset == null ? 0.012 : inset, b = 1 - a;
  return [{ x: a, y: a }, { x: b, y: a }, { x: b, y: b }, { x: a, y: b }];

  const small = scaleToCanvas(cv, cv.width, cv.height, (opt && opt.size) || 480);
  const data = ctx2d(small, true).getImageData(0, 0, small.width, small.height);

/* ------------------------------------------------------------- stream control */

  Cam.stream = null; Cam.track = null; Cam.ic = null;

  updateRing();
  setHint(t('cam.starting'));
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { showCamError(null); return; }
  const res = +S.settings.camRes;
  const vbase = { width: { ideal: res }, height: { ideal: Math.round(res * 0.75) } };
  const tries = [];
  if (Cam.devId) tries.push(Object.assign({ deviceId: { exact: Cam.devId } }, vbase));
  tries.push(Object.assign({ facingMode: { ideal: S.settings.facing } }, vbase));

    catch (e) { err = e; if (e.name === 'NotAllowedError' || e.name === 'SecurityError') break; }
  }
  if (token !== Cam.token) { if (stream) stream.getTracks().forEach((tr) => tr.stop()); return; }
  if (!stream) { showCamError(err); return; }
  Cam.stream = stream;
  Cam.track = stream.getVideoTracks()[0];
  Cam.track.addEventListener('ended', () => { if (Cam.running && token === Cam.token) showCamError({ name: 'AbortError' }); });
  Cam.video.srcObject = stream;
  try { await Cam.video.play(); } catch (e) { /* autoplay policies — muted so normally fine */ }

  try { Cam.ic = (window.ImageCapture && S.settings.hiRes) ? new ImageCapture(Cam.track) : null; } catch (e) { Cam.ic = null; }
  try {

  } catch (e) { /* ignore */ }

    const cur = (Cam.track.getSettings && Cam.track.getSettings().zoom) || z.min;

/* ------------------------------------------------------------- overlay */

  else if (ok) setHint(t('cam.hintSteady'), 'ok');

/* ------------------------------------------------------------- capture */

const withTimeout = (p, ms) => new Promise((res, rej) => { const id = setTimeout(() => rej(new Error('timeout')), ms); p.then((v) => { clearTimeout(id); res(v); }, (e) => { clearTimeout(id); rej(e); }); });

  const v = Cam.video;

      const bmp = await createImageBitmap(blob);

      if (stillLand === vidLand) return { src: bmp, w: bmp.width, h: bmp.height, still: true };

async function camCapture(trigger) {

function ensureDoc() {

function pageSignature(cv, quad) {
  const small = scaleToCanvas(cv, cv.width, cv.height, 320);
  const d = ctx2d(small, true).getImageData(0, 0, small.width, small.height);
  const w = Core.warpPerspective(d, quadToPx(quad, small.width, small.height), 64, 64);
  return Core.blockGray(w, 32, 32);
}

function warpCard(cv, quad) {
  const d = ctx2d(cv, true).getImageData(0, 0, cv.width, cv.height);
  const Q = quadToPx(quad, cv.width, cv.height);
  const W = Math.hypot(Q[1][0] - Q[0][0], Q[1][1] - Q[0][1]), H = Math.hypot(Q[3][0] - Q[0][0], Q[3][1] - Q[0][1]);
  const portrait = H > W * 1.05;
  const out = Core.warpPerspective(d, Q, portrait ? 631 : 1000, portrait ? 1000 : 631);
  return rotateCanvas(pixelsToCanvas(out), portrait ? 1 : 0);
}

  const W = 1654, H = 2339, c = mkCanvas(W, H), x = ctx2d(c);
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  const cw = 1000, ch = 631, cx = (W - cw) / 2;
  const ys = back ? [H * 0.27 - ch / 2, H * 0.63 - ch / 2] : [H * 0.5 - ch / 2];
  [front, back].forEach((img, i) => {
    if (!img) return;
    x.save(); x.shadowColor = 'rgba(0,0,0,.28)'; x.shadowBlur = 22; x.shadowOffsetY = 6;
    x.fillStyle = '#fff'; x.fillRect(cx, ys[i], cw, ch); x.restore();
    x.drawImage(img, cx, ys[i], cw, ch);
    x.strokeStyle = 'rgba(0,0,0,.18)'; x.lineWidth = 2; x.strokeRect(cx, ys[i], cw, ch);
  });
  return c;
}

async function addCapturedPage(cv, quad, filter) {
  const doc = ensureDoc();
  S.doc = doc;
  const blob = await canvasToBlob(cv, 'image/jpeg', 0.9);
  const page = newPage(cv.width, cv.height, quad, filter || S.settings.defFilter);
  await addPageToDoc(doc, page, blob, cv);
  Cam.count++;
  updateCamCounter();
  updateThumb(page).then(() => { updateCamThumb(page); scheduleSave(doc); }).catch(console.error);
  return page;
}

/* shared by live capture and "system camera" fallback. returns 'ok' | 'dup' | 'front' | 'fail' */
async function ingestFrame(src, sw, sh, opt) {
  const cv = scaleToCanvas(src, sw, sh, +S.settings.capMax);
  const isId = Cam.mode === 'id' && opt.trigger !== 'import';
  const det = detectInCanvas(cv, { minArea: isId ? 0.035 : 0.08 });
  let quad = det.quad, detOk = det.ok;
  if (!detOk && opt.live && opt.liveOk) { quad = opt.live; detOk = true; }

  if (isId) {
    const v = Cam.video && Cam.video.videoWidth ? videoRect() : null;
    let q = quad;
    const asp = quadAspectPx(q, cv.width, cv.height);
    if (!detOk || asp < 1.2 || asp > 2.1) q = v ? idGuideQuad(v) : defaultQuad(0.1);
    const card = warpCard(cv, q);
    if (!Cam.idFront) {
      Cam.idFront = card;
      toast(t('cam.idFrontDone'), 2200, 'ok');
      updateCamCounter();
      return 'front';
    }
    const page = composeIdPage(Cam.idFront, card);
    Cam.idFront = null;
    await addCapturedPage(page, defaultQuad(0), 'lighten');
    toast(t('cam.pageSaved', Cam.count), 1500, 'ok');
    return 'ok';
  }

  const sig = pageSignature(cv, quad);
  if (opt.trigger === 'auto' && S.settings.dupSkip && Cam.lastPageSig && Core.meanAbsDiff(sig, Cam.lastPageSig) < 1.4) {
    toast(t('cam.dup'), 1700);
    sfx('warn');
    return 'dup';
  }
  Cam.lastPageSig = sig;
  await addCapturedPage(cv, quad);
  toast(t('cam.pageSaved', Cam.count), 1400, 'ok');
  return 'ok';
}

/* import images (gallery / system camera / drag&drop) into a document — used by camera, home and doc views */
async function importFiles(files, doc, opts) {
  files = Array.from(files).filter((f) => /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic|heif|bmp|gif)$/i.test(f.name));
  if (!files.length) { toast(t('err.noImage'), 2500, 'err'); return null; }
  const target = doc || newDoc();
  const isNew = !doc;
  if (isNew) S.docs.unshift(target);
  let added = 0;
  for (let i = 0; i < files.length; i++) {
    busy(t('busy.import', i + 1, files.length), i / files.length);
    await nextFrame();
    try {
      const d = await decodeBlob(files[i]);
      const cv = scaleToCanvas(d.src, d.w, d.h, +S.settings.capMax);
      d.close();
      const det = detectInCanvas(cv, { minArea: 0.08 });
      const blob = await canvasToBlob(cv, 'image/jpeg', 0.9);
      const page = newPage(cv.width, cv.height, det.quad, S.settings.defFilter);
      await addPageToDoc(target, page, blob, cv);
      await updateThumb(page);
      added++;
      if (opts && opts.onPage) opts.onPage(page);
    } catch (e) {
      console.error(e);
      toast(t('err.import', files[i].name), 3000, 'err');
    }
  }
  unbusy();
  if (!added && isNew) S.docs.shift();
  if (added) { scheduleSave(target, 50); toast(t('toast.imported', added), 2000, 'ok'); }
  return added ? target : null;
}

const E = {

}

/* ------------------------------------------------------------- open / navigate */
async function edOpen(doc, idx, tab) {

  }

function syncEdControls() {

  $('#slContrast').value = p.contrast; $('#outContrast').textContent = p.contrast;

/* ------------------------------------------------------------- tabs */
async function edSetTab(tab, force) {
  if (!force && tab === E.tab) return;
  E.tab = tab;
  $$('#edTabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  $('#paneCrop').classList.toggle('on', tab === 'crop');
  $('#paneFilter').classList.toggle('on', tab === 'filter');
  $('#paneAdjust').classList.toggle('on', tab === 'adjust');
  if (tab === 'crop') { edDrawCrop(); return; }
  $('#edSpin').hidden = false;
  await nextFrame();
  try {
    await ensureWarp();
    if (E.tab === 'crop') return;
    if (tab === 'filter') await buildChips();
    const c = renderFiltered(false);
    if (c) drawResultCanvas(c);
  } catch (e) { console.error(e); toast(t('err.render'), 3000, 'err'); }
  $('#edSpin').hidden = true;
}

async function ensureWarp() {
  if (!E.dirtyWarp && E.warp) return;
  const token = E.loadToken;
  const w = await warpPage(E.page, 'prev', 1400);
  if (token !== E.loadToken) return;
  E.warp = w; E.bgc = null; E.bgcS = null;
  if (Math.max(w.width, w.height) > 640) {
    const sm = scaleToCanvas(pixelsToCanvas({ width: w.width, height: w.height, data: new Uint8ClampedArray(w.data) }), w.width, w.height, 640);
    E.warpS = ctx2d(sm, true).getImageData(0, 0, sm.width, sm.height);
  } else E.warpS = w;
  E.dirtyWarp = false; E.chipsDirty = true;
}

function renderFiltered(small) {
  const base = small ? E.warpS : E.warp;
  if (!base) return null;
  const copy = { width: base.width, height: base.height, data: new Uint8ClampedArray(base.data) };
  const p = E.page;
  let bgc = null;
  if (p.filter === 'magic' || p.filter === 'gray' || p.filter === 'bw') {
    if (small) { E.bgcS = E.bgcS || Core.estimateBackground(base); bgc = E.bgcS; }
    else { E.bgc = E.bgc || Core.estimateBackground(base); bgc = E.bgc; }
  }
  Core.applyFilter(copy, filterOpts(p), bgc);
  return rotateCanvas(pixelsToCanvas(copy), p.rot);
}

function drawResultCanvas(c) {
  edSize();
  const x = E.ctx;
  x.setTransform(E.dpr, 0, 0, E.dpr, 0, 0);
  x.clearRect(0, 0, E.cw, E.ch);
  const pad = 18, sc = Math.min((E.cw - 2 * pad) / c.width, (E.ch - 2 * pad) / c.height);
  const w = c.width * sc, h = c.height * sc, px = (E.cw - w) / 2, py = (E.ch - h) / 2;
  x.save(); x.shadowColor = 'rgba(0,0,0,.35)'; x.shadowBlur = 18; x.shadowOffsetY = 4; x.fillStyle = '#fff'; x.fillRect(px, py, w, h); x.restore();
  x.imageSmoothingQuality = 'high';
  x.drawImage(c, px, py, w, h);
  E.result = c;
}

function scheduleRender(small) {
  E.wantSmall = small;
  if (E.raf) return;
  E.raf = requestAnimationFrame(() => {
    E.raf = 0;
    const c = renderFiltered(E.wantSmall);
    if (c) drawResultCanvas(c);
  });
}

/* ------------------------------------------------------------- filter chips */
async function buildChips() {
  const list = $('#filterList');
  if (!E.chipsDirty && list.children.length) { syncEdControls(); return; }
  const base = E.warpS;
  const tiny = scaleToCanvas(pixelsToCanvas({ width: base.width, height: base.height, data: new Uint8ClampedArray(base.data) }), base.width, base.height, 170);
  const td = ctx2d(tiny, true).getImageData(0, 0, tiny.width, tiny.height);
  const bgc = Core.estimateBackground(td);
  list.innerHTML = '';
  for (const f of Core.FILTERS) {
    const copy = { width: td.width, height: td.height, data: new Uint8ClampedArray(td.data) };
    Core.applyFilter(copy, { filter: f, bwLevel: E.page.bw }, bgc);
    const c = rotateCanvas(pixelsToCanvas(copy), E.page.rot);
    const b = document.createElement('button');
    b.className = 'fchip'; b.dataset.f = f;
    c.style.objectFit = 'contain';
    b.appendChild(c);
    const s = document.createElement('span'); s.textContent = t('filter.' + f); b.appendChild(s);
    b.addEventListener('click', () => edSetFilter(f));
    list.appendChild(b);
  }
  E.chipsDirty = false;
  syncEdControls();
}
function relabelChips() {
  $$('#filterList .fchip').forEach((b) => { b.lastChild.textContent = t('filter.' + b.dataset.f); });
}

function edSetFilter(f) {
  E.page.filter = f;

}

/* ------------------------------------------------------------- crop view */
function cropPoints() {
  const v = E.view, r = E.page.rot;
  return E.page.quad.map((p) => { const [u, w] = rotN(p.x, p.y, r); return [v.x + u * v.w, v.y + w * v.h]; });
}
function edDrawCrop() {
  if (!E.src || !E.page) return;
  edSize();
  const x = E.ctx, rot = E.page.rot;
  const dw = rot % 2 ? E.H : E.W, dh = rot % 2 ? E.W : E.H, pad = 28;
  const sc = Math.min((E.cw - 2 * pad) / dw, (E.ch - 2 * pad) / dh);
  const vw = dw * sc, vh = dh * sc, vx = (E.cw - vw) / 2, vy = (E.ch - vh) / 2;
  E.view = { x: vx, y: vy, w: vw, h: vh, sc };

  x.clearRect(0, 0, E.cw, E.ch);

  x.drawImage(E.src, -E.W * sc / 2, -E.H * sc / 2, E.W * sc, E.H * sc);
  x.restore();
  const pts = cropPoints();
  // dim outside
  x.save();

  pts.forEach((p, i) => (i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]))); x.closePath();
  x.fillStyle = 'rgba(0,0,0,.5)'; x.fill('evenodd');
  x.restore();
  // outline
  x.beginPath(); pts.forEach((p, i) => (i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]))); x.closePath();
  x.lineWidth = 2.5; x.lineJoin = 'round'; x.strokeStyle = '#2ee6a6'; x.stroke();
  // mid handles
  for (let i = 0; i < 4; i++) {
    const a = pts[i], b = pts[(i + 1) % 4], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    x.beginPath(); x.arc(mx, my, 7.5, 0, 7); x.fillStyle = '#fff'; x.fill(); x.lineWidth = 2; x.strokeStyle = '#2ee6a6'; x.stroke();
  }
