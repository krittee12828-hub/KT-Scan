}

async function addCapturedPage(cv, quad, filter) {
  const doc = ensureDoc();
  S.doc = doc;
  const blob = await canvasToBlob(cv, 'image/jpeg', 0.95);
  const page = newPage(cv.width, cv.height, quad, filter || S.settings.defFilter);
  await addPageToDoc(doc, page, blob, cv);
  Cam.count++;
  updateCamCounter();
  updateThumb(page).then(() => { updateCamThumb(page); scheduleSave(doc); }).catch(console.error);
  return page;
}

/* shared by live capture and "system camera" fallback. returns 'ok' | 'dup' | 'front' | 'fail' */
async function ingestFrame(src, sw, sh, opt) {
  const cv = scaleToCanvas(src, sw, sh, +S.settings.capMax, Hw.maxArea);
  const isId = Cam.mode === 'id' && opt.trigger !== 'import';
  const det = detectInCanvas(cv, { minArea: isId ? 0.03 : 0.02, prefer: isId ? 'card' : 'auto' });
  let quad = det.quad, detOk = det.ok;
  if (!detOk && opt.live && opt.liveOk) { quad = opt.live; detOk = true; }

  if (isId) {
    const v = Cam.video && Cam.video.videoWidth ? videoRect() : null;
    let q = quad;
    const asp = quadAspectPx(q, cv.width, cv.height);
    if (!detOk || asp < 1.2 || asp > 2.1) q = v ? idGuideQuad(v) : defaultQuad(0.1);
    const card = warpCard(cv, q);
    if (!Cam.idFront) {
      Cam.idFront = card;
      toast(t('cam.idFrontDone'), 2200, 'ok');
      updateCamCounter();
      return 'front';
    }
    const page = composeIdPage(Cam.idFront, card);
    Cam.idFront = null;
    await addCapturedPage(page, defaultQuad(0), 'lighten');
    toast(t('cam.pageSaved', Cam.count), 1500, 'ok');
    return 'ok';
  }

  const sig = pageSignature(cv, quad);
  if (opt.trigger === 'auto' && S.settings.dupSkip && Cam.lastPageSig && Core.meanAbsDiff(sig, Cam.lastPageSig) < 1.4) {
    toast(t('cam.dup'), 1700);
    sfx('warn');
    return 'dup';
  }
  Cam.lastPageSig = sig;
  await addCapturedPage(cv, quad);
  toast(t('cam.pageSaved', Cam.count), 1400, 'ok');
  return 'ok';

/* import images (gallery / system camera / drag&drop) into a document — used by camera, home and doc views */
async function importFiles(files, doc, opts) {
  files = Array.from(files).filter((f) => /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic|heif|bmp|gif)$/i.test(f.name));
  if (!files.length) { toast(t('err.noImage'), 2500, 'err'); return null; }
  const target = doc || newDoc();
  const isNew = !doc;
  if (isNew) S.docs.unshift(target);
  let added = 0;
  for (let i = 0; i < files.length; i++) {
    busy(t('busy.import', i + 1, files.length), i / files.length);
    await nextFrame();
    try {
      const d = await decodeBlob(files[i]);
      const cv = scaleToCanvas(d.src, d.w, d.h, +S.settings.capMax, Hw.maxArea);
      d.close();
      const det = detectInCanvas(cv, { minArea: 0.02 });
      const blob = await canvasToBlob(cv, 'image/jpeg', 0.95);
      const page = newPage(cv.width, cv.height, det.quad, S.settings.defFilter);
      await addPageToDoc(target, page, blob, cv);
      await updateThumb(page);
      added++;
      if (opts && opts.onPage) opts.onPage(page);
    } catch (e) {
      console.error(e);
      toast(t('err.import', files[i].name), 3000, 'err');
    }
  }
  unbusy();
  if (!added && isNew) S.docs.shift();
  if (added) { scheduleSave(target, 50); toast(t('toast.imported', added), 2000, 'ok'); }
  return added ? target : null;
}

/* ====================================================================
   EDITOR — crop (perspective), filters, adjustments
   ==================================================================== */
const E = {
  doc: null, idx: 0, page: null, tab: 'crop', src: null, W: 0, H: 0,
  warp: null, warpS: null, bgc: null, bgcS: null, dirtyWarp: true, chipsDirty: true,
  result: null, view: { x: 0, y: 0, w: 1, h: 1, sc: 1 }, cw: 0, ch: 0, dpr: 1, drag: null,
  loadToken: 0, raf: 0, wantSmall: false, cv: null, ctx: null, commitTimer: 0, active: false

const rotN = (x, y, r) => { switch (r & 3) { case 0: return [x, y]; case 1: return [1 - y, x]; case 2: return [1 - x, 1 - y]; default: return [y, 1 - x]; } };

function edSize() {
  const r = $('#edStage').getBoundingClientRect(), dpr = Math.min(2.5, window.devicePixelRatio || 1);
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));

/* ------------------------------------------------------------- open / navigate */
async function edOpen(doc, idx, tab) {

function edGo(delta) {

function syncEdControls() {

/* ------------------------------------------------------------- tabs */
async function edSetTab(tab, force) {
  if (!force && tab === E.tab) return;
  E.tab = tab;
  $$('#edTabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  $('#paneCrop').classList.toggle('on', tab === 'crop');
  $('#paneFilter').classList.toggle('on', tab === 'filter');
  $('#paneAdjust').classList.toggle('on', tab === 'adjust');
  if (tab === 'crop') { edDrawCrop(); return; }
  $('#edSpin').hidden = false;
  await nextFrame();
  try {
    await ensureWarp();
    if (E.tab === 'crop') return;
    if (tab === 'filter') await buildChips();
    const c = renderFiltered(false);
    if (c) drawResultCanvas(c);
  } catch (e) { console.error(e); toast(t('err.render'), 3000, 'err'); }
  $('#edSpin').hidden = true;
}

async function ensureWarp() {
  if (!E.dirtyWarp && E.warp) return;
  const token = E.loadToken;
  const w = await warpPage(E.page, 'prev', 1400);
  if (token !== E.loadToken) return;
  E.warp = w; E.bgc = null; E.bgcS = null;
  if (Math.max(w.width, w.height) > 640) {
    const sm = scaleToCanvas(pixelsToCanvas({ width: w.width, height: w.height, data: new Uint8ClampedArray(w.data) }), w.width, w.height, 640);
    E.warpS = ctx2d(sm, true).getImageData(0, 0, sm.width, sm.height);

}

function renderFiltered(small) {
  const base = small ? E.warpS : E.warp;
  if (!base) return null;
  const copy = { width: base.width, height: base.height, data: new Uint8ClampedArray(base.data) };
  const p = E.page;
  let bgc = null;
  if (Core.needsBg(p.filter)) {
    if (small) { E.bgcS = E.bgcS || Core.estimateBackground(base); bgc = E.bgcS; }
    else { E.bgc = E.bgc || Core.estimateBackground(base); bgc = E.bgc; }
  }
  Core.applyFilter(copy, filterOpts(p), bgc);
  return rotateCanvas(pixelsToCanvas(copy), p.rot);
}

function drawResultCanvas(c) {
  edSize();
  const x = E.ctx;
  x.setTransform(E.dpr, 0, 0, E.dpr, 0, 0);
  x.clearRect(0, 0, E.cw, E.ch);
  const pad = 18, sc = Math.min((E.cw - 2 * pad) / c.width, (E.ch - 2 * pad) / c.height);
  const w = c.width * sc, h = c.height * sc, px = (E.cw - w) / 2, py = (E.ch - h) / 2;
  x.save(); x.shadowColor = 'rgba(0,0,0,.35)'; x.shadowBlur = 18; x.shadowOffsetY = 4; x.fillStyle = '#fff'; x.fillRect(px, py, w, h); x.restore();
  x.imageSmoothingQuality = 'high';
  x.drawImage(c, px, py, w, h);
  E.result = c;
}

function scheduleRender(small) {
  E.wantSmall = small;
  if (E.raf) return;
  E.raf = requestAnimationFrame(() => {
    E.raf = 0;
    const c = renderFiltered(E.wantSmall);
    if (c) drawResultCanvas(c);
  });
}

/* ------------------------------------------------------------- filter chips */
async function buildChips() {
  const list = $('#filterList');
  if (!E.chipsDirty && list.children.length) { syncEdControls(); return; }
  const base = E.warpS;
  const tiny = scaleToCanvas(pixelsToCanvas({ width: base.width, height: base.height, data: new Uint8ClampedArray(base.data) }), base.width, base.height, 170);
  const td = ctx2d(tiny, true).getImageData(0, 0, tiny.width, tiny.height);
  const bgc = Core.estimateBackground(td);
  list.innerHTML = '';
  for (const f of Core.FILTERS) {
    const copy = { width: td.width, height: td.height, data: new Uint8ClampedArray(td.data) };
    Core.applyFilter(copy, { filter: f, bwLevel: E.page.bw }, bgc);
    const c = rotateCanvas(pixelsToCanvas(copy), E.page.rot);
    const b = document.createElement('button');
    b.className = 'fchip'; b.dataset.f = f;
    c.style.objectFit = 'contain';
    b.appendChild(c);
    const s = document.createElement('span'); s.textContent = t('filter.' + f); b.appendChild(s);
    b.addEventListener('click', () => edSetFilter(f));
    list.appendChild(b);
  }
  E.chipsDirty = false;
  syncEdControls();
}
function relabelChips() {
  $$('#filterList .fchip').forEach((b) => { b.lastChild.textContent = t('filter.' + b.dataset.f); });
}

function edSetFilter(f) {
  E.page.filter = f;
  syncEdControls();
  const c = renderFiltered(false);
  if (c) drawResultCanvas(c);
  edCommitSoon();
}

/* ------------------------------------------------------------- crop view */
function cropPoints() {
  const v = E.view, r = E.page.rot;
  return E.page.quad.map((p) => { const [u, w] = rotN(p.x, p.y, r); return [v.x + u * v.w, v.y + w * v.h]; });
}
function edDrawCrop() {
  if (!E.src || !E.page) return;
  edSize();
  const x = E.ctx, rot = E.page.rot;
  const dw = rot % 2 ? E.H : E.W, dh = rot % 2 ? E.W : E.H, pad = 28;
  const sc = Math.min((E.cw - 2 * pad) / dw, (E.ch - 2 * pad) / dh);
  const vw = dw * sc, vh = dh * sc, vx = (E.cw - vw) / 2, vy = (E.ch - vh) / 2;
  E.view = { x: vx, y: vy, w: vw, h: vh, sc };
  x.setTransform(E.dpr, 0, 0, E.dpr, 0, 0);
  x.clearRect(0, 0, E.cw, E.ch);
  x.save();
  x.translate(vx + vw / 2, vy + vh / 2); x.rotate(rot * Math.PI / 2);
  x.imageSmoothingQuality = 'high';
  x.drawImage(E.src, -E.W * sc / 2, -E.H * sc / 2, E.W * sc, E.H * sc);
  x.restore();
  const pts = cropPoints();
  // dim outside
  x.save();
  x.beginPath(); x.rect(vx, vy, vw, vh);
  pts.forEach((p, i) => (i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]))); x.closePath();
  x.fillStyle = 'rgba(0,0,0,.5)'; x.fill('evenodd');
  x.restore();
  // outline
  x.beginPath(); pts.forEach((p, i) => (i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]))); x.closePath();
  x.lineWidth = 2.5; x.lineJoin = 'round'; x.strokeStyle = '#46C6F2'; x.stroke();

  for (let i = 0; i < 4; i++) {
    const a = pts[i], b = pts[(i + 1) % 4], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    x.beginPath(); x.arc(mx, my, 7.5, 0, 7); x.fillStyle = '#fff'; x.fill(); x.lineWidth = 2; x.strokeStyle = '#46C6F2'; x.stroke();
  }
  // corner handles
  pts.forEach((p) => {
    x.beginPath(); x.arc(p[0], p[1], 12, 0, 7); x.fillStyle = 'rgba(70,198,242,.3)'; x.fill();
    x.lineWidth = 3; x.strokeStyle = '#fff'; x.stroke();
    x.beginPath(); x.arc(p[0], p[1], 4, 0, 7); x.fillStyle = '#46C6F2'; x.fill();
  });

}
function edDraw() {
  if (!E.active || !E.page) return;
  if (E.tab === 'crop') edDrawCrop();
  else if (E.result) drawResultCanvas(E.result);
}

function localXY(e) {
  const r = E.cv.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}
function hitTest(p) {
  const pts = cropPoints();
  let best = null, bd = 1e9;
  pts.forEach((q, i) => { const d = Math.hypot(q[0] - p[0], q[1] - p[1]); if (d < 40 && d < bd) { bd = d; best = { type: 'corner', i }; } });
  if (best) return best;
  for (let i = 0; i < 4; i++) {
    const a = pts[i], b = pts[(i + 1) % 4], d = Math.hypot((a[0] + b[0]) / 2 - p[0], (a[1] + b[1]) / 2 - p[1]);
    if (d < 32 && d < bd) { bd = d; best = { type: 'mid', i }; }
  }
  return best;
}
function viewToNorm(px, py) {
  const v = E.view;
  const u = clamp((px - v.x) / v.w, 0, 1), w = clamp((py - v.y) / v.h, 0, 1);
  const [x, y] = unrotN(u, w, E.page.rot);
  return { x, y };
}
function quadOk(q) {
  const Q = q.map((p) => [p.x * 100, p.y * 100]);
  return Core.isConvexQuad(Q) && Core.polyArea(Q) > 60;
}

function edPointerDown(e) {
  if (E.tab !== 'crop' || !E.page) return;
  const p = localXY(e), h = hitTest(p);
  if (!h) return;
  E.cv.setPointerCapture(e.pointerId);
  E.drag = { h, start: p, quad0: E.page.quad.map((q) => ({ x: q.x, y: q.y })), pts0: cropPoints() };
  edShowLoupe(h);
  e.preventDefault();
}
function edPointerMove(e) {
  const d = E.drag;
  if (!d) {
    if (E.tab === 'crop' && e.pointerType === 'mouse') E.cv.style.cursor = hitTest(localXY(e)) ? 'grab' : 'default';
    return;
  }
  const p = localXY(e), dx = p[0] - d.start[0], dy = p[1] - d.start[1];
  const q = d.quad0.map((c) => ({ x: c.x, y: c.y }));
  if (d.h.type === 'corner') {
    const o = d.pts0[d.h.i];
    q[d.h.i] = viewToNorm(o[0] + dx, o[1] + dy);
  } else {
    const i = d.h.i, j = (i + 1) % 4, a = d.pts0[i], b = d.pts0[j];
    const ex = b[0] - a[0], ey = b[1] - a[1], L = Math.hypot(ex, ey) || 1, nx = -ey / L, ny = ex / L;
    const proj = dx * nx + dy * ny;
    q[i] = viewToNorm(a[0] + nx * proj, a[1] + ny * proj);
    q[j] = viewToNorm(b[0] + nx * proj, b[1] + ny * proj);
  }

    E.page.quad = q; E.dirtyWarp = true;
    edDrawCrop();
    edShowLoupe(d.h);
  }

}
function edPointerUp() {
  if (!E.drag) return;
  E.drag = null;
  $('#edLoupe').style.display = 'none';
  edCommitSoon();
}

function edShowLoupe(h) {
  const L = $('#edLoupe'), c = L.getContext('2d'), SZ = 224;
  const pt = h.type === 'corner' ? E.page.quad[h.i] : (() => { const a = E.page.quad[h.i], b = E.page.quad[(h.i + 1) % 4]; return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; })();
  const pv = cropPoints(), vp = h.type === 'corner' ? pv[h.i] : [(pv[h.i][0] + pv[(h.i + 1) % 4][0]) / 2, (pv[h.i][1] + pv[(h.i + 1) % 4][1]) / 2];
  const left = vp[0] > E.cw - 170 ? false : (vp[0] < 170 && vp[1] < 170);
  L.style.display = 'block';
  L.style.left = left ? 'auto' : '12px'; L.style.right = left ? '12px' : 'auto';
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, SZ, SZ);
  c.save();
  c.beginPath(); c.arc(SZ / 2, SZ / 2, SZ / 2, 0, 7); c.clip();
  c.fillStyle = '#111'; c.fillRect(0, 0, SZ, SZ);
  const k = E.view.sc * 2.4 * 2;
  c.translate(SZ / 2, SZ / 2); c.rotate(E.page.rot * Math.PI / 2); c.scale(k, k); c.translate(-pt.x * E.W, -pt.y * E.H);
  c.imageSmoothingQuality = 'high';
  c.drawImage(E.src, 0, 0);
  c.restore();
  c.strokeStyle = 'rgba(70,198,242,.95)'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(SZ / 2 - 18, SZ / 2); c.lineTo(SZ / 2 + 18, SZ / 2); c.moveTo(SZ / 2, SZ / 2 - 18); c.lineTo(SZ / 2, SZ / 2 + 18); c.stroke();
}

/* ------------------------------------------------------------- actions */

  clearTimeout(E.commitTimer);
  E.commitTimer = setTimeout(edCommitNow, 700);
}
async function edCommitNow() {
  clearTimeout(E.commitTimer);
  const p = E.page, d = E.doc;
  if (!p || !d) return;
  scheduleSave(d, 200);
  try { await updateThumb(p); scheduleSave(d, 200); refreshLibraryViews(); } catch (e) { console.warn('thumb failed', e); }
}

function edAutoCrop() {
  const r = detectInCanvas(E.src, { size: 520 });
  E.page.quad = r.quad; E.dirtyWarp = true;
  edDrawCrop();
  toast(r.ok ? t('ed.autoOk') : t('ed.autoFail'), 1800, r.ok ? 'ok' : '');
  edCommitSoon();
}
function edFullCrop() {
  E.page.quad = defaultQuad(0); E.dirtyWarp = true;
  edDrawCrop(); edCommitSoon();
}
function edRotate(dir) {
  E.page.rot = (E.page.rot + dir + 4) & 3;
  E.chipsDirty = true;
  if (E.tab === 'crop') edDrawCrop();
  else {
    const c = renderFiltered(false);
    if (c) drawResultCanvas(c);
    if (E.tab === 'filter') buildChips();
  }

}

async function applyToAll() {
  const p = E.page, d = E.doc;
  const ok = await askConfirm(t('ed.applyAllTitle'), t('ed.applyAllText', d.pages.length), t('ok'));
  if (!ok) return;
  d.pages.forEach((q) => { q.filter = p.filter; q.bright = p.bright; q.contrast = p.contrast; q.sharp = p.sharp; q.sat = p.sat || 0; q.bw = p.bw; });
  scheduleSave(d, 100);
  for (let i = 0; i < d.pages.length; i++) {
    busy(t('busy.thumbs', i + 1, d.pages.length), i / d.pages.length);
    await nextFrame();
    try { await updateThumb(d.pages[i]); } catch (e) { console.warn(e); }
  }

  scheduleSave(d, 100);
  refreshLibraryViews();

function edMenu() {
  openMenu(t('ed.menuTitle'), [
    { icon: 'text', label: t('ocr.menu'), fn: () => ocrOpen([E.page]) },
    { icon: 'layers', label: t('ed.applyAll'), fn: applyToAll },
    { icon: 'trash', label: t('ed.deletePage'), danger: true, fn: async () => {
      if (!(await askConfirm(t('ed.deletePage'), t('ed.deleteText'), t('delete'), true))) return;
      const d = E.doc, i = E.idx;

function renderDoc() {
  const d = S.doc;

  $('#docName').textContent = d.name;

  const grid = $('#pageGrid');

    let timer = 0, longPressed = false, sx = 0, sy = 0;
    el.addEventListener('pointerdown', (e) => {
      longPressed = false; sx = e.clientX; sy = e.clientY;
      if (e.pointerType === 'mouse') return;
      timer = setTimeout(() => { longPressed = true; vibrate(15); enterSel(i); }, 480);
    });
    const cancel = () => clearTimeout(timer);
    el.addEventListener('pointermove', (e) => { if (Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancel(); });
    el.addEventListener('pointerup', cancel); el.addEventListener('pointercancel', cancel); el.addEventListener('pointerleave', cancel);
    el.addEventListener('click', () => {
      if (longPressed) { longPressed = false; return; }
      if (S.selMode) { toggleSel(i); return; }
      navTo(`edit/${d.id}/${i}`);
    });
    el.addEventListener('contextmenu', (e) => { if (e.pointerType === 'touch') e.preventDefault(); });
    // desktop drag & drop reorder
    el.addEventListener('dragstart', (e) => { el.classList.add('dragging'); e.dataTransfer.setData('text/plain', String(i)); e.dataTransfer.effectAllowed = 'move'; });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); $$('.pcard.drop').forEach((x) => x.classList.remove('drop')); });
    el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('drop'); });
    el.addEventListener('dragleave', () => el.classList.remove('drop'));
    el.addEventListener('drop', (e) => {
      e.preventDefault(); el.classList.remove('drop');
      const from = +e.dataTransfer.getData('text/plain');
      if (!isNaN(from) && from !== i) movePage(from, i);

    grid.appendChild(el);
    if (!p.thumbUrl) updateThumb(p).then(() => { if (S.doc === d && curRoute.indexOf('doc/') === 0) renderDoc(); }).catch(() => {});
  });
  updateSelUI();

/* ------------------------------------------------------------- router */
let curRoute = null;
function showView(id) {
  $$('.view').forEach((v) => v.classList.toggle('active', v.id === id));
}
const depth = () => (history.state && history.state.d) || 0;
function navTo(path) { history.pushState({ d: depth() + 1 }, '', '#/' + path); route(); }
function navReplace(path) { history.replaceState({ d: depth() }, '', '#/' + path); route(); }
function navBack() { if (depth() > 0) history.back(); else navReplace(''); }
function navBackTo(fallback) { if (depth() > 0) history.back(); else navReplace(fallback); }

async function route() {
  const h = location.hash.replace(/^#\/?/, '');
  if (h === curRoute) return;
  const prev = curRoute || '';
  curRoute = h;
  const [name, a, b] = h.split('/').map(decodeURIComponent);
  const prevName = prev.split('/')[0];
  if (prevName === 'scan' && name !== 'scan') camLeave();
  if (prevName === 'edit' && name !== 'edit') edLeave();
  try {
    if (name === 'scan') { showView('vCam'); await camEnter(a); }
    else if (name === 'doc') { showView('vDoc'); await openDocView(a); }
    else if (name === 'edit') {
      const d = await loadDoc(a);
      if (!d || !d.pages.length) { navReplace(''); return; }
      S.doc = d;
      showView('vEdit');
      await nextFrame();
      await edOpen(d, +b || 0, prevName === 'edit' ? undefined : 'crop');
    } else { showView('vHome'); renderHome(); }
  } catch (e) { console.error(e); toast(String(e && e.message || e), 4000, 'err'); }
}

  if (curRoute === '') renderHome();
  else if (curRoute && curRoute.indexOf('doc/') === 0 && S.doc) renderDoc();

/* ---- 60-export.js ---- */
/* ====================================================================
   EXPORT — PDF / JPG / PNG / ZIP, share, print, OCR
   ==================================================================== */
/* max = long side in px: A4 @150/300/600 dpi -> 1754 / 3508 / 7016 (600 dpi A4 = 34.8 MP, the same pixel count as 8K UHD) */
const QUAL = { small: { max: 1600, q: 0.72 }, std: { max: 2480, q: 0.86 }, high: { max: 3508, q: 0.93 }, print: { max: 7016, q: 0.95 } };
const Ex = { doc: null, sel: null, scope: 'all' };

function chipGroup(root, onChange) {
  root.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b || !root.contains(b)) return;
    $$('button', root).forEach((x) => x.classList.toggle('on', x === b));
    if (onChange) onChange(b.dataset.v);
  });
}
const chipValue = (root) => { const b = $('button.on', root); return b ? b.dataset.v : null; };
function chipSet(root, v) { $$('button', root).forEach((x) => x.classList.toggle('on', x.dataset.v === v)); }

function canShareFiles() {
  try {
    return !!(navigator.canShare && navigator.share && navigator.canShare({ files: [new File(['x'], 'a.pdf', { type: 'application/pdf' })] }));
  } catch (e) { return false; }
}
function exPages() {
  const d = Ex.doc;
  if (Ex.sel && Ex.scope === 'sel') return Ex.sel.map((i) => d.pages[i]).filter(Boolean);
  return d.pages.slice();
}
function exUpdateInfo() {
  const fmt = chipValue($('#exFormat'));
  $('#exSizeBox').hidden = fmt !== 'pdf';
  $('#exInfo').textContent = t('export.info', exPages().length);
}
function exportOpen(doc, sel) {
  if (!doc || !doc.pages.length) return;
  Ex.doc = doc; Ex.sel = sel && sel.length ? sel : null; Ex.scope = Ex.sel ? 'sel' : 'all';
  $('#exName').value = doc.name;
  chipSet($('#exFormat'), S.settings.expFormat);
  $('#exSize').value = S.settings.expSize;
  $('#exQuality').value = S.settings.expQuality;
  const sb = $('#exScopeBox');
  sb.hidden = !Ex.sel;
  if (Ex.sel) {
    const [a, b] = $$('#exScope button');
    a.textContent = t('export.all', doc.pages.length); b.textContent = t('export.selected', Ex.sel.length);
    chipSet($('#exScope'), 'sel');
  }
  $('#exShare').hidden = !canShareFiles();
  exUpdateInfo();
  $('#dlgExport').showModal();
}

async function exBuild(pages, fmt, name) {
  const Q = QUAL[S.settings.expQuality] || QUAL.std;
  const items = [];
  const mime = fmt === 'png' ? 'image/png' : 'image/jpeg';
  let maxW = 0, maxH = 0, lowered = false;
  for (let i = 0; i < pages.length; i++) {
    const label = (r) => t('busy.renderHi', i + 1, pages.length, Q.max >= 5000 ? '600 dpi' : Q.max >= 3000 ? '300 dpi' : '');
    busy(label(), i / pages.length);
    await nextFrame();
    const r = await renderToBlob(pages[i], Q.max, mime, Q.q, (f) => busy(label(), (i + f) / pages.length));
    if (r.lowered) lowered = true;
    if (r.w * r.h > maxW * maxH) { maxW = r.w; maxH = r.h; }
    if (fmt === 'pdf') items.push({ jpeg: new Uint8Array(await r.blob.arrayBuffer()), w: r.w, h: r.h });
    else items.push({ blob: r.blob, w: r.w, h: r.h });
  }
  const info = { res: `${maxW.toLocaleString('en-US')}×${maxH.toLocaleString('en-US')} px`, lowered };
  if (fmt === 'pdf') {
    busy(t('busy.pdf'), 1);
    await nextFrame();
    const bytes = Core.buildPDF(items, { size: S.settings.expSize, margin: S.settings.expSize === 'fit' ? 0 : 0, title: name });
    return { kind: 'pdf', blob: new Blob([bytes], { type: 'application/pdf' }), ext: '.pdf', info };
  }
  return { kind: 'img', items, ext: fmt === 'png' ? '.png' : '.jpg', mime, info };
}

async function exRun(action) {
  const pages = exPages();
  if (!pages.length) return;
  const fmt = chipValue($('#exFormat')) || 'pdf';
  const name = safeName($('#exName').value || Ex.doc.name);
  S.settings.expFormat = fmt; S.settings.expSize = $('#exSize').value; S.settings.expQuality = $('#exQuality').value; saveSettings();
  $('#dlgExport').close();
  try {
    const res = await exBuild(pages, fmt, name);
    let files = [];
    if (res.kind === 'pdf') files = [new File([res.blob], name + res.ext, { type: 'application/pdf' })];
    else files = await Promise.all(res.items.map(async (it, i) => new File([it.blob], res.items.length > 1 ? `${name}-${String(i + 1).padStart(2, '0')}${res.ext}` : name + res.ext, { type: res.mime })));
    if (action === 'share') {
      unbusy();
      if (navigator.canShare && navigator.canShare({ files })) {
        try { await navigator.share({ files, title: name }); }
        catch (e) { if (e && e.name !== 'AbortError') { console.error(e); toast(t('err.share'), 3000, 'err'); } }
        return;
      }
    }
    if (files.length === 1) downloadBlob(files[0], files[0].name);
    else {
      busy(t('busy.zip'), 1);
      await nextFrame();
      const zipFiles = [];
      for (const f of files) zipFiles.push({ name: f.name, data: new Uint8Array(await f.arrayBuffer()) });
      downloadBlob(new Blob([Core.buildZip(zipFiles)], { type: 'application/zip' }), name + '.zip');
    }
    unbusy();
    toast(res.info.lowered ? t('export.lowered', res.info.res) : t('export.doneRes', res.info.res), res.info.lowered ? 4200 : 2600, 'ok');
  } catch (e) {
    console.error(e);
    unbusy();
    toast(t('err.export') + (e && e.message ? ' — ' + e.message : ''), 4500, 'err');
  }
}

async function printPages(pages) {
  if (!pages.length) return;
  const area = $('#printArea');
  area.innerHTML = '';
  const urls = [];
  try {
    for (let i = 0; i < pages.length; i++) {
      busy(t('busy.render', i + 1, pages.length), i / pages.length);
      await nextFrame();
      const r = await renderToBlob(pages[i], 3508, 'image/jpeg', 0.92), url = URL.createObjectURL(r.blob);
      urls.push(url);
      const im = new Image(); im.src = url; im.alt = '';
      area.appendChild(im);
      await im.decode().catch(() => {});
    }
    unbusy();
    const cleanup = () => { area.innerHTML = ''; urls.forEach((u) => URL.revokeObjectURL(u)); window.removeEventListener('afterprint', cleanup); };
    window.addEventListener('afterprint', cleanup);
    setTimeout(() => window.print(), 80);
  } catch (e) { console.error(e); unbusy(); toast(t('err.export'), 3000, 'err'); }
}

/* ------------------------------------------------------------- OCR (optional, loads Tesseract.js on demand) */
const TESS_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
const Oc = { pages: [], running: false };
function ocrOpen(pages) {
  Oc.pages = pages;
  $('#ocrText').value = '';
  chipSet($('#ocrLang'), LANG === 'th' ? 'tha+eng' : 'eng');
  $('#ocrProg').hidden = true;
  $('#ocrStatus').textContent = t('ocr.note');
  $('#dlgOcr').showModal();
  ocrRun();
}
async function ocrRun() {
  if (Oc.running) return;
  Oc.running = true;
  const lang = chipValue($('#ocrLang')) || 'eng', n = Oc.pages.length;
  const prog = $('#ocrProg'), bar = $('#ocrBar'), st = $('#ocrStatus');
  prog.hidden = false; bar.style.width = '2%';
  st.textContent = t('ocr.loading');
  let worker = null;
  try {
    if (!window.Tesseract) await loadScript(TESS_URL);
    let cur = 0;
    worker = await window.Tesseract.createWorker(lang, 1, {
      logger: (m) => {
        if (m.status === 'recognizing text') bar.style.width = Math.round(((cur + m.progress) / n) * 100) + '%';
        else if (typeof m.progress === 'number') st.textContent = t('ocr.loading') + ' ' + Math.round(m.progress * 100) + '%';
      }
    });
    let text = '';
    for (let i = 0; i < n; i++) {
      cur = i;
      st.textContent = t('ocr.page', i + 1, n);
      const c = await renderPage(Oc.pages[i], 'full', 2200);
      const r = await worker.recognize(c);
      text += (n > 1 ? `${i ? '\n\n' : ''}— ${t('page')} ${i + 1} —\n` : '') + (r.data.text || '').trim();
      $('#ocrText').value = text;
    }
    bar.style.width = '100%';
    st.textContent = text.trim() ? t('ocr.done') : t('ocr.empty');
  } catch (e) {
    console.error(e);
    st.textContent = t('ocr.err');
  } finally {
    if (worker) { try { await worker.terminate(); } catch (e) { /* ignore */ } }
    Oc.running = false;
    setTimeout(() => { prog.hidden = true; }, 600);
  }
}

function initExport() {
  const dlg = $('#dlgExport');
  closeOnBackdrop(dlg); closeOnBackdrop($('#dlgOcr')); closeOnBackdrop($('#dlgMenu'));
  chipGroup($('#exFormat'), exUpdateInfo);

/* ---- 70-donate.js ---- */
/* ====================================================================
   DONATE — PromptPay QR (amount filled in), minimum 10 THB
   Everything is generated on the device; nothing is sent anywhere.
   ==================================================================== */
const PROMPTPAY_ID = '0840958691';
const DONATE_MIN = 10, DONATE_MAX = 100000;
const Dn = { amount: 50, valid: true };

const fmtPhone = (n) => n.replace(/^(\d{3})(\d{3})(\d{4})$/, '$1-$2-$3');
const fmtBaht = (v) => (Math.round(v * 100) % 100 === 0 ? String(Math.round(v)) : v.toFixed(2)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

/* draw the QR matrix; quiet zone of 4 modules */
function drawQR(canvas, matrix, px) {
  const n = matrix.length, q = 4, size = (n + q * 2) * px;
  canvas.width = size; canvas.height = size;
  const x = canvas.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, size, size);
  x.fillStyle = '#111';
  for (let y = 0; y < n; y++) for (let k = 0; k < n; k++) if (matrix[y][k]) x.fillRect((k + q) * px, (y + q) * px, px, px);
}

function dnParse() {
  const raw = ($('#dnCustom').value || '').trim().replace(',', '.');
  if (raw === '') return { v: Dn.amount, err: '' };
  const v = Number(raw);
  if (!isFinite(v)) return { v: NaN, err: t('donate.bad') };
  const r = Math.round(v * 100) / 100;
  if (r < DONATE_MIN) return { v: r, err: t('donate.min') };
  if (r > DONATE_MAX) return { v: r, err: t('donate.max') };
  return { v: r, err: '' };
}
function dnRender() {
  const p = dnParse(), box = $('#dnQrBox'), err = $('#dnErr');
  Dn.valid = !p.err;
  err.hidden = !p.err; err.textContent = p.err;
  box.classList.toggle('off', !Dn.valid);
  $('#dnSave').disabled = !Dn.valid; $('#dnDone').disabled = !Dn.valid;
  if (!Dn.valid) return;
  Dn.amount = p.v;
  const m = Core.qrEncode(Core.promptPayPayload(PROMPTPAY_ID, Dn.amount));
  drawQR($('#dnQr'), m, Math.max(4, Math.floor(320 / (m.length + 8))));
}
function openDonate() {
  Dn.amount = 50;
  $('#dnCustom').value = '';
  $$('#dnAmts button').forEach((b) => b.classList.toggle('on', b.dataset.v === '50'));
  $('#dnNum').textContent = fmtPhone(PROMPTPAY_ID);
  dnRender();
  $('#dlgDonate').showModal();
}

/* printable card: big QR + amount + number */
async function dnSaveImage() {
  if (!Dn.valid) return;
  const m = Core.qrEncode(Core.promptPayPayload(PROMPTPAY_ID, Dn.amount));
  const qc = document.createElement('canvas');
  drawQR(qc, m, Math.max(8, Math.floor(720 / (m.length + 8))));
  const W = 900, pad = 60, qs = W - pad * 2, H = pad + 90 + qs + 190;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  x.textAlign = 'center'; x.fillStyle = '#06709C'; x.font = '700 52px "IBM Plex Sans Thai", system-ui, "Noto Sans Thai", sans-serif';
  x.fillText('KT-Scan', W / 2, pad + 52);
  x.imageSmoothingEnabled = false;
  x.drawImage(qc, pad, pad + 90, qs, qs);
  x.imageSmoothingEnabled = true;
  x.fillStyle = '#101A2C'; x.font = '700 54px "IBM Plex Sans Thai", system-ui, "Noto Sans Thai", sans-serif';
  x.fillText(`PromptPay  ${fmtPhone(PROMPTPAY_ID)}`, W / 2, pad + 90 + qs + 70);
  x.font = '600 46px "IBM Plex Sans Thai", system-ui, "Noto Sans Thai", sans-serif'; x.fillStyle = '#52607A';
  x.fillText(`${fmtBaht(Dn.amount)} THB`, W / 2, pad + 90 + qs + 140);
  const blob = await canvasToBlob(c, 'image/png');
  downloadBlob(blob, `KT-Scan-donate-${fmtBaht(Dn.amount).replace(/,/g, '')}.png`);
  toast(t('donate.saved'), 1800, 'ok');
}

function initDonate() {
  const dlg = $('#dlgDonate');
  closeOnBackdrop(dlg);
  $('#btnHomeDonate').addEventListener('click', openDonate);
  chipGroup($('#dnAmts'), (v) => { Dn.amount = +v; $('#dnCustom').value = ''; dnRender(); });
  $('#dnCustom').addEventListener('input', () => {
    $$('#dnAmts button').forEach((b) => b.classList.remove('on'));
    const raw = $('#dnCustom').value.trim();
    if (raw === '') { $$('#dnAmts button').forEach((b) => b.classList.toggle('on', +b.dataset.v === Dn.amount)); }
    dnRender();
  });
  $('#dnCopy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(PROMPTPAY_ID); }
    catch (e) { const ta = document.createElement('textarea'); ta.value = PROMPTPAY_ID; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e2) { /* ignore */ } ta.remove(); }
    toast(t('donate.copied'), 1600, 'ok');
  });
  $('#dnSave').addEventListener('click', () => dnSaveImage().catch((e) => { console.error(e); toast(t('err.export'), 2500, 'err'); }));
  $('#dnDone').addEventListener('click', () => { dlg.close(); toast(t('donate.thanks'), 3200, 'ok'); });
}

/* ---- 90-main.js ---- */
/* ====================================================================
   MAIN — startup, global shortcuts, drag & drop
   ==================================================================== */
async function init() {
  applyTheme();
  applyI18n(document);
  fillFilterSelect();
  await DB.open();
  try {
    const recs = await DB.allDocs();
    S.docs = recs.map(hydrateDoc);
  } catch (e) { console.error(e); S.docs = []; }

  initCamera(); initEditor(); initLibrary(); initExport(); initDonate();

  document.addEventListener('pointerdown', () => audio(), { once: true, passive: true });
  window.addEventListener('pagehide', () => { flushSave(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });
  window.addEventListener('unhandledrejection', (e) => console.error('Unhandled', e.reason));

  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input,textarea,select')) return;
    if (document.querySelector('dialog[open]')) return;
    const r = (curRoute || '').split('/')[0];
    if (r === 'scan') {
      if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); camCapture('manual'); }
      else if (e.key === 'Escape') camFinish();
      else if (e.key === 'a' || e.key === 'A') $('#camAuto').click();
    } else if (r === 'edit') {
      if (e.key === 'ArrowLeft') edGo(-1);
      else if (e.key === 'ArrowRight') edGo(1);
      else if (e.key === 'Escape') navBackTo('doc/' + (E.doc ? E.doc.id : ''));
    } else if (r === 'doc') {
      if (e.key === 'Escape') { if (S.selMode) { S.selMode = false; S.sel.clear(); updateSelUI(); } else navBackTo(''); }
      else if ((e.key === 'Delete' || e.key === 'Backspace') && S.selMode && S.sel.size) deleteSelected();
    }
  });

  // drag & drop / paste images (desktop)
  const routeTarget = () => { const r = (curRoute || '').split('/')[0]; return r === 'doc' ? 'doc' : r === 'scan' ? 'cam' : 'home'; };
  window.addEventListener('dragover', (e) => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).indexOf('Files') >= 0) e.preventDefault(); });
  window.addEventListener('drop', (e) => {
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();
    const r = (curRoute || '').split('/')[0];
    if (r === 'edit') return;
    S.importTarget = routeTarget();
    handleImport(Array.from(e.dataTransfer.files));
  });
  document.addEventListener('paste', (e) => {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    const files = Array.from((e.clipboardData && e.clipboardData.files) || []);
    if (!files.length || (curRoute || '').indexOf('edit') === 0) return;
    S.importTarget = routeTarget();
    handleImport(files);
  });

  await route();
  document.documentElement.classList.add('ready');
}
init().catch((e) => { console.error(e); toast(String((e && e.message) || e), 6000, 'err'); });

})();
