/* ---- 60-export.js ---- */
/* ====================================================================
   EXPORT — PDF / JPG / PNG / ZIP, share, print, OCR
   ==================================================================== */
/* max = long side in px: A4 @150/300/600 dpi -> 1754 / 3508 / 7016 (600 dpi A4 = 34.8 MP, the same pixel count as 8K UHD) */
const QUAL = { small: { max: 1600, q: 0.72 }, std: { max: 2480, q: 0.86 }, high: { max: 3508, q: 0.93 }, print: { max: 7016, q: 0.95 } };
const Ex = { doc: null, sel: null, scope: 'all' };

function chipGroup(root, onChange) {
  root.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b || !root.contains(b)) return;
    $$('button', root).forEach((x) => x.classList.toggle('on', x === b));
    if (onChange) onChange(b.dataset.v);
  });
}
const chipValue = (root) => { const b = $('button.on', root); return b ? b.dataset.v : null; };
function chipSet(root, v) { $$('button', root).forEach((x) => x.classList.toggle('on', x.dataset.v === v)); }

function canShareFiles() {
  try {
    return !!(navigator.canShare && navigator.share && navigator.canShare({ files: [new File(['x'], 'a.pdf', { type: 'application/pdf' })] }));
  } catch (e) { return false; }
}
function exPages() {
  const d = Ex.doc;
  if (Ex.sel && Ex.scope === 'sel') return Ex.sel.map((i) => d.pages[i]).filter(Boolean);
  return d.pages.slice();
}
function exUpdateInfo() {
  const fmt = chipValue($('#exFormat'));
  $('#exSizeBox').hidden = fmt !== 'pdf';
  $('#exInfo').textContent = t('export.info', exPages().length);
}
function exportOpen(doc, sel) {
  if (!doc || !doc.pages.length) return;
  Ex.doc = doc; Ex.sel = sel && sel.length ? sel : null; Ex.scope = Ex.sel ? 'sel' : 'all';
  $('#exName').value = doc.name;
  chipSet($('#exFormat'), S.settings.expFormat);
  $('#exSize').value = S.settings.expSize;
  $('#exQuality').value = S.settings.expQuality;
  const sb = $('#exScopeBox');
  sb.hidden = !Ex.sel;
  if (Ex.sel) {
    const [a, b] = $$('#exScope button');
    a.textContent = t('export.all', doc.pages.length); b.textContent = t('export.selected', Ex.sel.length);
    chipSet($('#exScope'), 'sel');
  }
  $('#exShare').hidden = !canShareFiles();
  exUpdateInfo();
  $('#dlgExport').showModal();
}

async function exBuild(pages, fmt, name) {
  const Q = QUAL[S.settings.expQuality] || QUAL.std;
  const items = [];
  const mime = fmt === 'png' ? 'image/png' : 'image/jpeg';
  let maxW = 0, maxH = 0, lowered = false;
  for (let i = 0; i < pages.length; i++) {
    const label = (r) => t('busy.renderHi', i + 1, pages.length, Q.max >= 5000 ? '600 dpi' : Q.max >= 3000 ? '300 dpi' : '');
    busy(label(), i / pages.length);
    await nextFrame();
    const r = await renderToBlob(pages[i], Q.max, mime, Q.q, (f) => busy(label(), (i + f) / pages.length));
    if (r.lowered) lowered = true;
    if (r.w * r.h > maxW * maxH) { maxW = r.w; maxH = r.h; }
    if (fmt === 'pdf') items.push({ jpeg: new Uint8Array(await r.blob.arrayBuffer()), w: r.w, h: r.h });
    else items.push({ blob: r.blob, w: r.w, h: r.h });
  }
  const info = { res: `${maxW.toLocaleString('en-US')}×${maxH.toLocaleString('en-US')} px`, lowered };
  if (fmt === 'pdf') {
    busy(t('busy.pdf'), 1);
    await nextFrame();
    const bytes = Core.buildPDF(items, { size: S.settings.expSize, margin: S.settings.expSize === 'fit' ? 0 : 0, title: name });
    return { kind: 'pdf', blob: new Blob([bytes], { type: 'application/pdf' }), ext: '.pdf', info };
  }
  return { kind: 'img', items, ext: fmt === 'png' ? '.png' : '.jpg', mime, info };
}

async function exRun(action) {
  const pages = exPages();
  if (!pages.length) return;
  const fmt = chipValue($('#exFormat')) || 'pdf';
  const name = safeName($('#exName').value || Ex.doc.name);
  S.settings.expFormat = fmt; S.settings.expSize = $('#exSize').value; S.settings.expQuality = $('#exQuality').value; saveSettings();
  $('#dlgExport').close();
  try {
    const res = await exBuild(pages, fmt, name);
    let files = [];
    if (res.kind === 'pdf') files = [new File([res.blob], name + res.ext, { type: 'application/pdf' })];
    else files = await Promise.all(res.items.map(async (it, i) => new File([it.blob], res.items.length > 1 ? `${name}-${String(i + 1).padStart(2, '0')}${res.ext}` : name + res.ext, { type: res.mime })));
    if (action === 'share') {
      unbusy();
      if (navigator.canShare && navigator.canShare({ files })) {
        try { await navigator.share({ files, title: name }); }
        catch (e) { if (e && e.name !== 'AbortError') { console.error(e); toast(t('err.share'), 3000, 'err'); } }
        return;
      }
    }
    if (files.length === 1) downloadBlob(files[0], files[0].name);
    else {
      busy(t('busy.zip'), 1);
      await nextFrame();
      const zipFiles = [];
      for (const f of files) zipFiles.push({ name: f.name, data: new Uint8Array(await f.arrayBuffer()) });
      downloadBlob(new Blob([Core.buildZip(zipFiles)], { type: 'application/zip' }), name + '.zip');
    }
    unbusy();
    toast(res.info.lowered ? t('export.lowered', res.info.res) : t('export.doneRes', res.info.res), res.info.lowered ? 4200 : 2600, 'ok');
  } catch (e) {
    console.error(e);
    unbusy();
    toast(t('err.export') + (e && e.message ? ' — ' + e.message : ''), 4500, 'err');
  }
}

async function printPages(pages) {
  if (!pages.length) return;
  const area = $('#printArea');
  area.innerHTML = '';
  const urls = [];
  try {
    for (let i = 0; i < pages.length; i++) {
      busy(t('busy.render', i + 1, pages.length), i / pages.length);
      await nextFrame();
      const r = await renderToBlob(pages[i], 3508, 'image/jpeg', 0.92), url = URL.createObjectURL(r.blob);
      urls.push(url);
      const im = new Image(); im.src = url; im.alt = '';
      area.appendChild(im);
      await im.decode().catch(() => {});
    }
    unbusy();
    const cleanup = () => { area.innerHTML = ''; urls.forEach((u) => URL.revokeObjectURL(u)); window.removeEventListener('afterprint', cleanup); };
    window.addEventListener('afterprint', cleanup);
    setTimeout(() => window.print(), 80);
  } catch (e) { console.error(e); unbusy(); toast(t('err.export'), 3000, 'err'); }
}

/* ------------------------------------------------------------- OCR (optional, loads Tesseract.js on demand) */
const TESS_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
const Oc = { pages: [], running: false };
function ocrOpen(pages) {
  Oc.pages = pages;
  $('#ocrText').value = '';
  chipSet($('#ocrLang'), LANG === 'th' ? 'tha+eng' : 'eng');
  $('#ocrProg').hidden = true;
  $('#ocrStatus').textContent = t('ocr.note');
  $('#dlgOcr').showModal();
  ocrRun();
}
async function ocrRun() {
  if (Oc.running) return;
  Oc.running = true;
  const lang = chipValue($('#ocrLang')) || 'eng', n = Oc.pages.length;
  const prog = $('#ocrProg'), bar = $('#ocrBar'), st = $('#ocrStatus');
  prog.hidden = false; bar.style.width = '2%';
  st.textContent = t('ocr.loading');
  let worker = null;
  try {
    if (!window.Tesseract) await loadScript(TESS_URL);
    let cur = 0;
    worker = await window.Tesseract.createWorker(lang, 1, {
      logger: (m) => {
        if (m.status === 'recognizing text') bar.style.width = Math.round(((cur + m.progress) / n) * 100) + '%';
        else if (typeof m.progress === 'number') st.textContent = t('ocr.loading') + ' ' + Math.round(m.progress * 100) + '%';
      }
    });
    let text = '';
    for (let i = 0; i < n; i++) {
      cur = i;
      st.textContent = t('ocr.page', i + 1, n);
      const c = await renderPage(Oc.pages[i], 'full', 2200);
      const r = await worker.recognize(c);
      text += (n > 1 ? `${i ? '\n\n' : ''}— ${t('page')} ${i + 1} —\n` : '') + (r.data.text || '').trim();
      $('#ocrText').value = text;
    }
    bar.style.width = '100%';
    st.textContent = text.trim() ? t('ocr.done') : t('ocr.empty');
  } catch (e) {
    console.error(e);
    st.textContent = t('ocr.err');
  } finally {
    if (worker) { try { await worker.terminate(); } catch (e) { /* ignore */ } }
    Oc.running = false;
    setTimeout(() => { prog.hidden = true; }, 600);
  }
}

function initExport() {
  const dlg = $('#dlgExport');
  closeOnBackdrop(dlg); closeOnBackdrop($('#dlgOcr')); closeOnBackdrop($('#dlgMenu'));
  chipGroup($('#exFormat'), exUpdateInfo);
  chipGroup($('#exScope'), (v) => { Ex.scope = v; exUpdateInfo(); });

}

/* ---- 70-donate.js ---- */
/* ====================================================================
   DONATE — PromptPay QR (amount filled in), minimum 10 THB
   Everything is generated on the device; nothing is sent anywhere.
   ==================================================================== */
const PROMPTPAY_ID = '0840958691';
const DONATE_MIN = 10, DONATE_MAX = 100000;
const Dn = { amount: 50, valid: true };

const fmtPhone = (n) => n.replace(/^(\d{3})(\d{3})(\d{4})$/, '$1-$2-$3');
const fmtBaht = (v) => (Math.round(v * 100) % 100 === 0 ? String(Math.round(v)) : v.toFixed(2)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

/* draw the QR matrix; quiet zone of 4 modules */
function drawQR(canvas, matrix, px) {
  const n = matrix.length, q = 4, size = (n + q * 2) * px;
  canvas.width = size; canvas.height = size;
  const x = canvas.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, size, size);
  x.fillStyle = '#111';
  for (let y = 0; y < n; y++) for (let k = 0; k < n; k++) if (matrix[y][k]) x.fillRect((k + q) * px, (y + q) * px, px, px);
}

function dnParse() {
  const raw = ($('#dnCustom').value || '').trim().replace(',', '.');
  if (raw === '') return { v: Dn.amount, err: '' };
  const v = Number(raw);
  if (!isFinite(v)) return { v: NaN, err: t('donate.bad') };
  const r = Math.round(v * 100) / 100;
  if (r < DONATE_MIN) return { v: r, err: t('donate.min') };
  if (r > DONATE_MAX) return { v: r, err: t('donate.max') };
  return { v: r, err: '' };
}
function dnRender() {
  const p = dnParse(), box = $('#dnQrBox'), err = $('#dnErr');
  Dn.valid = !p.err;
  err.hidden = !p.err; err.textContent = p.err;
  box.classList.toggle('off', !Dn.valid);
  $('#dnSave').disabled = !Dn.valid; $('#dnDone').disabled = !Dn.valid;
  if (!Dn.valid) return;
  Dn.amount = p.v;
  const m = Core.qrEncode(Core.promptPayPayload(PROMPTPAY_ID, Dn.amount));
  drawQR($('#dnQr'), m, Math.max(4, Math.floor(320 / (m.length + 8))));
}
function openDonate() {
  Dn.amount = 50;
  $('#dnCustom').value = '';
  $$('#dnAmts button').forEach((b) => b.classList.toggle('on', b.dataset.v === '50'));
  $('#dnNum').textContent = fmtPhone(PROMPTPAY_ID);
  dnRender();
  $('#dlgDonate').showModal();
}

/* printable card: big QR + amount + number */
async function dnSaveImage() {
  if (!Dn.valid) return;
  const m = Core.qrEncode(Core.promptPayPayload(PROMPTPAY_ID, Dn.amount));
  const qc = document.createElement('canvas');
  drawQR(qc, m, Math.max(8, Math.floor(720 / (m.length + 8))));
  const W = 900, pad = 60, qs = W - pad * 2, H = pad + 90 + qs + 190;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  x.textAlign = 'center'; x.fillStyle = '#e8470f'; x.font = '700 52px system-ui, "Noto Sans Thai", sans-serif';
  x.fillText('KT-Scan', W / 2, pad + 52);
  x.imageSmoothingEnabled = false;
  x.drawImage(qc, pad, pad + 90, qs, qs);
  x.imageSmoothingEnabled = true;
  x.fillStyle = '#111'; x.font = '700 54px system-ui, "Noto Sans Thai", sans-serif';
  x.fillText(`PromptPay  ${fmtPhone(PROMPTPAY_ID)}`, W / 2, pad + 90 + qs + 70);
  x.font = '600 46px system-ui, "Noto Sans Thai", sans-serif'; x.fillStyle = '#444';
  x.fillText(`${fmtBaht(Dn.amount)} THB`, W / 2, pad + 90 + qs + 140);
  const blob = await canvasToBlob(c, 'image/png');
  downloadBlob(blob, `KT-Scan-donate-${fmtBaht(Dn.amount).replace(/,/g, '')}.png`);
  toast(t('donate.saved'), 1800, 'ok');
}

function initDonate() {
  const dlg = $('#dlgDonate');
  closeOnBackdrop(dlg);
  $('#btnHomeDonate').addEventListener('click', openDonate);
  chipGroup($('#dnAmts'), (v) => { Dn.amount = +v; $('#dnCustom').value = ''; dnRender(); });
  $('#dnCustom').addEventListener('input', () => {
    $$('#dnAmts button').forEach((b) => b.classList.remove('on'));
    const raw = $('#dnCustom').value.trim();
    if (raw === '') { $$('#dnAmts button').forEach((b) => b.classList.toggle('on', +b.dataset.v === Dn.amount)); }
    dnRender();
  });
  $('#dnCopy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(PROMPTPAY_ID); }
    catch (e) { const ta = document.createElement('textarea'); ta.value = PROMPTPAY_ID; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e2) { /* ignore */ } ta.remove(); }
    toast(t('donate.copied'), 1600, 'ok');
  });
  $('#dnSave').addEventListener('click', () => dnSaveImage().catch((e) => { console.error(e); toast(t('err.export'), 2500, 'err'); }));
  $('#dnDone').addEventListener('click', () => { dlg.close(); toast(t('donate.thanks'), 3200, 'ok'); });
}

/* ---- 90-main.js ---- */
/* ====================================================================
   MAIN — startup, global shortcuts, drag & drop
   ==================================================================== */
async function init() {
  applyTheme();
  applyI18n(document);
  fillFilterSelect();
  await DB.open();
  try {
    const recs = await DB.allDocs();
    S.docs = recs.map(hydrateDoc);
  } catch (e) { console.error(e); S.docs = []; }

  initCamera(); initEditor(); initLibrary(); initExport(); initDonate();

  document.addEventListener('pointerdown', () => audio(), { once: true, passive: true });
  window.addEventListener('pagehide', () => { flushSave(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });
  window.addEventListener('unhandledrejection', (e) => console.error('Unhandled', e.reason));

  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input,textarea,select')) return;
    if (document.querySelector('dialog[open]')) return;
    const r = (curRoute || '').split('/')[0];
    if (r === 'scan') {
      if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); camCapture('manual'); }
      else if (e.key === 'Escape') camFinish();
      else if (e.key === 'a' || e.key === 'A') $('#camAuto').click();
    } else if (r === 'edit') {
      if (e.key === 'ArrowLeft') edGo(-1);
      else if (e.key === 'ArrowRight') edGo(1);
      else if (e.key === 'Escape') navBackTo('doc/' + (E.doc ? E.doc.id : ''));
    } else if (r === 'doc') {
      if (e.key === 'Escape') { if (S.selMode) { S.selMode = false; S.sel.clear(); updateSelUI(); } else navBackTo(''); }
      else if ((e.key === 'Delete' || e.key === 'Backspace') && S.selMode && S.sel.size) deleteSelected();
    }
  });

  // drag & drop / paste images (desktop)
  const routeTarget = () => { const r = (curRoute || '').split('/')[0]; return r === 'doc' ? 'doc' : r === 'scan' ? 'cam' : 'home'; };
  window.addEventListener('dragover', (e) => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).indexOf('Files') >= 0) e.preventDefault(); });
  window.addEventListener('drop', (e) => {
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();
    const r = (curRoute || '').split('/')[0];
    if (r === 'edit') return;
    S.importTarget = routeTarget();
    handleImport(Array.from(e.dataTransfer.files));
  });
  document.addEventListener('paste', (e) => {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    const files = Array.from((e.clipboardData && e.clipboardData.files) || []);
    if (!files.length || (curRoute || '').indexOf('edit') === 0) return;
    S.importTarget = routeTarget();
    handleImport(files);
  });

  await route();
  document.documentElement.classList.add('ready');
}
init().catch((e) => { console.error(e); toast(String((e && e.message) || e), 6000, 'err'); });

})();
